.finance-tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:18px;position:sticky;top:88px;z-index:8;padding:8px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);border-radius:16px}
.finance-tab{border:1px solid var(--line);background:#fff;border-radius:14px;min-height:68px;padding:10px 13px;display:flex;gap:11px;align-items:center;text-align:left;color:#475569;box-shadow:0 3px 12px rgba(15,23,42,.035)}
.finance-tab>span{width:34px;height:34px;flex:0 0 34px;border-radius:10px;background:#eef2f7;display:grid;place-items:center;font-weight:900;color:#64748b}.finance-tab div{min-width:0}.finance-tab strong{display:block;font-size:14px;line-height:1.25}.finance-tab small{display:block;margin-top:3px;color:#94a3b8;font-size:11px;line-height:1.35;white-space:normal}
.finance-tab.active{border-color:color-mix(in srgb,var(--project-accent,var(--accent)) 42%,var(--line));background:color-mix(in srgb,var(--project-soft,#eef7f4) 72%,#fff);color:var(--project-ink,var(--brand));box-shadow:0 6px 16px rgba(15,23,42,.06)}.finance-tab.active>span{background:var(--project-accent,var(--accent));color:#fff}
.finance-view{display:none}.finance-view.active{display:block}.finance-section-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin:8px 0 14px}.finance-section-head h2{margin:4px 0 4px;font-size:23px;letter-spacing:-.025em}.finance-section-head p{margin:0;color:var(--muted);font-size:13px;line-height:1.55;max-width:850px}
.finance-card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:18px;box-shadow:0 7px 22px rgba(15,23,42,.035)}.finance-card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;margin-bottom:13px}.finance-card-head h3{margin:2px 0 3px;font-size:18px}.finance-card-head p{margin:0;color:var(--muted);font-size:12px;line-height:1.5;max-width:760px}
.statement-choices{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}.statement-choice{border:1px solid var(--line);background:#fff;border-radius:15px;padding:14px;min-height:104px;text-align:left;display:grid;grid-template-columns:34px 1fr;grid-template-rows:auto auto;column-gap:10px;align-content:center;color:#334155}
.statement-choice>span{grid-row:1/3;width:34px;height:34px;border-radius:10px;background:#eef2f7;display:grid;place-items:center;font-size:12px;font-weight:900;color:#64748b}.statement-choice strong{font-size:14px;line-height:1.3}.statement-choice small{font-size:11px;line-height:1.4;color:#94a3b8;margin-top:3px}.statement-choice:hover{border-color:#cbd5e1;box-shadow:0 5px 15px rgba(15,23,42,.05)}.statement-choice.active{border-color:color-mix(in srgb,var(--project-accent,var(--accent)) 55%,var(--line));background:var(--project-soft,#f0f9ff);color:var(--project-ink,var(--brand))}.statement-choice.active>span{background:var(--project-accent,var(--accent));color:#fff}
.comparative-choices{grid-template-columns:repeat(5,minmax(0,1fr));margin-bottom:15px}.finance-report-controls{margin-bottom:14px}.finance-date-grid{display:grid;grid-template-columns:minmax(180px,1fr) minmax(180px,1fr) minmax(190px,.8fr);gap:12px;align-items:end}.finance-generate .btn{width:100%}
.finance-action-row{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-top:12px}.finance-control-strip{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}.finance-control-strip>span:not(.status){padding:7px 9px;border-radius:10px;background:#f8fafc;color:#64748b;font-size:11px}.finance-control-strip b{color:#0f172a}
.finance-report-shell{margin-top:14px;border-radius:17px}.finance-report-shell .report-paper{box-shadow:0 12px 34px rgba(15,23,42,.07);border:1px solid #e5e7eb}
.finance-mini-metrics{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.finance-mini-metrics span{padding:6px 8px;border-radius:999px;background:#f1f5f9;color:#475569;font-size:10px;font-weight:800;line-height:1.25}.finance-ledger-filter{margin-top:14px}
.finance-control-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.finance-control-grid>div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}.finance-control-grid small{display:block;color:#64748b;font-size:11px;font-weight:800}.finance-control-grid strong{display:block;margin-top:6px;font-size:18px}
@media(max-width:1250px){.finance-summary{grid-template-columns:2fr repeat(2,1fr)}.finance-summary-main{grid-column:1/-1}.comparative-choices{grid-template-columns:repeat(3,1fr)}}
@media(max-width:900px){.finance-summary{grid-template-columns:1fr 1fr}.finance-summary-main{grid-column:1/-1}.finance-tabs{grid-template-columns:1fr;position:static}.statement-choices,.comparative-choices{grid-template-columns:1fr 1fr}.finance-date-grid{grid-template-columns:1fr 1fr}.finance-generate{grid-column:1/-1}.finance-control-grid{grid-template-columns:1fr}.finance-card-head{display:block}.finance-mini-metrics{justify-content:flex-start;margin-top:9px}}
@media(max-width:560px){.finance-summary{grid-template-columns:1fr}.finance-summary-main{grid-column:auto}.statement-choices,.comparative-choices{grid-template-columns:1fr}.finance-date-grid{grid-template-columns:1fr}.finance-generate{grid-column:auto}.finance-action-row .btn{width:100%}.finance-summary-stat strong{font-size:19px}.finance-section-head h2{font-size:21px}}
@media print{.finance-summary,.finance-tabs,.finance-section-head,.finance-report-controls,.finance-builder{display:none!important}.finance-view{display:none!important}.finance-view.active{display:block!important}.finance-report-shell{margin:0;padding:0;border:0}.finance-report-shell .report-paper{border:0;box-shadow:none}}

<body>
<div id="root"></div><div id="modalRoot"></div><div id="drawerRoot"></div><div class="toast-wrap" id="toasts"></div>
<datalist id="accountList"></datalist>
<script>
'use strict';
const DEFAULT_API='https://coop.mdmsportal.uk';
const localHost=['localhost','127.0.0.1'].includes(location.hostname);
const state={api:localStorage.getItem('coop_api')||(localHost?'http://127.0.0.1:5000':DEFAULT_API),token:localStorage.getItem('coop_token')||'',user:null,branding:null,projects:[],accounts:[],currentProject:'consolidated',year:Number(localStorage.getItem('coop_year')||new Date().getFullYear()),page:'dashboard',socket:null,analyticsSelection:JSON.parse(localStorage.getItem('coop_analytics_projects')||'[]')};
const $=(id)=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), money=v=>'₱'+Number(v||0).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2}), dmy=s=>s?new Date(s+'T00:00:00').toLocaleDateString('en-PH',{year:'numeric',month:'short',day:'2-digit'}):'', today=()=>new Date().toISOString().slice(0,10);
function toast(msg,type='success'){const e=document.createElement('div');e.className='toast '+type;e.textContent=msg;$('toasts').appendChild(e);setTimeout(()=>e.remove(),4200)}
async function api(route,opt={}){const r=await fetch(state.api+route,{...opt,headers:{...(opt.body?{'Content-Type':'application/json'}:{}),...(state.token?{Authorization:'Bearer '+state.token}:{}),...(opt.headers||{})}});const ct=r.headers.get('content-type')||'';if(!r.ok){let e;try{e=await r.json()}catch{e={error:'HTTP '+r.status}};if(r.status===401&&route!='/api/auth/login'){if(String(e.error||'').includes('expired'))logout(false)}throw new Error(e.error||'Request failed')}if(ct.includes('application/json'))return r.json();return r.blob()}
async function publicApi(route){const r=await fetch(state.api+route);if(!r.ok)throw new Error('Backend unavailable');return r.json()}
function setBrand(b){state.branding=b||state.branding||{};const s=document.documentElement.style;s.setProperty('--brand',b.primary_color||'#0f172a');s.setProperty('--brand2',b.secondary_color||'#334155');s.setProperty('--accent',b.accent_color||'#0ea5e9');document.title=(b.short_name||'CoopLedger')+' • Accounting';document.querySelector('meta[name=theme-color]').content=b.primary_color||'#0f172a';const apple=document.querySelector('meta[name=apple-mobile-web-app-title]');if(apple)apple.content=b.short_name||'CoopLedger';}
function logoHtml(cls='brand-logo'){const p=state.branding?.logo_path;return `<div class="${cls}">${p?`<img src="${state.api}${esc(p)}" alt="logo">`:'CL'}</div>`}
let deferredInstallPrompt=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstallPrompt=e;updateInstallButton()});window.addEventListener('appinstalled',()=>{deferredInstallPrompt=null;updateInstallButton();toast('CoopLedger installed successfully.')});
function isStandalone(){return window.matchMedia?.('(display-mode: standalone)').matches||window.navigator.standalone===true}
function updateInstallButton(){const b=$('installBtn');if(!b)return;b.classList.toggle('ready',!isStandalone())}
async function installPwa(){if(isStandalone())return toast('CoopLedger is already installed.');if(deferredInstallPrompt){deferredInstallPrompt.prompt();const r=await deferredInstallPrompt.userChoice;deferredInstallPrompt=null;updateInstallButton();if(r.outcome==='accepted')toast('Installation started.');return}const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);modal('Install CoopLedger',`<div class="pwa-note">${ios?'On iPhone/iPad: tap the <b>Share</b> button in Safari, then choose <b>Add to Home Screen</b>.':'Use your browser menu and choose <b>Install app</b> or <b>Add to Home screen</b>. If the option is not shown yet, reload once after the secure GitHub Pages site finishes loading.'}</div>`,`<button class="btn primary" onclick="closeModal()">Got it</button>`)}
async function init(){try{setBrand(await publicApi('/api/public/branding'))}catch{setBrand({coop_name:'CoopLedger',short_name:'CoopLedger'})}if(state.token){try{state.user=await api('/api/me');await loadBasics();renderApp();connectSocket();if(state.user.must_change)passwordModal(true);return}catch{state.token='';localStorage.removeItem('coop_token')}}renderLogin()}
function renderLogin(){const b=state.branding||{};$('root').innerHTML=`<div class="login-wrap"><section class="login-art"><div class="brand-lockup">${logoHtml()}<div><strong>${esc(b.coop_name||'CoopLedger')}</strong><div style="opacity:.65;font-size:12px">Multi-Project Accounting & Financial Management</div></div></div><div class="login-copy"><div class="eyebrow">Cooperative Financial Control</div><h1>One ledger.<br>Every project.<br>Fully transparent.</h1><p>Project-aware accounting, reconciled financial statements, protected audit trails, historical posting, live approvals, and consolidated management analytics.</p><div class="trust-row"><span class="trust-pill">Double-entry accounting</span><span class="trust-pill">Role-based projects</span><span class="trust-pill">Live audit controls</span><span class="trust-pill">PWA ready</span></div></div><div style="font-size:11px;opacity:.5">CoopLedger v2.1 • Simplified Financial Center + project-aware accounting PWA</div></section><section class="login-panel"><form class="login-card" id="loginForm"><div class="eyebrow" style="color:var(--accent)">Secure access</div><h2>Welcome back</h2><p class="muted">Sign in with your cooperative account.</p><div class="field"><label>Username</label><input class="input" id="loginUser" autocomplete="username" required></div><div class="field"><label>Password</label><input class="input" id="loginPass" type="password" autocomplete="current-password" required></div><button class="btn primary full" type="submit">Sign in to CoopLedger</button><div id="loginError"></div><div style="margin-top:24px;font-size:11px;color:#94a3b8;line-height:1.6">Backend: <span class="mono">${esc(state.api)}</span><br>If this is first deployment, your initial Super Admin credential is generated locally by the backend.</div></form></section></div>`;$('loginForm').onsubmit=login}
async function login(e){e.preventDefault();$('loginError').innerHTML='';try{const x=await api('/api/auth/login',{method:'POST',body:JSON.stringify({username:$('loginUser').value,password:$('loginPass').value})});state.token=x.token;localStorage.setItem('coop_token',state.token);state.user=x.user;await loadBasics();renderApp();connectSocket();if(state.user.must_change)passwordModal(true)}catch(err){$('loginError').innerHTML=`<div class="login-error">${esc(err.message)}</div>`}}
function logout(call=true){if(call&&state.token)api('/api/auth/logout',{method:'POST'}).catch(()=>{});state.token='';state.user=null;localStorage.removeItem('coop_token');try{state.socket?.disconnect()}catch{}renderLogin()}
async function loadBasics(){const [p,a]=await Promise.all([api('/api/projects'),api('/api/accounts')]);state.projects=p.projects;state.accounts=a.accounts;if(!state.analyticsSelection.length)state.analyticsSelection=state.projects.map(x=>x.id);$('accountList')&&fillAccountList()}
function fillAccountList(){const d=$('accountList');if(d)d.innerHTML=state.accounts.map(a=>`<option value="${esc(a.code+' • '+a.name)}"></option>`).join('')}
function roleIs(...r){return r.includes(state.user?.role)}
function currentPid(){return state.currentProject==='consolidated'?null:Number(state.currentProject)}
function currentProjectObj(){return state.projects.find(p=>p.id===currentPid())}
const PROJECT_EXPERIENCE={
consolidated:{symbol:'◆',kicker:'Executive Cooperative View',title:'Cooperative Portfolio Command Center',desc:'Cross-project performance, liquidity, financial position and reconciliation controls in one executive workspace.'},
P01:{symbol:'🌾',kicker:'Production Credit Desk',title:'Palay Production Loan Portfolio',desc:'Farmer-focused lending oversight with releases, collections, outstanding principal and portfolio-to-ledger control.'},
P02:{symbol:'◈',kicker:'Grain Market Operations',title:'Palay Marketing & Inventory',desc:'Batch-based purchasing, drying, milling, warehouse inventory, walk-in sales and consignee stock performance.'},
P03:{symbol:'⚙',kicker:'Field Machinery Desk',title:'Farm Services Performance',desc:'Service-line utilization and revenue intelligence for land preparation, hauling, harvesting and drying services.'},
P04:{symbol:'▦',kicker:'Property Operations',title:'Rental Building Management',desc:'Occupancy, billing, utilities, collections and tenant receivables built around the cooperative property portfolio.'},
P05:{symbol:'₱',kicker:'Cash Credit Desk',title:'Lending Activities Portfolio',desc:'Cash-loan releases, repayments, interest earnings and outstanding portfolio controls for member lending.'},
P06:{symbol:'❧',kicker:'Community Agriculture',title:'Communal Agricultural Operations',desc:'Income and production-cost visibility across cooperative agricultural activities and shared projects.'}}
function projectExperience(){const p=currentProjectObj();return PROJECT_EXPERIENCE[p?.code||'consolidated']||PROJECT_EXPERIENCE.consolidated}
function applyProjectExperience(){const p=currentProjectObj();document.documentElement.dataset.project=p?.code||'consolidated'}
function projectMetric(label,value,note=''){return `<div class="project-metric"><div class="pm-label">${esc(label)}</div><div class="pm-value money">${value}</div><div class="pm-note">${esc(note)}</div></div>`}
function projectHero(p,o,summary){const x=PROJECT_EXPERIENCE[p.code]||PROJECT_EXPERIENCE.consolidated;let big=money(summary.net),label='Net Surplus',detail=`FY ${state.year} • ${summary.reconciled?'Accounting controls reconciled':'Review accounting controls'}`;if(p.code==='P01'){big=money(o.outstanding);label='Outstanding Production Loans';detail=`${o.active||0} active • ${o.overdue||0} overdue • ${numFmt(o.collection_rate_pct||0)}% principal collected`;}if(p.code==='P02'){big=money(o.inventory_value||0);label='Inventory Book Value';detail=`${numFmt(o.inventory_qty||0)} kg on books • ${o.batch_count||0} batches • ${o.open_consignments||0} open consignments`;}if(p.code==='P03'){big=money(o.total_revenue||0);label='Service Revenue';detail=`${o.transaction_count||0} service transactions • Net contribution ${money(o.net_contribution||0)}`;}if(p.code==='P04'){big=`${numFmt(o.occupancy_pct||0)}%`;label='Building Occupancy';detail=`${o.occupied||0}/${o.units||0} occupied • Receivable ${money(o.receivable||0)} • ${o.bills_count||0} bills this period`;}if(p.code==='P05'){big=money(o.outstanding);label='Cash Loan Portfolio';detail=`${o.active||0} active • Interest collected ${money(o.period_interest_collected||0)} • ${numFmt(o.collection_rate_pct||0)}% principal collected`;}if(p.code==='P06'){big=money(o.net||0);label='Agricultural Net Result';detail=`Income ${money(o.income||0)} • Expense ${money(o.expense||0)} • ${o.transaction_count||0} guided activities`;}return `<section class="project-hero"><div><div class="project-kicker"><span class="project-symbol">${x.symbol}</span>${esc(x.kicker)}</div><h2>${esc(x.title)}</h2><p>${esc(x.desc)}</p><div class="hero-actions"><button class="btn accent" onclick="navigate('operations')">Open Project Operations</button><button class="btn soft" onclick="navigate('money')">Money Center</button><button class="btn soft" onclick="openFinancialCenter('statements')">Financial Center</button></div></div><aside class="hero-side"><div class="hero-number">${big}</div><div class="hero-label">${esc(label)}</div><div class="hero-detail">${detail}</div></aside></section>`}
function projectMetrics(p,o,summary){if(p.code==='P01')return projectMetric('Released This FY',money(o.period_releases||0),'Production credit deployed')+projectMetric('Principal Collected',money(o.period_principal_collected||0),'During selected fiscal year')+projectMetric('Interest Collected',money(o.period_interest_collected||0),'Recognized lending income')+projectMetric('Subledger Difference',money(o.subledger_difference||0),'Loan portfolio vs GL control');if(p.code==='P02')return projectMetric('Sales',money(o.sales||0),'Ledger-authoritative rice sales')+projectMetric('Gross Profit',money(o.gross_profit||0),`${numFmt(o.gross_margin_pct||0)}% gross margin`)+projectMetric('Stock with Stores',`${numFmt(o.consigned_qty||0)} kg`,`${o.open_consignments||0} open dispatches`)+projectMetric('Store Receivable',money(o.consignment_net_receivable||0),'Net of consignee share');if(p.code==='P03')return projectMetric('Service Revenue',money(o.total_revenue||0),'Ledger-authoritative')+projectMetric('Actual Direct Cost',money(o.total_direct_cost||0),'Posted service costs')+projectMetric('Net Contribution',money(o.net_contribution||0),'Revenue less direct cost')+projectMetric('Service Transactions',numFmt(o.transaction_count||0),'Across configured service lines');if(p.code==='P04')return projectMetric('Billed This FY',money(o.billed||0),`${o.bills_count||0} bills issued`)+projectMetric('Collected',money(o.collected||0),`${numFmt(o.collection_rate_pct||0)}% of period billing`)+projectMetric('Receivable',money(o.receivable||0),'Outstanding by unit as of period end')+projectMetric('Vacant Units',numFmt(o.vacant||0),`${o.units||0} total active units`);if(p.code==='P05')return projectMetric('Released This FY',money(o.period_releases||0),'Cash lending releases')+projectMetric('Principal Collected',money(o.period_principal_collected||0),'Capital recovered')+projectMetric('Interest Income',money(o.period_interest_collected||0),'Collected this fiscal year')+projectMetric('Overdue Loans',numFmt(o.overdue||0),'Outstanding beyond due date');return projectMetric('Agricultural Income',money(o.income||0),'Ledger-derived')+projectMetric('Project Expenses',money(o.expense||0),'All project operating costs')+projectMetric('Net Result',money(o.net||0),'Income less expenses')+projectMetric('Activities',numFmt(o.transaction_count||0),'Guided operating transactions')}
function navItems(){const p=currentProjectObj(),items=[['OVERVIEW','dashboard','◫','Dashboard']];if(state.currentProject!=='consolidated'){items.push(['WORKSPACE','operations','◎','Project Operations'],['WORKSPACE','money','₱','Money Center'],['FINANCE','financials','▤','Financial Center'],['CONTROL','audit','⌁','Audit Trail']);}else items.push(['FINANCE','financials','▤','Financial Center'],['CONTROL','audit','⌁','General Audit Trail']);if(roleIs('SUPERADMIN'))items.push(['CONTROL','approvals','✓','Approval Queue'],['ADMINISTRATION','users','♙','Users & Project Access'],['ADMINISTRATION','periods','◷','Accounting Periods'],['ADMINISTRATION','backup','↥','Backup & Restore'],['ADMINISTRATION','settings','⚙','System Settings']);return items}

function prepCanvas(id){const c=$(id);if(!c)return null;const r=c.getBoundingClientRect(),d=Math.min(2,devicePixelRatio||1);c.width=Math.max(300,r.width*d);c.height=Math.max(180,r.height*d);const x=c.getContext('2d');x.setTransform(d,0,0,d,0,0);return {c,x,w:r.width,h:r.height}}

function grid(ctx,w,h,pad,max,labels){ctx.strokeStyle='#e8edf4';ctx.lineWidth=1;ctx.fillStyle='#94a3b8';ctx.font='10px system-ui';for(let i=0;i<=4;i++){const y=pad.t+(h-pad.t-pad.b)*i/4;ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(w-pad.r,y);ctx.stroke();const v=max*(1-i/4);ctx.fillText(shortNum(v),4,y+3)}if(labels?.length){const step=(w-pad.l-pad.r)/Math.max(1,labels.length-1);labels.forEach((l,i)=>{if(labels.length>8&&i%2) return;ctx.fillText(String(l).slice(5),pad.l+i*step-10,h-7)})}}

function lineChart(id,labels,sets){const p=prepCanvas(id);if(!p)return;const {x,w,h}=p,pad={l:46,r:18,t:20,b:30},mx=Math.max(1,...sets.flatMap(s=>s.data.map(v=>Math.abs(Number(v||0)))));animateChart(pr=>{x.clearRect(0,0,w,h);grid(x,w,h,pad,mx,labels);const step=(w-pad.l-pad.r)/Math.max(1,labels.length-1);sets.forEach((s,si)=>{x.strokeStyle=s.color||palette()[si];x.lineWidth=2.5;x.lineJoin='round';x.lineCap='round';x.beginPath();s.data.forEach((v,i)=>{const xx=pad.l+i*step,yy=h-pad.b-(Number(v||0)/mx)*(h-pad.t-pad.b)*pr;i?x.lineTo(xx,yy):x.moveTo(xx,yy)});x.stroke();x.globalAlpha=.08;x.lineTo(pad.l+(labels.length-1)*step,h-pad.b);x.lineTo(pad.l,h-pad.b);x.closePath();x.fillStyle=s.color||palette()[si];x.fill();x.globalAlpha=1});},600)}
function barChart(id,labels,sets){const p=prepCanvas(id);if(!p)return;const {x,w,h}=p,pad={l:46,r:16,t:20,b:42},all=sets.flatMap(s=>s.data.map(Number)),mx=Math.max(1,...all.map(Math.abs)),group=(w-pad.l-pad.r)/Math.max(1,labels.length),bw=Math.max(4,Math.min(24,(group*.72)/sets.length));animateChart(pr=>{x.clearRect(0,0,w,h);grid(x,w,h,pad,mx,[]);labels.forEach((l,i)=>{x.fillStyle='#64748b';x.font='10px system-ui';x.save();x.translate(pad.l+i*group+group/2,h-8);if(labels.length>6)x.rotate(-.35);x.textAlign='center';x.fillText(String(l).slice(0,15),0,0);x.restore();sets.forEach((s,j)=>{const v=Number(s.data[i]||0),bh=(Math.abs(v)/mx)*(h-pad.t-pad.b)*pr,xx=pad.l+i*group+group/2-(sets.length*bw)/2+j*bw,yy=h-pad.b-bh;x.fillStyle=s.color||palette()[j];roundRect(x,xx,yy,bw-2,bh,4);x.fill()})})},600)}
function roundRect(c,x,y,w,h,r){if(h<0){y+=h;h=-h}r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function donutChart(id,labels,values){const p=prepCanvas(id);if(!p)return;const {x,w,h}=p,total=Math.max(.0001,values.reduce((a,b)=>a+Math.abs(Number(b||0)),0)),cx=w*.42,cy=h*.5,r=Math.min(w,h)*.3,cols=palette();animateChart(pr=>{x.clearRect(0,0,w,h);let a=-Math.PI/2;values.forEach((v,i)=>{const d=Math.PI*2*(Math.abs(v)/total)*pr;x.strokeStyle=cols[i%cols.length];x.lineWidth=22;x.beginPath();x.arc(cx,cy,r,a,a+d);x.stroke();a+=d});x.fillStyle='#0f172a';x.font='800 19px system-ui';x.textAlign='center';x.fillText(shortNum(total),cx,cy+5);x.textAlign='left';x.font='11px system-ui';labels.forEach((l,i)=>{const yy=28+i*20;x.fillStyle=cols[i%cols.length];x.fillRect(w*.72,yy-8,9,9);x.fillStyle='#475569';x.fillText(String(l).slice(0,20),w*.72+15,yy)})},550)}

async function previewMoney(direction){const box=$('moneyPreview'),btn=$('moneyPostBtn');if(!box)return;const cat=(window.moneyCatalog?.categories||[]).find(x=>x.key===$('moneyCategory')?.value);if($('moneyPurposeHelp'))$('moneyPurposeHelp').textContent=(cat?.help||'')+(cat?.requires_reference?' Supporting reference is required.':'');const amount=Number($('moneyAmount')?.value||0),desc=$('moneyDescription')?.value?.trim()||'';if(!(amount>0)||desc.length<3){btn.disabled=true;box.innerHTML='<div class="money-preview-card money-preview-wide"><span>Accounting preview</span><strong>Enter a positive amount and a clear description.</strong></div>';return}try{const r=await api('/api/money/preview',{method:'POST',body:JSON.stringify({projectId:currentPid(),direction,category:$('moneyCategory').value,fund_account_code:$('moneyFund').value,date:$('moneyDate').value,amount,reference:$('moneyReference').value,description:desc})});window.moneyPreviewData=r;btn.disabled=false;box.innerHTML=`<div class="money-preview-card"><span>Fund Balance Before</span><strong>${money(r.fund.balance_before)}</strong></div><div class="money-preview-card"><span>Fund Balance After</span><strong>${money(r.fund.balance_after)}</strong></div><div class="money-preview-card"><span>Debit</span><strong>${esc(r.accounting.debit.code+' • '+r.accounting.debit.name)} — ${money(r.amount)}</strong></div><div class="money-preview-card"><span>Credit</span><strong>${esc(r.accounting.credit.code+' • '+r.accounting.credit.name)} — ${money(r.amount)}</strong></div><div class="money-preview-card"><span>Cash Flow</span><strong>${esc(r.accounting.cash_flow_class)}</strong></div><div class="money-preview-card"><span>Income Statement</span><strong>${esc(r.accounting.income_statement_effect)}</strong></div><div class="money-preview-card money-preview-wide"><span>Business / Balance Sheet Effect</span><strong>${esc(r.accounting.balance_sheet_effect)}</strong>${r.special_balance!=null?`<div class="money-purpose-help">Available async function showTransaction(id){try{const e=await api('/api/transactions/'+id);$('drawerRoot').innerHTML=`<aside class="drawer"><div class="drawer-head"><button class="icon-btn" onclick="closeDrawer()">×</button><div><strong>${esc(e.ref)}</strong><div class="muted" style="font-size:11px">${esc(e.source_type.replaceAll('_',' '))}</div></div><div class="spacer"></div><span class="status posted">Posted</span></div><div class="drawer-body"><dl class="detail-list"><dt>Project</dt><dd>${esc(e.project_code+' • '+e.project_name)}</dd><dt>Accounting date</dt><dd>${dmy(e.tx_date)}</dd><dt>Encoded at</dt><dd>${new Date(e.encoded_at).toLocaleString()}</dd><dt>Description</dt><dd>${esc(e.description)}</dd><dt>Created by</dt><dd>${esc(e.created_by_name)}</dd></dl><h4>Journal Distribution</h4><div class="table-wrap"><table class="table"><thead><tr><th>Account</th><th>Debit</th><th>Credit</th></tr></thead><tbody>${e.lines.map(l=>`<tr><td>${esc(l.account_code+' • '+l.account_name)}</td><td class="money">${l.debit?money(l.debit):''}</td><td class="money">${l.credit?money(l.credit):''}</td></tr>`).join('')}</tbody></table></div>${!e.reversal_of?`<div style="margin-top:18px"><button class="btn danger" onclick="requestVoid(${e.id},'${esc(e.ref)}')">Request Void / Reversal</button>${e.source_type==='JOURNAL'?` <button class="btn soft" onclick="requestCorrection(${e.id})">Request Correction</button>`:''}</div>`:''}</div></aside>`}catch(e){toast(e.message,'error')}}
function closeDrawer(){$('drawerRoot').innerHTML=''}
function modal(title,body,footer='',lg=false){$('modalRoot').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal ${lg?'lg':''}"><div class="modal-head"><h3>${esc(title)}</h3><div class="spacer"></div><button class="icon-btn" onclick="closeModal()">×</button></div><div class="modal-body">${body}</div>${footer?`<div class="modal-foot">${footer}</div>`:''}</div></div>`}
function closeModal(){$('modalRoot').innerHTML=''}
function accountInput(id,val=''){return `<input class="input acct" id="${id}" list="accountList" value="${esc(val)}" placeholder="Search account code or name…">`}
function accountCode(v){return String(v||'').split('•')[0].trim()}
function accountObj(code){return state.accounts.find(a=>a.code===accountCode(code))||null}
function inferClientCF(lines){const xs=(lines||[]).map(l=>({...l,a:accountObj(l.account_code)}));const cash=xs.filter(x=>x.a&&(x.a.subtype==='CASH'||x.a.subtype==='BANK'||['1000','1010'].includes(x.a.code)));if(!cash.length)return 'NONE';const other=xs.filter(x=>!cash.includes(x));if(other.some(x=>x.a&&(x.a.subtype==='PPE'||x.a.subtype==='ACCUM_DEPR'||String(x.a.name||'').toLowerCase().includes('property')||String(x.a.name||'').toLowerCase().includes('equipment'))))return 'INVESTING';if(other.some(x=>x.a&&(x.a.type==='EQUITY'||x.a.subtype==='LOAN_PAYABLE'||String(x.a.name||'').toLowerCase().includes('loan payable'))))return 'FINANCING';return 'OPERATING'}
function autoCFInput(id,value='OPERATING'){return `<input class="input auto-field" id="${id}" value="${esc(value)}" disabled><div class="auto-note">Automatic based on the transaction/accounting effect. Dili na kinahanglan pilion.</div>`}
function p02UnitLabel(u){return ({KG:'kg',SACK:'sack',HALF_SACK:'1/2 sack',QUARTER_SACK:'1/4 sack','10KG_PACK':'10 kg pack','5KG_PACK':'5 kg pack'})[String(u||'KG').toUpperCase()]||'kg'}
function p02UnitFactor(u,sackKg=null){const sk=Number(sackKg||window.p02Settings?.sack_kg||50),x=String(u||'KG').toUpperCase();if(x==='SACK')return sk;if(x==='HALF_SACK')return sk/2;if(x==='QUARTER_SACK')return sk/4;if(x==='10KG_PACK')return 10;if(x==='5KG_PACK')return 5;return 1}
function p02UnitOptions(selected='KG'){const a=[['KG','kg'],['SACK','1 sack'],['HALF_SACK','1/2 sack'],['QUARTER_SACK','1/4 sack'],['10KG_PACK','10 kg pack'],['5KG_PACK','5 kg pack']];return a.map(([v,l])=>`<option value="${v}" ${String(selected).toUpperCase()===v?'selected':''}>${l}</option>`).join('')}
function p02SackEquivalent(qtyKg){const sk=Number(window.p02Settings?.sack_kg||50);return sk>0?`${numFmt(Number(qtyKg||0)/sk)} sack equivalent @ ${numFmt(sk)} kg/sack`:''}
function guide(text){return `<div class="guide"><strong>Pananglitan / Giya:</strong> ${text}</div>`}
function batchInv(b,code){return (b?.inventory||[]).find(x=>x.code===code)||{qty:0,cost:0,unit_cost:0,unit:'kg'}}
function journalRow(i,line={}){const acc=line.account_code?`${line.account_code} • ${state.accounts.find(a=>a.code===line.account_code)?.name||''}`:'';return `<div class="journal-row" data-row="${i}">${accountInput('ja'+i,acc)}<input class="input" id="jd${i}" type="number" step="0.01" min="0" value="${line.debit||''}" placeholder="Debit"><input class="input" id="jc${i}" type="number" step="0.01" min="0" value="${line.credit||''}" placeholder="Credit"><button class="icon-btn" onclick="this.closest('.journal-row').remove();calcJournal()">×</button></div>`}
function newJournalModal(prefill=null){if(!prefill&&!roleIs('SUPERADMIN')){toast('Project transactions should be encoded from Project Operations to reduce manual accounting errors.','error');return navigate('operations')}let seq=2;modal(prefill?'Proposed Corrected Journal':'New Journal Entry',`<div class="form-grid"><div class="field"><label>Project</label><input class="input auto-field" value="${esc(currentProjectObj().code+' • '+currentProjectObj().name)}" disabled></div><div class="field"><label>Accounting Date</label><input class="input" id="jDate" type="date" value="${prefill?.date||today()}"></div><div class="field span2"><label>Description / Particulars</label><input class="input" id="jDesc" value="${esc(prefill?.description||'')}" placeholder="Unsa ang nahitabo sa transaksyon?"></div><div class="field"><label>Cash Flow Classification — Automatic</label>${autoCFInput('jCF','NONE')}</div></div>${guide('Kung mopalit og equipment nga cash: Debit Property & Equipment, Credit Cash. Ang sistema mismo mo-classify niini isip INVESTING. Kung ordinaryong gasto/kita nga cash, OPERATING.') }<div style="margin-top:20px"><div class="panel-head"><div><h3>Account Distribution</h3><p>Pilia lang ang accounts ug amount; automatic ang Cash Flow type.</p></div><div class="spacer"></div><button class="btn soft sm" id="addJRow">+ Line</button></div><div class="journal-lines" id="jRows">${(prefill?.lines||[{},{ }]).map((l,i)=>journalRow(i+1,l)).join('')}</div><div class="journal-total"><span>Debit <b id="jDebit">₱0.00</b></span><span>Credit <b id="jCredit">₱0.00</b></span><span>Difference <b id="jDiff">₱0.00</b></span></div></div>`,`<button class="btn soft" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="postJournal()">Post Journal Entry</button>`,true);$('addJRow').onclick=()=>{$('jRows').insertAdjacentHTML('beforeend',journalRow(++seq));bindJournalCalc()};bindJournalCalc();if(state.year<new Date().getFullYear())toast('Historical accounting date is enabled and will remain separately auditable.','success')}
function bindJournalCalc(){document.querySelectorAll('#jRows input').forEach(x=>{x.oninput=calcJournal;x.onchange=calcJournal});calcJournal()}
function calcJournal(){let d=0,c=0,lines=[];document.querySelectorAll('.journal-row').forEach(r=>{const i=r.dataset.row,account_code=accountCode($('ja'+i)?.value),debit=Number($('jd'+i)?.value||0),credit=Number($('jc'+i)?.value||0);d+=debit;c+=credit;if(account_code&&(debit||credit))lines.push({account_code,debit,credit})});if($('jDebit')){$('jDebit').textContent=money(d);$('jCredit').textContent=money(c);$('jDiff').textContent=money(d-c);$('jDiff').className=Math.abs(d-c)<.005?'good':'bad'}if($('jCF'))$('jCF').value=inferClientCF(lines)}
async function postJournal(){try{const lines=[];document.querySelectorAll('.journal-row').forEach(r=>{const i=r.dataset.row,code=accountCode($('ja'+i)?.value),debit=Number($('jd'+i)?.value||0),credit=Number($('jc'+i)?.value||0);if(code&&(debit||credit))lines.push({account_code:code,debit,credit})});await api('/api/journal',{method:'POST',body:JSON.stringify({projectId:currentPid(),date:$('jDate').value,description:$('jDesc').value,lines})});closeModal();toast('Journal entry posted. Cash Flow classification was assigned automatically.');loadPage()}catch(e){toast(e.message,'error')}}
function cashModal(kind){if(!roleIs('SUPERADMIN')){toast('Use Project Operations. Generic cash posting is restricted to Super Admin.','error');return navigate('operations')}const receipt=kind==='receipt',def=receipt?'4080 • Other Operating Income':'6060 • Other Operating Expense';modal(receipt?'Cash Receipt':'Cash Disbursement',`<div class="form-grid"><div class="field"><label>Accounting Date</label><input class="input" id="cashDate" type="date" value="${today()}"></div><div class="field"><label>Amount</label><input class="input big-input" id="cashAmt" type="number" min="0" step="0.01" placeholder="0.00"></div><div class="field span2"><label>Description</label><input class="input" id="cashDesc" placeholder="Mubo nga detalye sa transaksyon"></div><div class="field span2"><label>${receipt?'Asa gikan ang kita / Credit Account':'Unsa nga gasto / Debit Account'}</label>${accountInput('cashAcct',def)}</div><div class="field"><label>Cash Flow Type — Automatic</label>${autoCFInput('cashCF','OPERATING')}</div></div>${guide(receipt?'Pananglitan: nadawat ₱5,000 nga agricultural/other income. Ibutang ang amount, mubo nga description, ug pili-a ang sakto nga income account.':'Pananglitan: gibayran ₱3,500 diesel. Ibutang ang amount ug pili-a “Fuel and Lubricants.” Automatic na ang Cash Flow classification.')}`,`<button class="btn soft" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveCash('${kind}')">Post</button>`);const a=$('cashAcct');const upd=()=>{if($('cashCF'))$('cashCF').value=inferClientCF([{account_code:'1000',debit:receipt?1:0,credit:receipt?0:1},{account_code:accountCode(a.value),debit:receipt?0:1,credit:receipt?1:0}])};a.oninput=upd;a.onchange=upd;upd()}
async function saveCash(kind){try{const receipt=kind==='receipt',body={projectId:currentPid(),date:$('cashDate').value,amount:Number($('cashAmt').value),description:$('cashDesc').value};body[receipt?'credit_account_code':'debit_account_code']=accountCode($('cashAcct').value);await api('/api/cash/'+kind,{method:'POST',body:JSON.stringify(body)});closeModal();toast('Cash transaction posted with automatic Cash Flow classification.');loadPage()}catch(e){toast(e.message,'error')}}
async function projectSettlementModal(kind){const isAR=kind==='AR',label=isAR?'Collect Project Receivable':'Pay Project Payable';modal(label,`<div class="notice info">${isAR?'Use this for ordinary project credit sales/services (Accounts Receivable 1100). For P02 consignment Store AR, use the Consignment Collect AR button.':'Use this for ordinary supplier/project Accounts Payable 2000.'}</div><div class="form-grid"><div class="field"><label>Accounting Date</label><input class="input" id="settleDate" type="date" value="${today()}" onchange="refreshSettlementBalance('${kind}')"></div><div class="field"><label>${isAR?'Receivable':'Payable'} Balance — Automatic</label><input class="input auto-field big-input" id="settleBal" value="Loading…" disabled></div><div class="field"><label>${isAR?'Amount Collected':'Amount Paid'}</label><input class="input big-input" id="settleAmt" type="number" min="0.01" step="0.01" placeholder="0.00"></div><div class="field"><label>Cash Flow — Automatic</label>${autoCFInput('settleCF','OPERATING')}</div><div class="field span2"><label>Description</label><input class="input" id="settleDesc" value="${isAR?'Project receivable collection':'Supplier / project payable payment'}"></div></div>${guide(isAR?'Pananglitan: naa pay ₱2,100 ordinary customer AR. I-click Collect Receivable, review automatic balance, then enter actual amount received. Dr Cash / Cr Accounts Receivable; no new revenue.':'Pananglitan: naa pay ₱2,100 supplier AP. I-click Pay Payable, review automatic balance, then enter actual amount paid. Dr Accounts Payable / Cr Cash; no new expense.')}`,`<button class="btn soft" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveProjectSettlement('${kind}')">${isAR?'Record Collection':'Record Payment'}</button>`);refreshSettlementBalance(kind)}
async function refreshSettlementBalance(kind){try{const date=$('settleDate')?.value||today(),r=await api(`/api/reports?projectId=${currentPid()}&from=1900-01-01&to=${date}`),isAR=kind==='AR',rows=isAR?r.balance_sheet.assets:r.balance_sheet.liabilities,code=isAR?'1100':'2000',bal=Math.max(0,Number(rows.find(x=>x.code===code)?.amount||0));if($('settleBal'))$('settleBal').value=money(bal);if($('settleAmt')&&!Number($('settleAmt').value))$('settleAmt').value=bal?bal.toFixed(2):'';window.projectSettlementBalance=bal}catch(e){if($('settleBal'))$('settleBal').value='Unable to load';toast(e.message,'error')}}

function buildComparativePeriodsFromControls(){let a=[];if(comparativeMode==='YEARS'){const f=Number($('cmpYearFrom').value),t=Number($('cmpYearTo').value);if(!Number.isInteger(f)||!Number.isInteger(t)||f>t)throw new Error('Enter a valid First Year and Last Year.');for(let y=f;y<=t;y++)a.push({label:String(y),from:`${y}-01-01`,to:`${y}-12-31`});}
else if(comparativeMode==='MONTHS'){let f=$('cmpMonthFrom').value,t=$('cmpMonthTo').value;if(!/^\d{4}-\d{2}$/.test(f)||!/^\d{4}-\d{2}$/.test(t)||f>t)throw new Error('Choose a valid First Month and Last Month.');let [y,m]=f.split('-').map(Number);while(true){const ym=`${y}-${String(m).padStart(2,'0')}`;a.push({label:new Date(`${ym}-01T00:00:00Z`).toLocaleDateString('en-PH',{year:'numeric',month:'short',timeZone:'UTC'}),from:`${ym}-01`,to:lastDayOfMonth(ym)});if(ym===t)break;m++;if(m>12){m=1;y++}if(a.length>36)break;}}
else if(comparativeMode==='WEEKS'){const start=$('cmpWeekStart').value,count=Number($('cmpWeekCount').value);if(!start||!Number.isInteger(count)||count<2||count>36)throw new Error('Weekly comparison needs a valid start date and 2–36 weeks.');const d=new Date(`${start}T00:00:00Z`);for(let i=0;i<count;i++){const f=new Date(d);f.setUTCDate(f.getUTCDate()+i*7);const t=new Date(f);t.setUTCDate(t.getUTCDate()+6);const fs=f.toISOString().slice(0,10),ts=t.toISOString().slice(0,10);a.push({label:`Week ${i+1} • ${f.toLocaleDateString('en-PH',{month:'short',day:'2-digit',year:'numeric',timeZone:'UTC'})}`,from:fs,to:ts});}}
else a=collectCustomPeriodRows(false);
if(a.length<2)throw new Error('Comparative reports require at least 2 periods.');if(a.length>36)throw new Error('Maximum 36 comparative periods per generation.');return a;}

function submissionNumber(v){v=Number(v||0);if(Math.abs(v)<.005)return '-';const a=Math.abs(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});return v<0?`(${a})`:a}

function reportHtml(type,r,scope){let rows='';if(type==='income-statement'){rows+=sectionRow('REVENUE');for(const x of r.income_statement.revenue)rows+=acctRow(x.code,x.name,x.amount);rows+=totalRow('TOTAL REVENUE',r.income_statement.total_revenue)+sectionRow('OPERATING EXPENSES');for(const x of r.income_statement.expenses)rows+=acctRow(x.code,x.name,x.amount);rows+=totalRow('TOTAL EXPENSES',r.income_statement.total_expenses)+totalRow('NET SURPLUS / (DEFICIT)',r.income_statement.net_surplus);return reportHeader(scope,'STATEMENT OF OPERATIONS / INCOME STATEMENT',`For the period ${dmy(r.from)} to ${dmy(r.to)}`)+`<table class="statement">${rows}</table>`+reportFoot(r)}if(type==='balance-sheet'){rows+=sectionRow('ASSETS');for(const x of r.balance_sheet.assets)rows+=acctRow(x.code,x.name,x.amount);rows+=totalRow('TOTAL ASSETS',r.balance_sheet.total_assets)+sectionRow('LIABILITIES');for(const x of r.balance_sheet.liabilities)rows+=acctRow(x.code,x.name,x.amount);rows+=totalRow('TOTAL LIABILITIES',r.balance_sheet.total_liabilities)+sectionRow('EQUITY');for(const x of r.balance_sheet.equity)rows+=x.code==='CURRENT'?`<tr><td>${esc(x.name)}</td><td>${money(x.amount)}</td></tr>`:acctRow(x.code,x.name,x.amount);rows+=totalRow('TOTAL EQUITY',r.balance_sheet.total_equity)+totalRow('BALANCE CHECK',r.balance_sheet.balance_check);return reportHeader(scope,'STATEMENT OF FINANCIAL POSITION / BALANCE SHEET',`As of ${dmy(r.to)}`)+`<table class="statement">${rows}</table>`+reportFoot(r)}if(type==='trial-balance'){rows=`<tr class="section"><td>ACCOUNT</td><td style="text-align:right">DEBIT</td><td style="text-align:right">CREDIT</td></tr>`+r.trial_balance.rows.map(x=>`<tr class="acct-click" onclick="ledgerDrill('${esc(x.code)}')"><td><span class="mono">${esc(x.code)}</span> • ${esc(x.name)}</td><td>${x.debit?money(x.debit):''}</td><td>${x.credit?money(x.credit):''}</td></tr>`).join('')+`<tr class="total"><td>TOTAL</td><td>${money(r.trial_balance.total_debit)}</td><td>${money(r.trial_balance.total_credit)}</td></tr><tr class="total"><td>DIFFERENCE</td><td colspan="2">${money(r.trial_balance.difference)}</td></tr>`;return reportHeader(scope,'TRIAL BALANCE',`For the period ${dmy(r.from)} to ${dmy(r.to)}`)+`<table class="statement">${rows}</table>`+reportFoot(r)}const cf=r.cash_flow;rows=`<tr><td>Beginning Cash</td><td>${money(cf.beginning_cash)}</td></tr>`;for(const [k,label] of [['operating','OPERATING ACTIVITIES'],['investing','INVESTING ACTIVITIES'],['financing','FINANCING ACTIVITIES']]){rows+=sectionRow(label);for(const x of cf[k].inflows)rows+=`<tr onclick="showTransaction(${x.id})" style="cursor:pointer"><td><span class="muted">${dmy(x.date)} • ${esc(x.ref)} • ${esc(x.project_code)}</span><br>${esc(x.description)}</td><td>${money(x.inflow)}</td></tr>`;for(const x of cf[k].outflows)rows+=`<tr onclick="showTransaction(${x.id})" style="cursor:pointer"><td><span class="muted">${dmy(x.date)} • ${esc(x.ref)} • ${esc(x.project_code)}</span><br>${esc(x.description)}</td><td>(${money(x.outflow)})</td></tr>`;rows+=totalRow(`Net ${label.replace(' ACTIVITIES','').toLowerCase()} cash flow`,cf[k].net)}rows+=totalRow('NET CHANGE IN CASH',cf.net_change)+`<tr><td>Ending Cash</td><td>${money(cf.ending_cash)}</td></tr><tr><td>Cash Ledger Balance</td><td>${money(cf.ledger_ending_cash)}</td></tr>`+totalRow('RECONCILIATION DIFFERENCE',cf.reconciliation);return reportHeader(scope,'STATEMENT OF CASH FLOWS',`For the period ${dmy(r.from)} to ${dmy(r.to)}`)+`<table class="statement">${rows}</table>`+reportFoot(r)}
function sectionRow(s){return `<tr class="section"><td colspan="2">${esc(s)}</td></tr>`}function acctRow(code,name,amount){return `<tr class="acct-click" onclick="ledgerDrill('${esc(code)}')" style="cursor:pointer"><td><span class="mono muted">${esc(code)}</span> &nbsp;${esc(name)}</td><td>${money(amount)}</td></tr>`}function totalRow(name,amount){return `<tr class="total"><td>${esc(name)}</td><td>${money(amount)}</td></tr>`}function reportFoot(r){return `<div class="report-footer"><span>${esc(state.branding?.report_footer||'Generated by CoopLedger')}</span><span>Status: <strong>${r.reconciled?'RECONCILED':'REQUIRES REVIEW'}</strong> • Generated ${new Date().toLocaleString()}</span></div>`}
async function ledgerDrill(code){try{const from=currentReport?.from||fy().from,to=currentReport?.to||fy().to;let q=`accountCode=${encodeURIComponent(code)}&from=${from}&to=${to}`;if(state.currentProject!=='consolidated')q+=`&projectId=${currentPid()}`;const r=await api('/api/ledger?'+q);modal(`${code} • ${r.account.name}`,`<div class="notice info">Detailed ledger transactions for ${dmy(from)} to ${dmy(to)}</div><div class="table-wrap"><table class="table"><thead><tr><th>Date</th><th>Ref</th><th>Project</th><th>Description</th><th>Debit</th><th>Credit</th></tr></thead><tbody>${r.rows.map(x=>`<tr onclick="showTransaction(${x.entry_id})" style="cursor:pointer"><td>${dmy(x.tx_date)}</td><td class="mono">${esc(x.ref)}</td><td>${esc(x.project_code)}</td><td>${esc(x.description)}</td><td>${x.debit?money(x.debit):''}</td><td>${x.credit?money(x.credit):''}</td></tr>`).join('')}</tbody></table></div><div class="journal-total"><span>Total Debit ${money(r.total_debit)}</span><span>Total Credit ${money(r.total_credit)}</span><span>Net ${money(r.net)}</span></div>`,`<button class="btn primary" onclick="closeModal()">Close</button>`,true)}catch(e){toast(e.message,'error')}}
function printReport(){window.print()}
async function downloadReport(fmt){try{const from=$('repFrom')?.value||currentReport.from,to=$('repTo')?.value||currentReport.to;let q=`type=${currentReportType}&from=${from}&to=${to}`;if(state.currentProject==='consolidated')q+=`&projects=${state.projects.map(p=>p.id).join(',')}&consolidated=1`;else q+=`&projectId=${currentPid()}`;const blob=await api(`/api/reports/${fmt==='pdf'?'pdf':'excel'}?${q}`);const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`CoopLedger-${currentReportType}-${to}.${fmt==='pdf'?'pdf':'xlsx'}`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast(`${fmt.toUpperCase()} report downloaded.`)}catch(e){toast(e.message,'error')}}
async function pageApprovals(){const r=await api('/api/approvals?status=PENDING');$('content').innerHTML=head('Approval Queue','Protected accounting changes awaiting Super Admin verification')+`<div class="panel"><div class="table-wrap"><table class="table"><thead><tr><th>Requested</th><th>Project</th><th>Reference</th><th>Requested By</th><th>Action</th><th>Reason</th><th></th></tr></thead><tbody>${r.requests.map(x=>`<tr><td>${new Date(x.requested_at).toLocaleString()}</td><td>${esc(x.project_code)}</td><td class="mono">${esc(x.ref)}</td><td>${esc(x.requested_by_name)}</td><td><span class="status pending">${esc(x.action_type)}</span></td><td>${esc(x.reason)}</td><td><button class="btn primary sm" onclick="reviewApproval(${x.id},'${esc(x.ref)}','APPROVE')">Review</button></td></tr>`).join('')||'<tr><td colspan="7"><div class="empty"><strong>No pending accounting changes.</strong>All project correction/void requests have been resolved.</div></td></tr>'}</tbody></table></div></div>`}
function reviewApproval(id,ref){modal('Review Accounting Change',`<div class="notice info">Request for <strong>${esc(ref)}</strong>. Approval creates the reversing/correcting ledger entries automatically and updates connected screens via live sync.</div><div class="field"><label>Review Note</label><textarea class="textarea" id="reviewNote" placeholder="Verification notes"></textarea></div><div class="field"><label>Super Admin Password</label><input class="input" id="reviewPass" type="password" autocomplete="current-password"><small class="muted">Password re-verification is required for every approval/rejection.</small></div>`,`<button class="btn danger" onclick="submitReview(${id},'REJECT')">Reject</button><button class="btn primary" onclick="submitReview(${id},'APPROVE')">Approve & Apply</button>`)}
async function submitReview(id,decision){try{await api('/api/approval/review',{method:'POST',body:JSON.stringify({requestId:id,decision,superadmin_password:$('reviewPass').value,note:$('reviewNote').value})});closeModal();toast(decision==='APPROVE'?'Request approved and accounting updated.':'Request rejected.');refreshBadges();loadPage()}catch(e){toast(e.message,'error')}}
async function pageAudit(){let route='/api/audit';if(state.currentProject!=='consolidated')route+='?projectId='+currentPid();const r=await api(route);$('content').innerHTML=head('Audit Trail',state.currentProject==='consolidated'?'Transparent system-wide activity history':'Immutable activity history for '+currentProjectObj().name)+`<div class="panel"><div class="toolbar"><input class="input" id="auditSearch" placeholder="Search user, action, reference…" oninput="filterAudit()"></div><div id="auditList">${auditHtml(r.audit)}</div></div>`;window._auditRows=r.audit}
function auditHtml(rows){if(!rows.length)return '<div class="empty">No audit activity yet.</div>';return rows.map(x=>`<div class="audit-item" data-search="${esc((x.user_name||'')+' '+x.action+' '+x.entity_type+' '+(x.entity_id||'')+' '+(x.project_code||''))}"><strong>${esc(x.action.replaceAll('_',' '))} • ${esc(x.entity_type.replaceAll('_',' '))}</strong><small>${esc(x.project_code||'GENERAL')} • ${esc(x.user_name||'System')} (${esc((x.role||'SYSTEM').replaceAll('_',' '))}) • ${new Date(x.created_at).toLocaleString()}</small><div style="font-size:11px;color:#64748b;margin-top:5px" class="mono">${esc(x.entity_id||'')} ${esc(x.detail_json||'')}</div></div>`).join('')}
function filterAudit(){const q=$('auditSearch').value.toLowerCase();document.querySelectorAll('.audit-item').forEach(x=>x.style.display=x.dataset.search.toLowerCase().includes(q)?'':'none')}
async function pageUsers(){const r=await api('/api/admin/users');$('content').innerHTML=head('Users & Project Access','Two-role security model: Super Admin or Project Manager only',`<button class="btn primary" onclick="userModal()">+ New User</button>`)+`<div class="notice info"><strong>Simple role model:</strong> <b>SUPERADMIN</b> has cooperative-wide administration, consolidated reports, approvals, manual accounting, backup/restore and settings. <b>PROJECT_MANAGER</b> only sees assigned project(s) and uses the guided Project Operations workflows.</div><div class="panel"><div class="table-wrap"><table class="table"><thead><tr><th>User</th><th>Username</th><th>Role</th><th>Assigned Projects</th><th>Status</th></tr></thead><tbody>${r.users.map(u=>`<tr><td><strong>${esc(u.name)}</strong></td><td class="mono">${esc(u.username)}</td><td><span class="status ${u.role==='SUPERADMIN'?'reconciled':'posted'}">${esc(u.role.replaceAll('_',' '))}</span></td><td>${u.role==='SUPERADMIN'?'<strong>All Projects</strong>':u.projects.length?u.projects.map(p=>`<span class="status posted" style="margin:2px">${esc(p.code)}</span>`).join(''):'<span class="bad">No project assigned</span>'}</td><td><span class="status ${u.active?'reconciled':'closed'}">${u.active?'Active':'Disabled'}</span>${u.must_change?'<br><span class="muted">Password change required</span>':''}</td></tr>`).join('')}</tbody></table></div></div>`}
function userModal(){modal('Create User',`<div class="form-grid"><div class="field"><label>Full Name</label><input class="input" id="uName"></div><div class="field"><label>Username</label><input class="input" id="uUser"></div><div class="field"><label>Role</label><select class="select" id="uRole" onchange="toggleUserProjectAssignment()"><option value="PROJECT_MANAGER">PROJECT MANAGER</option><option value="SUPERADMIN">SUPERADMIN</option></select></div><div class="field"><label>Temporary Password (optional)</label><input class="input" id="uPass" type="password" placeholder="Auto-generate if blank"></div><div class="field span2" id="uProjectBox"><label>Assigned Projects — required for Project Manager</label><div class="project-toggle-row">${state.projects.map(p=>`<label class="project-toggle"><input type="checkbox" name="uproject" value="${p.id}">${esc(p.code+' '+p.name)}</label>`).join('')}</div></div></div><div class="notice info"><b>PROJECT MANAGER:</b> project-scoped operations, transactions, statements, audit and change requests. <b>SUPERADMIN:</b> all projects plus approvals, periods, users, manual accounting, system settings, backup and restore. New users must change the temporary password after first login.</div>`,`<button class="btn soft" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveUser()">Create User</button>`);toggleUserProjectAssignment()}
function toggleUserProjectAssignment(){const superAdmin=$('uRole')?.value==='SUPERADMIN',box=$('uProjectBox');if(!box)return;box.style.opacity=superAdmin?'.45':'1';box.querySelectorAll('input').forEach(x=>{x.disabled=superAdmin;if(superAdmin)x.checked=false})}
async function saveUser(){try{const project_ids=[...document.querySelectorAll('input[name=uproject]:checked')].map(x=>Number(x.value));const r=await api('/api/admin/users',{method:'POST',body:JSON.stringify({name:$('uName').value,username:$('uUser').value,role:$('uRole').value,temporary_password:$('uPass').value||undefined,project_ids})});modal('User Created',`<div class="notice good">The user was created successfully. Copy the one-time credential below and provide it securely to the user.</div><dl class="detail-list"><dt>Username</dt><dd class="mono">${esc(r.username)}</dd><dt>Temporary Password</dt><dd class="mono"><strong>${esc(r.temporary_password)}</strong></dd><dt>Required</dt><dd>Password change after first login</dd></dl>`,`<button class="btn primary" onclick="closeModal();loadPage()">Done</button>`)}catch(e){toast(e.message,'error')}}
async function pagePeriods(){const r=await api(`/api/periods?year=${state.year}`),by=Object.fromEntries(r.periods.map(x=>[x.month,x]));$('content').innerHTML=head('Accounting Periods',`Control posting access for FY ${state.year}`)+`<div class="panel"><div class="notice info">OPEN allows normal posting. RECONCILING remains open while finance checks balances. CLOSED and LOCKED block all posting, including Super Admin. Reopen the period first before any correction/reversal. RECONCILING remains available for controlled month-end checking.</div><div class="table-wrap"><table class="table"><thead><tr><th>Month</th><th>Status</th><th>Last Updated</th><th>Change Status</th></tr></thead><tbody>${Array.from({length:12},(_,i)=>{const m=i+1,x=by[m],st=x?.status||'OPEN';return `<tr><td><strong>${new Date(2020,i,1).toLocaleString('en',{month:'long'})}</strong></td><td><span class="status ${st.toLowerCase()}">${st}</span></td><td>${x?.updated_at?new Date(x.updated_at).toLocaleString():'—'}</td><td><select class="select" style="width:auto" onchange="setPeriod(${state.year},${m},this.value)"><option ${st==='OPEN'?'selected':''}>OPEN</option><option ${st==='RECONCILING'?'selected':''}>RECONCILING</option><option ${st==='CLOSED'?'selected':''}>CLOSED</option><option ${st==='LOCKED'?'selected':''}>LOCKED</option></select></td></tr>`}).join('')}</tbody></table></div></div>`}
async function setPeriod(year,month,status){try{await api('/api/admin/period',{method:'POST',body:JSON.stringify({year,month,status})});toast(`${year}-${String(month).padStart(2,'0')} set to ${status}.`);loadPage()}catch(e){toast(e.message,'error')}}
async function pageBackup(){const [cfg,h,rb]=await Promise.all([api('/api/admin/google-drive'),api('/api/admin/backups'),api('/api/admin/restore/backups')]);window.googleDriveCfg=cfg;window.restoreBackups=rb;const status=cfg.connected?`<span class="status reconciled">CONNECTED</span> <strong>${esc(cfg.connected_email||'Personal Google Account')}</strong>`:`<span class="status pending">NOT CONNECTED</span>`;const localRows=(rb.local||[]).map(x=>`<tr><td>${new Date(x.created_at).toLocaleString()}</td><td>${esc(x.kind)}</td><td>${esc(x.file_name||'—')}</td><td>${x.file_size?numFmt(x.file_size/1024/1024)+' MB':'—'}</td><td><button class="btn soft sm" onclick="restoreInspect('LOCAL',${x.id},'', '${encodeURIComponent(x.file_name||'')}')">Inspect / Restore</button></td></tr>`).join('')||'<tr><td colspan="5"><div class="empty">No verified local backup yet.</div></td></tr>';const driveRows=(rb.drive||[]).map(x=>`<tr><td>${x.createdTime?new Date(x.createdTime).toLocaleString():'—'}</td><td>${esc(x.name||'—')}</td><td>${x.size?numFmt(Number(x.size)/1024/1024)+' MB':'—'}</td><td class="mono">${esc(String(x.id||'').slice(0,18))}${x.id?'…':''}</td><td><button class="btn soft sm" onclick="restoreInspect('DRIVE','', '${encodeURIComponent(x.id||'')}', '${encodeURIComponent(x.name||'')}')">Inspect / Restore</button></td></tr>`).join('')||`<tr><td colspan="5"><div class="empty">${cfg.connected?'No CoopLedger backup files found in the connected Drive folder.':'Connect Personal Google Drive first to browse Drive backups.'}</div></td></tr>`;const restoreRows=(rb.restores||[]).map(x=>`<tr><td>${x.requested_at?new Date(x.requested_at).toLocaleString():'—'}</td><td>${esc(x.source||'—')}</td><td>${esc(x.backup_name||'—')}</td><td>${esc(x.components_json||'—')}</td><td><span class="status ${x.status==='COMPLETED'?'reconciled':x.status==='FAILED'?'closed':'pending'}">${esc(x.status||'—')}</span></td><td>${esc(x.safety_backup_name||'—')}</td></tr>`).join('')||'<tr><td colspan="6"><div class="empty">No rollback history yet.</div></td></tr>';$('content').innerHTML=head('Backup, Google Drive & Rollback','Verified snapshots + Super Admin selective restore from Local or Personal Google Drive',`<button class="btn primary" onclick="backupNow()">Backup Now</button>`)+`<div class="notice bad"><strong>Restore / Rollback is a high-impact Super Admin action.</strong> The system validates the ZIP, manifest, SHA-256 and SQLite integrity, then automatically creates a fresh <b>PRE_RESTORE_SAFETY</b> backup before applying anything. After rollback, restored sessions are invalidated. The <b>current Super Admin password is preserved</b>, so an older backup can no longer reset the active administrator password.</div><div class="grid2"><div class="panel"><div class="panel-head"><div><h3>Google Drive OAuth 2.0</h3><p>OAuth Client credentials stay only on this backend PC, never in GitHub or backup ZIPs.</p></div></div><div class="oauth-status">${status}</div><div class="guide"><strong>Setup once:</strong> Google Cloud → Enable Google Drive API → OAuth Client “Web application” → Authorized Redirect URI exactly: <span class="mono">${esc(cfg.redirect_uri||'https://coop.mdmsportal.uk/api/google-drive/oauth/callback')}</span>. Save Client ID/Secret here, then Connect Personal Google Drive.</div><div class="form-grid"><div class="field span2"><label>OAuth Client ID</label><input class="input mono" id="gdClientId" value="${esc(cfg.client_id||'')}" placeholder="xxxx.apps.googleusercontent.com"></div><div class="field span2"><label>OAuth Client Secret ${cfg.oauth_configured?'(configured — blank keeps current)':''}</label><input class="input" type="password" id="gdClientSecret" placeholder="${cfg.oauth_configured?'Leave blank to keep saved secret':'Enter client secret'}"></div><div class="field span2"><label>Authorized Redirect URI — fixed</label><input class="input auto-field mono" id="gdRedirect" value="${esc(cfg.redirect_uri||'https://coop.mdmsportal.uk/api/google-drive/oauth/callback')}" readonly></div><div class="field"><label>Scheduled Backup</label><select class="select" id="gdScheduleEnabled"><option value="1" ${cfg.schedule_enabled!==false?'selected':''}>Enabled</option><option value="0" ${cfg.schedule_enabled===false?'selected':''}>Disabled</option></select></div><div class="field"><label>Daily Time</label><input class="input" id="gdTime" type="time" value="${esc(cfg.schedule_time||'02:00')}"></div><div class="field span2"><label>Drive Folder</label><input class="input auto-field" id="gdFolder" value="${esc(cfg.folder_id||'Not created yet')}" readonly></div></div><div class="quick-actions" style="margin-top:14px"><button class="btn soft" onclick="saveDriveSettings()">Save OAuth Settings</button>${cfg.connected?`<button class="btn good" onclick="createDriveFolder()">Use / Create COOPLEDGER BACKUPS</button><button class="btn danger" onclick="disconnectGoogleDrive()">Disconnect</button>`:`<button class="btn primary" onclick="connectGoogleDrive()">Connect Personal Google Drive</button>`}</div></div><div class="panel"><div class="panel-head"><div><h3>Backup Status</h3><p>Database + uploaded logos/files are packaged and hash-verified.</p></div></div>${h.backups[0]?`<div class="kpi"><div class="label">Latest Backup</div><div class="value" style="font-size:18px">${esc(h.backups[0].status)}</div><div class="sub">${new Date(h.backups[0].created_at).toLocaleString()} • ${h.backups[0].file_name?esc(h.backups[0].file_name):''}</div></div>`:'<div class="empty">No backups created yet.</div>'}<div class="guide" style="margin-top:14px"><strong>Selective rollback:</strong> You may restore <b>Database & Accounting Data</b>, <b>Uploaded Files</b>, or <b>both</b>. Full restore is recommended when rolling the whole system back to an earlier point. OAuth/SMSGate credentials are intentionally not inside backups, so they stay on this backend PC. When restoring the database, CoopLedger also preserves the currently active Super Admin password to prevent lockout.</div></div></div><div class="panel" style="margin-top:16px"><div class="panel-head"><div><h3>Restore / Rollback Center — Verified Local Backups</h3><p>Select a backup, inspect it first, then choose exactly what to restore.</p></div></div><div class="table-wrap"><table class="table"><thead><tr><th>Date</th><th>Kind</th><th>File</th><th>Size</th><th>Action</th></tr></thead><tbody>${localRows}</tbody></table></div></div><div class="panel" style="margin-top:16px"><div class="panel-head"><div><h3>Restore from Personal Google Drive</h3><p>Backups visible to this OAuth app in the configured COOPLEDGER BACKUPS folder.</p></div></div>${rb.drive_error?`<div class="notice bad">Drive listing error: ${esc(rb.drive_error)}</div>`:''}<div class="table-wrap"><table class="table"><thead><tr><th>Drive Date</th><th>File</th><th>Size</th><th>Drive ID</th><th>Action</th></tr></thead><tbody>${driveRows}</tbody></table></div></div><div class="panel" style="margin-top:16px"><div class="panel-head"><div><h3>Rollback History</h3><p>Completed/failed restore attempts and their automatic safety backups.</p></div></div><div class="table-wrap"><table class="table"><thead><tr><th>Requested</th><th>Source</th><th>Backup</th><th>Components</th><th>Status</th><th>Safety Backup</th></tr></thead><tbody>${restoreRows}</tbody></table></div></div><div class="panel" style="margin-top:16px"><div class="panel-head"><div><h3>Backup History</h3><p>Manual, scheduled, pre-restore and pre-reset safety backups.</p></div></div><div class="table-wrap"><table class="table"><thead><tr><th>Date</th><th>Kind</th><th>Status</th><th>File</th><th>Size</th><th>SHA-256</th></tr></thead><tbody>${h.backups.map(x=>`<tr><td>${new Date(x.created_at).toLocaleString()}</td><td>${esc(x.kind)}</td><td><span class="status ${x.status.includes('VERIFIED')?'reconciled':'closed'}">${esc(x.status)}</span></td><td>${esc(x.file_name||'—')}</td><td>${x.file_size?numFmt(x.file_size/1024/1024)+' MB':'—'}</td><td class="mono">${esc((x.sha256||'').slice(0,20))}${x.sha256?'…':''}</td></tr>`).join('')}</tbody></table></div></div><div class="panel" style="margin-top:16px;border-color:#fecaca"><div class="panel-head"><div><h3>Reset System — Transactional & Operational Data Only</h3><p>Start a clean operating database without destroying configured system settings.</p></div></div><div class="notice bad"><strong>This is destructive.</strong> CoopLedger first creates a verified <b>PRE_SYSTEM_RESET</b> local safety backup, then clears accounting transactions and operational records.</div><div class="guide"><strong>Preserved:</strong> Super Admin and Project Manager accounts/passwords, roles and project assignments, branding, system settings, project/subproject setup, chart of accounts, P02 configuration, P03 service pricing, Google Drive/SMSGate credentials, SMS queue/history, uploaded branding/files, and backup/restore history.<br><strong>Cleared:</strong> journal entries/lines, periods, approval queue, loans, rental units/bills, palay batches, consignees/consignments/collections, notifications, report history, OAuth temporary states, and old audit events. A fresh SYSTEM_RESET audit event is then recorded.</div><button class="btn danger" onclick="resetSystemModal()">Reset Transactional / Operational Data</button></div>`}
async function saveDriveSettings(reload=true){try{const body={enabled:!!window.googleDriveCfg?.connected,schedule_enabled:$('gdScheduleEnabled').value==='1',schedule_time:$('gdTime').value,folder_id:$('gdFolder').value==='Not created yet'?'':$('gdFolder').value,client_id:$('gdClientId').value,redirect_uri:$('gdRedirect').value};if($('gdClientSecret').value)body.client_secret=$('gdClientSecret').value;const r=await api('/api/admin/google-drive',{method:'POST',body:JSON.stringify(body)});if(reload){toast('OAuth/backup settings saved securely.');loadPage()}return r}catch(e){toast(e.message,'error');throw e}}
async function connectGoogleDrive(){const pop=window.open('about:blank','coopGoogleOAuth','width=720,height=780');try{await saveDriveSettings(false);const r=await api('/api/admin/google-drive/oauth/start',{method:'POST',body:'{}'});if(pop)pop.location=r.url;else location.href=r.url;toast('Finish Google consent in the opened window.');let n=0;const timer=setInterval(async()=>{try{const c=await api('/api/admin/google-drive');if(c.connected){clearInterval(timer);try{pop?.close()}catch{}toast(`Google Drive connected${c.connected_email?' as '+c.connected_email:''}.`);loadPage()}else if(++n>90)clearInterval(timer)}catch{}},2000)}catch(e){try{pop?.close()}catch{}toast(e.message,'error')}}
