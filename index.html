<script>
'use strict';
const DEFAULT_API='https://coop.mdmsportal.uk';
const localHost=['localhost','127.0.0.1'].includes(location.hostname);
const state={api:localStorage.getItem('coop_api')||(localHost?'http://127.0.0.1:5000':DEFAULT_API),token:localStorage.getItem('coop_token')||'',user:null,branding:null,projects:[],accounts:[],currentProject:'consolidated',year:Number(localStorage.getItem('coop_year')||new Date().getFullYear()),page:'dashboard',socket:null,analyticsSelection:JSON.parse(localStorage.getItem('coop_analytics_projects')||'[]')};
const $=(id)=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), money=v=>'₱'+Number(v||0).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2}), dmy=s=>s?new Date(s+'T00:00:00').toLocaleDateString('en-PH',{year:'numeric',month:'short',day:'2-digit'}):'', today=()=>new Date().toISOString().slice(0,10);
function toast(msg,type='success'){const e=document.createElement('div');e.className='toast '+type;e.textContent=msg;$('toasts').appendChild(e);setTimeout(()=>e.remove(),4200)}
async function api(route,opt={}){const r=await fetch(state.api+route,{...opt,headers:{...(opt.body?{'Content-Type':'application/json'}:{}),...(state.token?{Authorization:'Bearer '+state.token}:{}),...(opt.headers||{})}});const ct=r.headers.get('content-type')||'';if(!r.ok){let e;try{e=await r.json()}catch{e={error:'HTTP '+r.status}};if(r.status===401&&route!='/api/auth/login'){if(String(e.error||'').includes('expired'))logout(false)}throw new Error(e.error||'Request failed')}if(ct.includes('application/json'))return r.json();return r.blob()}
async function publicApi(route){const r=await fetch(state.api+route);if(!r.ok)throw new Error('Backend unavailable');return r.json()}
function setBrand(b){state.branding=b||state.branding||{};const s=document.documentElement.style;s.setProperty('--brand',b.primary_color||'#0f172a');s.setProperty('--brand2',b.secondary_color||'#334155');s.setProperty('--accent',b.accent_color||'#0ea5e9');document.title=(b.short_name||'CoopLedger')+' • Accounting';document.querySelector('meta[name=theme-color]').content=b.primary_color||'#0f172a';try{const m={name:b.coop_name||'CoopLedger',short_name:b.short_name||'CoopLedger',start_url:'./',display:'standalone',background_color:'#f5f7fb',theme_color:b.primary_color||'#0f172a',icons:[{src:'icons/icon-192.png',sizes:'192x192',type:'image/png'},{src:'icons/icon-512.png',sizes:'512x512',type:'image/png'}]};$('manifestLink').href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/manifest+json'}))}catch{}}
function logoHtml(cls='brand-logo'){const p=state.branding?.logo_path;return `<div class="${cls}">${p?`<img src="${state.api}${esc(p)}" alt="logo">`:'CL'}</div>`}
async function init(){try{setBrand(await publicApi('/api/public/branding'))}catch{setBrand({coop_name:'CoopLedger',short_name:'CoopLedger'})}if(state.token){try{state.user=await api('/api/me');await loadBasics();renderApp();connectSocket();if(state.user.must_change)passwordModal(true);return}catch{state.token='';localStorage.removeItem('coop_token')}}renderLogin()}
function renderLogin(){const b=state.branding||{};$('root').innerHTML=`<div class="login-wrap"><section class="login-art"><div class="brand-lockup">${logoHtml()}<div><strong>${esc(b.coop_name||'CoopLedger')}</strong><div style="opacity:.65;font-size:12px">Multi-Project Accounting & Financial Management</div></div></div><div class="login-copy"><div class="eyebrow">Cooperative Financial Control</div><h1>One ledger.<br>Every project.<br>Fully transparent.</h1><p>Project-aware accounting, reconciled financial statements, protected audit trails, historical posting, live approvals, and consolidated management analytics.</p><div class="trust-row"><span class="trust-pill">Double-entry accounting</span><span class="trust-pill">Role-based projects</span><span class="trust-pill">Live audit controls</span><span class="trust-pill">PWA ready</span></div></div><div style="font-size:11px;opacity:.5">CoopLedger v1.0 • Client deployment</div></section><section class="login-panel"><form class="login-card" id="loginForm"><div class="eyebrow" style="color:var(--accent)">Secure access</div><h2>Welcome back</h2><p class="muted">Sign in with your cooperative account.</p><div class="field"><label>Username</label><input class="input" id="loginUser" autocomplete="username" required></div><div class="field"><label>Password</label><input class="input" id="loginPass" type="password" autocomplete="current-password" required></div><button class="btn primary full" type="submit">Sign in to CoopLedger</button><div id="loginError"></div><div style="margin-top:24px;font-size:11px;color:#94a3b8;line-height:1.6">Backend: <span class="mono">${esc(state.api)}</span><br>If this is first deployment, your initial Super Admin credential is generated locally by the backend.</div></form></section></div>`;$('loginForm').onsubmit=login}
async function login(e){e.preventDefault();$('loginError').innerHTML='';try{const x=await api('/api/auth/login',{method:'POST',body:JSON.stringify({username:$('loginUser').value,password:$('loginPass').value})});state.token=x.token;localStorage.setItem('coop_token',state.token);state.user=x.user;await loadBasics();renderApp();connectSocket();if(state.user.must_change)passwordModal(true)}catch(err){$('loginError').innerHTML=`<div class="login-error">${esc(err.message)}</div>`}}
function logout(call=true){if(call&&state.token)api('/api/auth/logout',{method:'POST'}).catch(()=>{});state.token='';state.user=null;localStorage.removeItem('coop_token');try{state.socket?.disconnect()}catch{}renderLogin()}
async function loadBasics(){const [p,a]=await Promise.all([api('/api/projects'),api('/api/accounts')]);state.projects=p.projects;state.accounts=a.accounts;if(!state.analyticsSelection.length)state.analyticsSelection=state.projects.map(x=>x.id);$('accountList')&&fillAccountList()}
function fillAccountList(){const d=$('accountList');if(d)d.innerHTML=state.accounts.map(a=>`<option value="${esc(a.code+' • '+a.name)}"></option>`).join('')}
function roleIs(...r){return r.includes(state.user?.role)}
function currentPid(){return state.currentProject==='consolidated'?null:Number(state.currentProject)}
function currentProjectObj(){return state.projects.find(p=>p.id===currentPid())}
function navItems(){const p=currentProjectObj(),items=[['OVERVIEW','dashboard','◫','Dashboard']];if(state.currentProject!=='consolidated'){items.push(['WORKSPACE','transactions','⇄','Transactions'],['WORKSPACE','operations','◎','Project Operations'],['FINANCE','financials','▤','Financial Statements'],['CONTROL','audit','⌁','Audit Trail']);}else items.push(['FINANCE','financials','▤','Consolidated Statements'],['CONTROL','audit','⌁','General Audit Trail']);if(roleIs('SUPERADMIN'))items.push(['CONTROL','approvals','✓','Approval Queue'],['ADMINISTRATION','users','♙','Users & Roles'],['ADMINISTRATION','periods','◷','Accounting Periods'],['ADMINISTRATION','backup','↥','Backup & Drive'],['ADMINISTRATION','settings','⚙','Branding & Settings']);return items}
function renderApp(){const b=state.branding||{},opts=(roleIs('SUPERADMIN','ACCOUNTANT','GENERAL_MANAGER','AUDITOR')?`<option value="consolidated">Consolidated Cooperative</option>`:'')+state.projects.map(p=>`<option value="${p.id}" ${String(state.currentProject)===String(p.id)?'selected':''}>${esc(p.code+' • '+p.name)}</option>`).join('');if(state.currentProject==='consolidated'&&!roleIs('SUPERADMIN','ACCOUNTANT','GENERAL_MANAGER','AUDITOR'))state.currentProject=String(state.projects[0]?.id||'');let last='';const nav=navItems().map(([sec,id,ic,label])=>`${sec!==last?`<div class="nav-section">${last=sec}</div>`:''}<button class="nav-btn ${state.page===id?'active':''}" data-page="${id}"><span class="nav-icon">${ic}</span>${label}${id==='approvals'?'<span class="spacer"></span><span id="approvalNavBadge"></span>':''}</button>`).join('');$('root').innerHTML=`<div class="app"><div class="mobile-overlay" id="overlay"></div><aside class="sidebar" id="sidebar"><div class="side-brand">${logoHtml()}<div><strong>${esc(b.short_name||'CoopLedger')}</strong><small>${esc(state.user.role.replaceAll('_',' '))}</small></div></div><nav>${nav}</nav><div class="sidebar-footer"><div style="padding:8px 10px;font-size:11px;color:rgba(255,255,255,.65)"><span class="live-dot" id="liveDot"></span> <span id="liveText">Connecting…</span></div><button class="nav-btn" onclick="logout()"><span class="nav-icon">↪</span>Sign out</button></div></aside><main class="main"><header class="topbar"><button class="icon-btn menu-btn" id="menuBtn">☰</button><div class="top-context"><div class="top-label">Current view</div><select class="context-select" id="projectContext">${opts}</select></div><div class="top-context period"><div class="top-label">Fiscal year</div><select class="context-select" id="yearContext">${Array.from({length:12},(_,i)=>state.year+3-i).map(y=>`<option ${y===state.year?'selected':''}>${y}</option>`).join('')}</select></div><div class="spacer"></div><button class="icon-btn" id="notifBtn">♢<span id="notifBadge" class="badge hidden">0</span></button><div class="user-chip"><div class="avatar">${esc((state.user.name||'U')[0])}</div><div class="who"><strong style="display:block;font-size:11px">${esc(state.user.name)}</strong><small class="muted">${esc(state.user.role.replaceAll('_',' '))}</small></div></div></header><section class="content" id="content"></section></main></div>`;fillAccountList();document.querySelectorAll('.nav-btn[data-page]').forEach(b=>b.onclick=()=>navigate(b.dataset.page));$('projectContext').value=String(state.currentProject);$('projectContext').onchange=()=>{state.currentProject=$('projectContext').value;state.page='dashboard';renderApp();loadPage()};$('yearContext').onchange=()=>{state.year=Number($('yearContext').value);localStorage.setItem('coop_year',state.year);loadPage()};$('menuBtn').onclick=()=>{$('sidebar').classList.toggle('open');$('overlay').classList.toggle('show')};$('overlay').onclick=()=>{$('sidebar').classList.remove('open');$('overlay').classList.remove('show')};$('notifBtn').onclick=showNotifications;loadPage();refreshBadges()}
function navigate(page){state.page=page;document.querySelectorAll('.nav-btn[data-page]').forEach(x=>x.classList.toggle('active',x.dataset.page===page));$('sidebar')?.classList.remove('open');$('overlay')?.classList.remove('show');loadPage()}
async function loadPage(){const el=$('content');if(!el)return;el.innerHTML='<div class="panel"><div class="empty">Loading workspace…</div></div>';try{if(state.page==='dashboard')await pageDashboard();else if(state.page==='transactions')await pageTransactions();else if(state.page==='operations')await pageOperations();else if(state.page==='financials')await pageFinancials();else if(state.page==='approvals')await pageApprovals();else if(state.page==='audit')await pageAudit();else if(state.page==='users')await pageUsers();else if(state.page==='periods')await pagePeriods();else if(state.page==='backup')await pageBackup();else if(state.page==='settings')await pageSettings()}catch(e){el.innerHTML=`<div class="panel"><div class="notice bad">${esc(e.message)}</div></div>`}}
function head(title,sub,actions=''){return `<div class="page-head"><div><h1>${esc(title)}</h1><p>${esc(sub||'')}</p></div><div class="spacer"></div><div class="actions">${actions}</div></div>`}
function fy(){return {from:`${state.year}-01-01`,to:`${state.year}-12-31`}}
function scopeQuery(extra=''){const {from,to}=fy();if(state.currentProject==='consolidated'){const ids=(state.analyticsSelection.length?state.analyticsSelection:state.projects.map(p=>p.id)).join(',');return `projects=${ids}&consolidated=1&from=${from}&to=${to}${extra}`;}return `projectId=${state.currentProject}&from=${from}&to=${to}${extra}`}
function kpi(label,value,sub=''){return `<div class="kpi"><div class="label">${esc(label)}</div><div class="value money">${value}</div><div class="sub">${esc(sub)}</div></div>`}
async function pageDashboard(){const isCons=state.currentProject==='consolidated';let toggles='';if(isCons){if(!state.analyticsSelection.length)state.analyticsSelection=state.projects.map(p=>p.id);toggles=`<div class="panel" style="margin-bottom:16px"><div class="panel-head"><div><h3>Analytics Project Visibility</h3><p>Show or hide projects from executive comparisons without changing accounting data.</p></div></div><div class="project-toggle-row">${state.projects.map((p,i)=>`<label class="project-toggle"><input type="checkbox" ${state.analyticsSelection.includes(p.id)?'checked':''} onchange="toggleAnalyticsProject(${p.id},this.checked)"><span>${esc(p.code+' '+p.name)}</span></label>`).join('')}</div></div>`}const q=scopeQuery(),[an,rep]=await Promise.all([api('/api/analytics?'+q),api('/api/reports?'+q)]);const scopeName=isCons?'Consolidated Cooperative':currentProjectObj()?.name||'Project';const income=rep.income_statement,bs=rep.balance_sheet,cf=rep.cash_flow;$('content').innerHTML=head(scopeName,`Financial and operational analytics • FY ${state.year}`,`<button class="btn soft" onclick="navigate('financials')">Open Statements</button>${isCons&&roleIs('SUPERADMIN','ACCOUNTANT')?'<button class="btn soft" onclick="interprojectModal()">Inter-project Entry</button>':''}${state.currentProject!=='consolidated'?'<button class="btn primary" onclick="newJournalModal()">+ New Entry</button>':''}`)+`${state.year<new Date().getFullYear()?`<div class="period-banner">⚠ Historical Accounting View — You are reviewing FY ${state.year}. Encoding dates remain separately auditable.</div>`:''}${toggles}<div class="kpis">${kpi('Total Assets',money(bs.total_assets),rep.reconciled?'Reconciled':'Review required')}${kpi('Liabilities',money(bs.total_liabilities))}${kpi('Equity',money(bs.total_equity))}${kpi('Revenue YTD',money(income.total_revenue))}${kpi('Expenses YTD',money(income.total_expenses))}${kpi('Net Surplus',money(income.net_surplus),`Cash ${money(cf.ending_cash)}`)}</div><div class="grid2"><div class="panel"><div class="panel-head"><div><h3>${isCons?'Project Profitability':'Monthly Financial Performance'}</h3><p>${isCons?'Revenue, expense, and net surplus by selected project':'Revenue and expenses across the fiscal year'}</p></div></div><div class="chart-wrap"><canvas class="chart" id="chartMain"></canvas></div></div><div class="panel"><div class="panel-head"><div><h3>${isCons?'Monthly Revenue by Project':'Cash Movement'}</h3><p>${isCons?'Visible projects only':'Net cash movement by month'}</p></div></div><div class="chart-wrap"><canvas class="chart" id="chartSecondary"></canvas></div></div></div><div class="grid2" style="margin-top:16px"><div class="panel"><div class="panel-head"><div><h3>Financial Position</h3><p>Assets versus liabilities and equity</p></div></div><div class="chart-wrap"><canvas class="chart" id="chartPosition"></canvas></div></div><div class="panel"><div class="panel-head"><div><h3>Operational Intelligence</h3><p>${isCons?'Selected project operating indicators':'Project-specific operating analytics'}</p></div></div><div id="operationalPanel"></div></div></div>`;requestAnimationFrame(()=>renderDashboardCharts(an,rep,isCons));renderOperational(an,isCons)}
function toggleAnalyticsProject(id,on){if(on&&!state.analyticsSelection.includes(id))state.analyticsSelection.push(id);if(!on)state.analyticsSelection=state.analyticsSelection.filter(x=>x!==id);if(!state.analyticsSelection.length){toast('At least one project must remain visible.','error');state.analyticsSelection=[id]}localStorage.setItem('coop_analytics_projects',JSON.stringify(state.analyticsSelection));loadPage()}
function cssVar(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}
const palette=()=>[cssVar('--accent'),'#6366f1','#14b8a6','#f59e0b','#ef4444','#8b5cf6','#22c55e','#64748b'];
function prepCanvas(id){const c=$(id);if(!c)return null;const r=c.getBoundingClientRect(),d=Math.min(2,devicePixelRatio||1);c.width=Math.max(300,r.width*d);c.height=Math.max(180,r.height*d);const x=c.getContext('2d');x.setTransform(d,0,0,d,0,0);return {c,x,w:r.width,h:r.height}}
function animateChart(fn,dur=550){const st=performance.now();function f(t){const p=Math.min(1,(t-st)/dur);fn(1-Math.pow(1-p,3));if(p<1)requestAnimationFrame(f)}requestAnimationFrame(f)}
function grid(ctx,w,h,pad,max,labels){ctx.strokeStyle='#e8edf4';ctx.lineWidth=1;ctx.fillStyle='#94a3b8';ctx.font='10px system-ui';for(let i=0;i<=4;i++){const y=pad.t+(h-pad.t-pad.b)*i/4;ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(w-pad.r,y);ctx.stroke();const v=max*(1-i/4);ctx.fillText(shortNum(v),4,y+3)}if(labels?.length){const step=(w-pad.l-pad.r)/Math.max(1,labels.length-1);labels.forEach((l,i)=>{if(labels.length>8&&i%2) return;ctx.fillText(String(l).slice(5),pad.l+i*step-10,h-7)})}}
function shortNum(v){v=Math.abs(v);return v>=1e6?(v/1e6).toFixed(1)+'M':v>=1e3?(v/1e3).toFixed(0)+'k':v.toFixed(0)}
function lineChart(id,labels,sets){const p=prepCanvas(id);if(!p)return;const {x,w,h}=p,pad={l:46,r:18,t:20,b:30},mx=Math.max(1,...sets.flatMap(s=>s.data.map(v=>Math.abs(Number(v||0)))));animateChart(pr=>{x.clearRect(0,0,w,h);grid(x,w,h,pad,mx,labels);const step=(w-pad.l-pad.r)/Math.max(1,labels.length-1);sets.forEach((s,si)=>{x.strokeStyle=s.color||palette()[si];x.lineWidth=2.5;x.lineJoin='round';x.lineCap='round';x.beginPath();s.data.forEach((v,i)=>{const xx=pad.l+i*step,yy=h-pad.b-(Number(v||0)/mx)*(h-pad.t-pad.b)*pr;i?x.lineTo(xx,yy):x.moveTo(xx,yy)});x.stroke();x.globalAlpha=.08;x.lineTo(pad.l+(labels.length-1)*step,h-pad.b);x.lineTo(pad.l,h-pad.b);x.closePath();x.fillStyle=s.color||palette()[si];x.fill();x.globalAlpha=1});},600)}
function barChart(id,labels,sets){const p=prepCanvas(id);if(!p)return;const {x,w,h}=p,pad={l:46,r:16,t:20,b:42},all=sets.flatMap(s=>s.data.map(Number)),mx=Math.max(1,...all.map(Math.abs)),group=(w-pad.l-pad.r)/Math.max(1,labels.length),bw=Math.max(4,Math.min(24,(group*.72)/sets.length));animateChart(pr=>{x.clearRect(0,0,w,h);grid(x,w,h,pad,mx,[]);labels.forEach((l,i)=>{x.fillStyle='#64748b';x.font='10px system-ui';x.save();x.translate(pad.l+i*group+group/2,h-8);if(labels.length>6)x.rotate(-.35);x.textAlign='center';x.fillText(String(l).slice(0,15),0,0);x.restore();sets.forEach((s,j)=>{const v=Number(s.data[i]||0),bh=(Math.abs(v)/mx)*(h-pad.t-pad.b)*pr,xx=pad.l+i*group+group/2-(sets.length*bw)/2+j*bw,yy=h-pad.b-bh;x.fillStyle=s.color||palette()[j];roundRect(x,xx,yy,bw-2,bh,4);x.fill()})})},600)}
function roundRect(c,x,y,w,h,r){if(h<0){y+=h;h=-h}r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function donutChart(id,labels,values){const p=prepCanvas(id);if(!p)return;const {x,w,h}=p,total=Math.max(.0001,values.reduce((a,b)=>a+Math.abs(Number(b||0)),0)),cx=w*.42,cy=h*.5,r=Math.min(w,h)*.3,cols=palette();animateChart(pr=>{x.clearRect(0,0,w,h);let a=-Math.PI/2;values.forEach((v,i)=>{const d=Math.PI*2*(Math.abs(v)/total)*pr;x.strokeStyle=cols[i%cols.length];x.lineWidth=22;x.beginPath();x.arc(cx,cy,r,a,a+d);x.stroke();a+=d});x.fillStyle='#0f172a';x.font='800 19px system-ui';x.textAlign='center';x.fillText(shortNum(total),cx,cy+5);x.textAlign='left';x.font='11px system-ui';labels.forEach((l,i)=>{const yy=28+i*20;x.fillStyle=cols[i%cols.length];x.fillRect(w*.72,yy-8,9,9);x.fillStyle='#475569';x.fillText(String(l).slice(0,20),w*.72+15,yy)})},550)}
function renderDashboardCharts(an,rep,isCons){const cols=palette();if(isCons){barChart('chartMain',an.projects.map(p=>p.code),[{data:an.projects.map(p=>p.revenue),color:cols[0]},{data:an.projects.map(p=>p.expenses),color:cols[3]},{data:an.projects.map(p=>p.net),color:cols[2]}]);lineChart('chartSecondary',an.months,an.projects.map((p,i)=>({data:an.months.map(m=>an.series[p.id]?.revenue?.[m]||0),color:cols[i%cols.length]})))}else{const pid=Number(state.currentProject),s=an.series[pid]||{revenue:{},expenses:{},cash:{}};lineChart('chartMain',an.months,[{data:an.months.map(m=>s.revenue[m]||0),color:cols[0]},{data:an.months.map(m=>s.expenses[m]||0),color:cols[3]}]);barChart('chartSecondary',an.months,[{data:an.months.map(m=>s.cash[m]||0),color:cols[2]}])}donutChart('chartPosition',['Assets','Liabilities','Equity'],[rep.balance_sheet.total_assets,rep.balance_sheet.total_liabilities,rep.balance_sheet.total_equity])}
function renderOperational(an,isCons){const el=$('operationalPanel');if(!el)return;if(isCons){const rows=an.projects.map(p=>`<tr><td><strong>${esc(p.code)}</strong><br><span class="muted">${esc(p.name)}</span></td><td class="money">${money(p.revenue)}</td><td class="money">${money(p.expenses)}</td><td class="money"><strong>${money(p.net)}</strong></td><td><span class="status ${p.reconciled?'reconciled':'pending'}">${p.reconciled?'Reconciled':'Review'}</span></td></tr>`).join('');el.innerHTML=`<div class="table-wrap"><table class="table"><thead><tr><th>Project</th><th>Revenue</th><th>Expenses</th><th>Net</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table></div>`;return}const pid=Number(state.currentProject),o=an.operational[pid];if(!o){el.innerHTML='<div class="empty">No operational analytics yet.</div>';return}if(o.kind==='LOAN'){el.innerHTML=`<div class="grid3"><div class="kpi"><div class="label">Outstanding</div><div class="value">${money(o.outstanding)}</div></div><div class="kpi"><div class="label">Active Loans</div><div class="value">${o.active}</div></div><div class="kpi"><div class="label">Fully Paid</div><div class="value">${o.fully_paid}</div></div></div><div class="chart-wrap" style="height:180px;margin-top:12px"><canvas class="chart" id="opChart"></canvas></div>`;requestAnimationFrame(()=>barChart('opChart',['Active','Fully Paid'],[{data:[o.active,o.fully_paid]}]))}else if(o.kind==='PALAY'){el.innerHTML=`<div class="grid3"><div class="kpi"><div class="label">Purchases</div><div class="value">${money(o.purchases)}</div></div><div class="kpi"><div class="label">Sales</div><div class="value">${money(o.sales)}</div></div><div class="kpi"><div class="label">Milling Recovery</div><div class="value">${o.milling_recovery_pct.toFixed(2)}%</div></div></div><div class="chart-wrap" style="height:190px;margin-top:12px"><canvas class="chart" id="opChart"></canvas></div>`;requestAnimationFrame(()=>barChart('opChart',o.inventory.map(x=>x.code),[{data:o.inventory.map(x=>x.qty)}]))}else if(o.kind==='FARM_SERVICE'){el.innerHTML=`<div class="chart-wrap" style="height:250px"><canvas class="chart" id="opChart"></canvas></div><div class="legend"><span><i style="background:${palette()[0]}"></i>Revenue</span><span><i style="background:${palette()[3]}"></i>Direct Cost</span></div>`;requestAnimationFrame(()=>barChart('opChart',o.services.map(x=>x.name),[{data:o.services.map(x=>x.revenue),color:palette()[0]},{data:o.services.map(x=>x.cost),color:palette()[3]}]))}else if(o.kind==='RENTAL'){el.innerHTML=`<div class="grid3"><div class="kpi"><div class="label">Occupancy</div><div class="value">${o.occupancy_pct.toFixed(1)}%</div></div><div class="kpi"><div class="label">Billed</div><div class="value">${money(o.billed)}</div></div><div class="kpi"><div class="label">Receivable</div><div class="value">${money(o.receivable)}</div></div></div><div class="chart-wrap" style="height:180px;margin-top:12px"><canvas class="chart" id="opChart"></canvas></div>`;requestAnimationFrame(()=>barChart('opChart',['Billed','Collected','Receivable'],[{data:[o.billed,o.collected,o.receivable]}]))}else{el.innerHTML=`<div class="grid3"><div class="kpi"><div class="label">Income</div><div class="value">${money(o.income)}</div></div><div class="kpi"><div class="label">Expense</div><div class="value">${money(o.expense)}</div></div><div class="kpi"><div class="label">Net</div><div class="value">${money(o.net)}</div></div></div><div class="chart-wrap" style="height:180px;margin-top:12px"><canvas class="chart" id="opChart"></canvas></div>`;requestAnimationFrame(()=>barChart('opChart',['Income','Expense','Net'],[{data:[o.income,o.expense,o.net]}]))}}
function interprojectModal(){modal('Inter-project Accounting Entry',`<div class="notice info">Use this only when one cooperative project charges another project internally. Both project entries are created as a linked pair and eliminated from consolidated revenue/expense.</div><div class="form-grid"><div class="field"><label>Paying / Expense Project</label><select class="select" id="ipFrom">${state.projects.map(p=>`<option value="${p.id}">${esc(p.code+' • '+p.name)}</option>`).join('')}</select></div><div class="field"><label>Receiving / Revenue Project</label><select class="select" id="ipTo">${state.projects.map(p=>`<option value="${p.id}">${esc(p.code+' • '+p.name)}</option>`).join('')}</select></div><div class="field"><label>Date</label><input class="input" id="ipDate" type="date" value="${today()}"></div><div class="field"><label>Amount</label><input class="input" id="ipAmt" type="number" min="0" step="0.01"></div><div class="field span2"><label>Description</label><input class="input" id="ipDesc" placeholder="Internal service or transfer description"></div></div>`,`<button class="btn soft" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveInterproject()">Post Linked Entries</button>`)}
async function saveInterproject(){try{const fromProjectId=Number($('ipFrom').value),toProjectId=Number($('ipTo').value);if(fromProjectId===toProjectId)throw new Error('Choose two different projects.');await api('/api/interproject',{method:'POST',body:JSON.stringify({fromProjectId,toProjectId,date:$('ipDate').value,amount:Number($('ipAmt').value),description:$('ipDesc').value})});closeModal();toast('Linked inter-project entries posted and marked for consolidation elimination.');loadPage()}catch(e){toast(e.message,'error')}}

async function pageTransactions(){const p=currentProjectObj();if(!p)return navigate('dashboard');const {from,to}=fy(),r=await api(`/api/transactions?projectId=${p.id}&from=${from}&to=${to}&limit=1000`);$('content').innerHTML=head('Transactions',`${p.name} • FY ${state.year}`,`<button class="btn soft" onclick="cashModal('receipt')">+ Cash Receipt</button><button class="btn soft" onclick="cashModal('disbursement')">+ Disbursement</button><button class="btn primary" onclick="newJournalModal()">+ Journal Entry</button>`)+`<div class="panel"><div class="toolbar"><input class="input" id="txSearch" placeholder="Search ref or description…"><input class="input" type="date" id="txFrom" value="${from}"><input class="input" type="date" id="txTo" value="${to}"><button class="btn soft sm" onclick="reloadTransactions()">Apply</button></div><div id="txTable">${txTable(r.transactions)}</div></div>`}
function txTable(rows){if(!rows.length)return '<div class="empty"><strong>No transactions in this period.</strong>Use New Entry or change the fiscal year.</div>';return `<div class="table-wrap"><table class="table"><thead><tr><th>Date</th><th>Reference</th><th>Source</th><th>Description</th><th>Amount</th><th>Encoded by</th><th>Status</th></tr></thead><tbody>${rows.map(x=>`<tr onclick="showTransaction(${x.id})" style="cursor:pointer"><td class="nowrap">${dmy(x.tx_date)}</td><td class="mono"><strong>${esc(x.ref)}</strong></td><td>${esc(x.source_type.replaceAll('_',' '))}</td><td>${esc(x.description)}</td><td class="money">${money(x.total)}</td><td>${esc(x.created_by_name)}</td><td><span class="status posted">Posted</span>${x.reversal_of?'<br><span class="muted">Reversal</span>':''}</td></tr>`).join('')}</tbody></table></div>`}
async function reloadTransactions(){const q=$('txSearch').value,from=$('txFrom').value,to=$('txTo').value,p=currentPid(),r=await api(`/api/transactions?projectId=${p}&from=${from}&to=${to}&q=${encodeURIComponent(q)}&limit=1000`);$('txTable').innerHTML=txTable(r.transactions)}
async function showTransaction(id){try{const e=await api('/api/transactions/'+id);$('drawerRoot').innerHTML=`<aside class="drawer"><div class="drawer-head"><button class="icon-btn" onclick="closeDrawer()">×</button><div><strong>${esc(e.ref)}</strong><div class="muted" style="font-size:11px">${esc(e.source_type.replaceAll('_',' '))}</div></div><div class="spacer"></div><span class="status posted">Posted</span></div><div class="drawer-body"><dl class="detail-list"><dt>Project</dt><dd>${esc(e.project_code+' • '+e.project_name)}</dd><dt>Accounting date</dt><dd>${dmy(e.tx_date)}</dd><dt>Encoded at</dt><dd>${new Date(e.encoded_at).toLocaleString()}</dd><dt>Description</dt><dd>${esc(e.description)}</dd><dt>Created by</dt><dd>${esc(e.created_by_name)}</dd></dl><h4>Journal Distribution</h4><div class="table-wrap"><table class="table"><thead><tr><th>Account</th><th>Debit</th><th>Credit</th></tr></thead><tbody>${e.lines.map(l=>`<tr><td>${esc(l.account_code+' • '+l.account_name)}</td><td class="money">${l.debit?money(l.debit):''}</td><td class="money">${l.credit?money(l.credit):''}</td></tr>`).join('')}</tbody></table></div>${!e.reversal_of?`<div style="margin-top:18px"><button class="btn danger" onclick="requestVoid(${e.id},'${esc(e.ref)}')">Request Void / Reversal</button>${e.source_type==='JOURNAL'?` <button class="btn soft" onclick="requestCorrection(${e.id})">Request Correction</button>`:''}</div>`:''}</div></aside>`}catch(e){toast(e.message,'error')}}
function closeDrawer(){$('drawerRoot').innerHTML=''}
function modal(title,body,footer='',lg=false){$('modalRoot').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal ${lg?'lg':''}"><div class="modal-head"><h3>${esc(title)}</h3><div class="spacer"></div><button class="icon-btn" onclick="closeModal()">×</button></div><div class="modal-body">${body}</div>${footer?`<div class="modal-foot">${footer}</div>`:''}</div></div>`}
function closeModal(){$('modalRoot').innerHTML=''}
function accountInput(id,val=''){return `<input class="input acct" id="${id}" list="accountList" value="${esc(val)}" placeholder="Search account code or name…">`}
function accountCode(v){return String(v||'').split('•')[0].trim()}
function journalRow(i,line={}){const acc=line.account_code?`${line.account_code} • ${state.accounts.find(a=>a.code===line.account_code)?.name||''}`:'';return `<div class="journal-row" data-row="${i}">${accountInput('ja'+i,acc)}<input class="input" id="jd${i}" type="number" step="0.01" min="0" value="${line.debit||''}" placeholder="Debit"><input class="input" id="jc${i}" type="number" step="0.01" min="0" value="${line.credit||''}" placeholder="Credit"><button class="icon-btn" onclick="this.closest('.journal-row').remove();calcJournal()">×</button></div>`}
function newJournalModal(prefill=null){let seq=2;modal('New Journal Entry',`<div class="form-grid"><div class="field"><label>Project</label><input class="input" value="${esc(currentProjectObj().code+' • '+currentProjectObj().name)}" disabled></div><div class="field"><label>Accounting Date</label><input class="input" id="jDate" type="date" value="${prefill?.date||today()}"></div><div class="field span2"><label>Description / Particulars</label><input class="input" id="jDesc" value="${esc(prefill?.description||'')}" placeholder="Clear accounting description"></div><div class="field"><label>Cash Flow Classification</label><select class="select" id="jCF"><option>OPERATING</option><option>INVESTING</option><option>FINANCING</option><option>NONE</option></select></div></div><div style="margin-top:20px"><div class="panel-head"><div><h3>Account Distribution</h3><p>Debit must exactly equal Credit before posting.</p></div><div class="spacer"></div><button class="btn soft sm" id="addJRow">+ Line</button></div><div class="journal-lines" id="jRows">${(prefill?.lines||[{},{ }]).map((l,i)=>journalRow(i+1,l)).join('')}</div><div class="journal-total"><span>Debit <b id="jDebit">₱0.00</b></span><span>Credit <b id="jCredit">₱0.00</b></span><span>Difference <b id="jDiff">₱0.00</b></span></div></div>`,`<button class="btn soft" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="postJournal()">Post Journal Entry</button>`,true);$('addJRow').onclick=()=>{$('jRows').insertAdjacentHTML('beforeend',journalRow(++seq));bindJournalCalc()};bindJournalCalc();if(state.year<new Date().getFullYear())toast('Historical accounting date is enabled and will remain separately auditable.','success')}
function bindJournalCalc(){document.querySelectorAll('#jRows input[type=number]').forEach(x=>x.oninput=calcJournal);calcJournal()}
function calcJournal(){let d=0,c=0;document.querySelectorAll('.journal-row').forEach(r=>{const i=r.dataset.row;d+=Number($('jd'+i)?.value||0);c+=Number($('jc'+i)?.value||0)});if($('jDebit')){$('jDebit').textContent=money(d);$('jCredit').textContent=money(c);$('jDiff').textContent=money(d-c);$('jDiff').className=Math.abs(d-c)<.005?'good':'bad'}}
async function postJournal(){try{const lines=[];document.querySelectorAll('.journal-row').forEach(r=>{const i=r.dataset.row,code=accountCode($('ja'+i)?.value),debit=Number($('jd'+i)?.value||0),credit=Number($('jc'+i)?.value||0);if(code&&(debit||credit))lines.push({account_code:code,debit,credit})});await api('/api/journal',{method:'POST',body:JSON.stringify({projectId:currentPid(),date:$('jDate').value,description:$('jDesc').value,cash_flow_class:$('jCF').value,lines})});closeModal();toast('Journal entry posted and financial statements updated.');loadPage()}catch(e){toast(e.message,'error')}}
function cashModal(kind){const receipt=kind==='receipt';modal(receipt?'Cash Receipt':'Cash Disbursement',`<div class="form-grid"><div class="field"><label>Accounting Date</label><input class="input" id="cashDate" type="date" value="${today()}"></div><div class="field"><label>Amount</label><input class="input" id="cashAmt" type="number" min="0" step="0.01"></div><div class="field span2"><label>Description</label><input class="input" id="cashDesc" placeholder="Particulars"></div><div class="field span2"><label>${receipt?'Credit Account':'Debit Account'}</label>${accountInput('cashAcct',receipt?'4080 • Other Operating Income':'6060 • Other Operating Expense')}</div><div class="field"><label>Cash Flow</label><select class="select" id="cashCF"><option>OPERATING</option><option>INVESTING</option><option>FINANCING</option></select></div></div>`,`<button class="btn soft" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveCash('${kind}')">Post</button>`)}
async function saveCash(kind){try{const receipt=kind==='receipt',body={projectId:currentPid(),date:$('cashDate').value,amount:Number($('cashAmt').value),description:$('cashDesc').value,cash_flow_class:$('cashCF').value};body[receipt?'credit_account_code':'debit_account_code']=accountCode($('cashAcct').value);await api('/api/cash/'+kind,{method:'POST',body:JSON.stringify(body)});closeModal();toast('Cash transaction posted.');loadPage()}catch(e){toast(e.message,'error')}}
function requestVoid(entryId,ref){modal('Request Void / Reversal',`<div class="notice info">Posted accounting entries are never physically deleted. An approved request creates an auditable reversing entry and keeps ${esc(ref)} visible.</div><div class="field"><label>Reason for Request</label><textarea class="textarea" id="voidReason" placeholder="Explain the encoding error or reason for voiding" required></textarea></div>`,`<button class="btn soft" onclick="closeModal()">Cancel</button><button class="btn danger" onclick="submitVoid(${entryId})">Send to Super Admin</button>`)}
async function submitVoid(id){try{await api('/api/approval/request',{method:'POST',body:JSON.stringify({entryId:id,action_type:'VOID',reason:$('voidReason').value})});closeModal();closeDrawer();toast('Void request queued for Super Admin approval.');refreshBadges();loadPage()}catch(e){toast(e.message,'error')}}
async function requestCorrection(entryId){try{const e=await api('/api/transactions/'+entryId);closeDrawer();newJournalModal({date:e.tx_date,description:e.description,lines:e.lines});const foot=document.querySelector('.modal-foot');foot.innerHTML=`<button class="btn soft" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="submitCorrection(${entryId})">Request Corrected Entry</button>`}catch(e){toast(e.message,'error')}}
async function submitCorrection(id){try{const lines=[];document.querySelectorAll('.journal-row').forEach(r=>{const i=r.dataset.row,code=accountCode($('ja'+i)?.value),debit=Number($('jd'+i)?.value||0),credit=Number($('jc'+i)?.value||0);if(code&&(debit||credit))lines.push({account_code:code,debit,credit})});const reason=prompt('Reason for correction:');if(!reason)return;await api('/api/approval/request',{method:'POST',body:JSON.stringify({entryId:id,action_type:'CORRECT',reason,proposed:{date:$('jDate').value,description:$('jDesc').value,lines}})});closeModal();toast('Correction request queued for Super Admin.');refreshBadges()}catch(e){toast(e.message,'error')}}
async function pageOperations(){const p=currentProjectObj();if(!p)return navigate('dashboard');let body='';if(p.type==='LOAN'){const l=await api(`/api/loans?projectId=${p.id}`);body=head(p.name,'Loan portfolio, releases, collections, and outstanding balances',`<button class="btn primary" onclick="loanReleaseModal()">+ Release Loan</button>`)+`<div class="kpis">${kpi('Outstanding',money(l.outstanding))}${kpi('Active Loans',l.active)}${kpi('Fully Paid',l.fully_paid)}</div><div class="panel"><div class="table-wrap"><table class="table"><thead><tr><th>Loan No.</th><th>Borrower</th><th>Release</th><th>Principal</th><th>Rate</th><th>Due</th><th>Outstanding</th><th></th></tr></thead><tbody>${l.loans.map(x=>`<tr><td class="mono">${esc(x.loan_no)}</td><td><strong>${esc(x.borrower)}</strong></td><td>${dmy(x.release_date)}</td><td>${money(x.principal)}</td><td>${numFmt(x.interest_rate)}%</td><td>${dmy(x.due_date)}</td><td><strong>${money(x.outstanding)}</strong></td><td>${x.outstanding>.005?`<button class="btn soft sm" onclick="loanPayModal(${x.id},'${esc(x.loan_no)}',${x.outstanding})">Record Payment</button>`:'<span class="status reconciled">Paid</span>'}</td></tr>`).join('')}</tbody></table></div></div>`}else if(p.type==='PALAY'){const x=await api(`/api/palay/inventory?projectId=${p.id}&to=${fy().to}`);body=head('Palay Marketing Operations','Purchase → drying → milling → inventory → market / sales',`<button class="btn soft" onclick="palayModal('purchase')">+ Purchase</button><button class="btn soft" onclick="palayModal('dry')">Drying</button><button class="btn soft" onclick="palayModal('mill')">Milling</button><button class="btn primary" onclick="palayModal('sale')">+ Sale</button>`)+`<div class="kpis">${x.inventory.map(i=>kpi(i.name,numFmt(i.qty)+' '+i.unit,`Value ${money(i.cost)} • Avg ${money(i.unit_cost)}/${i.unit}`)).join('')}</div><div class="panel"><div class="panel-head"><div><h3>Inventory Control</h3><p>Quantity and valuation are derived from posted operational journal metadata.</p></div></div><div class="table-wrap"><table class="table"><thead><tr><th>Code</th><th>Item</th><th>Category</th><th>Quantity</th><th>Average Cost</th><th>Inventory Value</th></tr></thead><tbody>${x.inventory.map(i=>`<tr><td class="mono">${esc(i.code)}</td><td><strong>${esc(i.name)}</strong></td><td>${esc(i.category)}</td><td>${numFmt(i.qty)} ${esc(i.unit)}</td><td>${money(i.unit_cost)}</td><td>${money(i.cost)}</td></tr>`).join('')}</tbody></table></div></div>`}else if(p.type==='FARM_SERVICE'){const [s,a]=await Promise.all([api(`/api/subprojects?projectId=${p.id}`),api(`/api/analytics?projectId=${p.id}&from=${fy().from}&to=${fy().to}`)]),o=a.operational[p.id];body=head('Farm Services','Service-center revenue, direct costs, and machine profitability',`<button class="btn primary" onclick="farmServiceModal()">+ Record Service</button>`)+`<div class="panel"><div class="chart-wrap"><canvas id="farmOpsChart" class="chart"></canvas></div></div><div class="panel" style="margin-top:16px"><div class="table-wrap"><table class="table"><thead><tr><th>Service Center</th><th>Revenue</th><th>Direct Cost</th><th>Net Contribution</th></tr></thead><tbody>${(o.services||[]).map(z=>`<tr><td>${esc(z.name)}</td><td>${money(z.revenue)}</td><td>${money(z.cost)}</td><td><strong>${money(z.net)}</strong></td></tr>`).join('')||'<tr><td colspan="4"><div class="empty">No farm service transactions yet.</div></td></tr>'}</tbody></table></div></div>`;setTimeout(()=>barChart('farmOpsChart',(o.services||[]).map(z=>z.name),[{data:(o.services||[]).map(z=>z.revenue),color:palette()[0]},{data:(o.services||[]).map(z=>z.cost),color:palette()[3]}]),0)}else if(p.type==='RENTAL'){const [u,a]=await Promise.all([api(`/api/rental/units?projectId=${p.id}`),api(`/api/analytics?projectId=${p.id}&from=${fy().from}&to=${fy().to}`)]),o=a.operational[p.id];body=head('Consumers Project / Rental Building','Unit registry, occupancy, billings, collections, and rental receivables',`<button class="btn primary" onclick="rentalUnitModal()">+ Add Unit</button>`)+`<div class="kpis">${kpi('Occupancy',numFmt(o.occupancy_pct)+'%')}${kpi('Billed',money(o.billed))}${kpi('Collected',money(o.collected))}${kpi('Receivable',money(o.receivable))}</div><div class="panel"><div class="table-wrap"><table class="table"><thead><tr><th>Unit</th><th>Name</th><th>Tenant</th><th>Monthly Rate</th><th>Occupancy</th><th>Actions</th></tr></thead><tbody>${u.units.map(z=>`<tr><td class="mono">${esc(z.unit_code)}</td><td>${esc(z.unit_name)}</td><td>${esc(z.tenant||'—')}</td><td>${money(z.monthly_rate)}</td><td><span class="status ${z.occupied?'reconciled':'pending'}">${z.occupied?'Occupied':'Vacant'}</span></td><td><button class="btn soft sm" onclick="rentalBillModal(${z.id},${z.monthly_rate},'${esc(z.unit_code)}')">Bill</button> <button class="btn good sm" onclick="rentalCollectModal(${z.id},'${esc(z.unit_code)}')">Collect</button></td></tr>`).join('')||'<tr><td colspan="6"><div class="empty">No rental units yet.</div></td></tr>'}</tbody></table></div></div>`}else{const a=await api(`/api/analytics?projectId=${p.id}&from=${fy().from}&to=${fy().to}`),o=a.operational[p.id];body=head('Communal Projects / Agricultural Income','Project income, expenses, and agricultural activity accounting',`<button class="btn primary" onclick="communalModal()">+ Record Activity</button>`)+`<div class="kpis">${kpi('Income',money(o.income))}${kpi('Expense',money(o.expense))}${kpi('Net',money(o.net))}</div><div class="panel"><div class="chart-wrap"><canvas id="commChart" class="chart"></canvas></div></div>`;setTimeout(()=>barChart('commChart',['Income','Expense','Net'],[{data:[o.income,o.expense,o.net]}]),0)}$('content').innerHTML=body}
function numFmt(v){return Number(v||0).toLocaleString('en-PH',{maximumFractionDigits:2})}
function loanReleaseModal(){modal('Release New Loan',`<div class="form-grid"><div class="field span2"><label>Borrower</label><input class="input" id="loanBorrower" required></div><div class="field"><label>Principal</label><input class="input" id="loanPrincipal" type="number" min="0" step="0.01"></div><div class="field"><label>Interest Rate (%)</label><input class="input" id="loanRate" type="number" min="0" step="0.01"></div><div class="field"><label>Term (Months)</label><input class="input" id="loanTerm" type="number" min="1" value="6"></div><div class="field"><label>Release Date</label><input class="input" id="loanDate" type="date" value="${today()}"></div><div class="field"><label>Due Date (optional)</label><input class="input" id="loanDue" type="date"></div></div><div class="notice info">Loan release automatically posts Debit Loans Receivable / Credit Cash and appears in the project Cash Flow.</div>`,`<button class="btn soft" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveLoanRelease()">Release & Post</button>`)}
async function saveLoanRelease(){try{await api('/api/loans/release',{method:'POST',body:JSON.stringify({projectId:currentPid(),borrower:$('loanBorrower').value,principal:Number($('loanPrincipal').value),interest_rate:Number($('loanRate').value),term_months:Number($('loanTerm').value),release_date:$('loanDate').value,due_date:$('loanDue').value})});closeModal();toast('Loan released and posted.');loadPage()}catch(e){toast(e.message,'error')}}
function loanPayModal(id,no,outstanding){modal('Record Loan Payment',`<div class="notice info">${esc(no)} • Outstanding principal ${money(outstanding)}</div><div class="form-grid"><div class="field"><label>Date</label><input class="input" id="lpDate" type="date" value="${today()}"></div><div class="field"><label>Principal Payment</label><input class="input" id="lpPrincipal" type="number" max="${outstanding}" step="0.01"></div><div class="field"><label>Interest Collected</label><input class="input" id="lpInterest" type="number" min="0" step="0.01" value="0"></div></div>`,`<button class="btn soft" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveLoanPayment(${id})">Post Payment</button>`)}
async function saveLoanPayment(id){try{await api('/api/loans/payment',{method:'POST',body:JSON.stringify({loanId:id,date:$('lpDate').value,principal_amount:Number($('lpPrincipal').value),interest_amount:Number($('lpInterest').value)})});closeModal();toast('Loan payment posted.');loadPage()}catch(e){toast(e.message,'error')}}
function palayModal(type){if(type==='purchase')modal('Fresh Palay Purchase',`<div class="form-grid"><div class="field"><label>Date</label><input class="input" id="ppDate" type="date" value="${today()}"></div><div class="field"><label>Supplier / Farmer</label><input class="input" id="ppSupplier"></div><div class="field"><label>Quantity (kg)</label><input class="input" id="ppQty" type="number" step="0.001"></div><div class="field"><label>Price / kg</label><input class="input" id="ppPrice" type="number" step="0.01"></div><div class="field"><label>Payment</label><select class="select" id="ppPay"><option>CASH</option><option>CREDIT</option></select></div></div>`,`<button class="btn soft" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="savePalay('purchase')">Post Purchase</button>`);if(type==='dry')modal('Palay Drying',`<div class="form-grid"><div class="field"><label>Date</label><input class="input" id="pdDate" type="date" value="${today()}"></div><div class="field"><label>Fresh Palay Input (kg)</label><input class="input" id="pdIn" type="number" step="0.001"></div><div class="field"><label>Dry Palay Output (kg)</label><input class="input" id="pdOut" type="number" step="0.001"></div></div><div class="notice info">The system transfers the weighted cost of input fresh palay to dry palay and records drying loss in quantity, not as fabricated inventory value.</div>`,`<button class="btn soft" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="savePalay('dry')">Post Drying</button>`);if(type==='mill')modal('Milling Conversion',`<div class="form-grid"><div class="field"><label>Date</label><input class="input" id="pmDate" type="date" value="${today()}"></div><div class="field"><label>Dry Palay Input (kg)</label><input class="input" id="pmIn" type="number" step="0.001"></div><div class="field"><label>Rice Output (kg)</label><input class="input" id="pmRice" type="number" step="0.001"></div><div class="field"><label>Bran Output (kg)</label><input class="input" id="pmBran" type="number" step="0.001" value="0"></div><div class="field"><label>Broken Rice Output (kg)</label><input class="input" id="pmBroken" type="number" step="0.001" value="0"></div></div>`,`<button class="btn soft" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="savePalay('mill')">Post Milling</button>`);if(type==='sale')modal('Market / Rice Sale',`<div class="form-grid"><div class="field"><label>Date</label><input class="input" id="psDate" type="date" value="${today()}"></div><div class="field"><label>Customer</label><input class="input" id="psCustomer"></div><div class="field"><label>Product</label><select class="select" id="psItem"><option value="RICE">Milled Rice</option><option value="BRAN">Rice Bran</option><option value="BROKEN">Broken Rice</option></select></div><div class="field"><label>Quantity (kg)</label><input class="input" id="psQty" type="number" step="0.001"></div><div class="field"><label>Selling Price / kg</label><input class="input" id="psPrice" type="number" step="0.01"></div><div class="field"><label>Payment</label><select class="select" id="psPay"><option>CASH</option><option>CREDIT</option></select></div></div><div class="notice info">Sales automatically post revenue plus weighted-average Cost of Goods Sold and reduce inventory.</div>`,`<button class="btn soft" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="savePalay('sale')">Post Sale</button>`)}
async function savePalay(type){try{let route,body={projectId:currentPid()};if(type==='purchase'){route='/api/palay/purchase';Object.assign(body,{date:$('ppDate').value,supplier:$('ppSupplier').value,qty:Number($('ppQty').value),price_per_kg:Number($('ppPrice').value),payment_type:$('ppPay').value})}if(type==='dry'){route='/api/palay/dry';Object.assign(body,{date:$('pdDate').value,input_qty:Number($('pdIn').value),output_qty:Number($('pdOut').value)})}if(type==='mill'){route='/api/palay/mill';Object.assign(body,{date:$('pmDate').value,input_qty:Number($('pmIn').value),rice_qty:Number($('pmRice').value),bran_qty:Number($('pmBran').value),broken_qty:Number($('pmBroken').value)})}if(type==='sale'){route='/api/palay/sale';Object.assign(body,{date:$('psDate').value,customer:$('psCustomer').value,itemId:$('psItem').value,qty:Number($('psQty').value),price_per_kg:Number($('psPrice').value),payment_type:$('psPay').value})}await api(route,{method:'POST',body:JSON.stringify(body)});closeModal();toast('Palay operation posted and inventory/accounting updated.');loadPage()}catch(e){toast(e.message,'error')}}
async function farmServiceModal(){const s=(await api(`/api/subprojects?projectId=${currentPid()}`)).subprojects;modal('Record Farm Service',`<div class="form-grid"><div class="field"><label>Date</label><input class="input" id="fsDate" type="date" value="${today()}"></div><div class="field"><label>Service / Equipment</label><select class="select" id="fsSub">${s.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></div><div class="field span2"><label>Customer / Farmer</label><input class="input" id="fsCustomer"></div><div class="field"><label>Service Revenue</label><input class="input" id="fsRevenue" type="number" step="0.01"></div><div class="field"><label>Direct Cost</label><input class="input" id="fsCost" type="number" step="0.01" value="0"></div><div class="field"><label>Direct Cost Account</label>${accountInput('fsCostAcct','6010 • Fuel and Lubricants')}</div><div class="field"><label>Payment</label><select class="select" id="fsPay"><option>CASH</option><option>CREDIT</option></select></div></div>`,`<button class="btn soft" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveFarmService()">Post Service</button>`)}
async function saveFarmService(){try{await api('/api/farm-service',{method:'POST',body:JSON.stringify({projectId:currentPid(),subprojectId:Number($('fsSub').value),date:$('fsDate').value,customer:$('fsCustomer').value,revenue:Number($('fsRevenue').value),direct_cost:Number($('fsCost').value),cost_account_code:accountCode($('fsCostAcct').value),payment_type:$('fsPay').value})});closeModal();toast('Farm service posted.');loadPage()}catch(e){toast(e.message,'error')}}
function rentalUnitModal(){modal('Add Rental Unit',`<div class="form-grid"><div class="field"><label>Unit Code</label><input class="input" id="ruCode"></div><div class="field"><label>Unit Name</label><input class="input" id="ruName"></div><div class="field"><label>Monthly Rate</label><input class="input" id="ruRate" type="number" step="0.01"></div><div class="field"><label>Tenant</label><input class="input" id="ruTenant"></div><div class="field"><label>Occupancy</label><select class="select" id="ruOcc"><option value="1">Occupied</option><option value="0">Vacant</option></select></div></div>`,`<button class="btn soft" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveRentalUnit()">Save Unit</button>`)}

function reportScopeQuery(extra=''){const {from,to}=fy();if(state.currentProject==='consolidated')return `projects=${state.projects.map(p=>p.id).join(',')}&consolidated=1&from=${from}&to=${to}${extra}`;return `projectId=${state.currentProject}&from=${from}&to=${to}${extra}`}
let currentReport=null,currentReportType='income-statement';
async function pageFinancials(){currentReportType=currentReportType||'income-statement';const q=reportScopeQuery(),r=await api('/api/reports?'+q);currentReport=r;const scope=state.currentProject==='consolidated'?'Consolidated Cooperative':currentProjectObj().name;$('content').innerHTML=head('Financial Statements',`${scope} • Ledger-derived and reconciliation-controlled`,`<button class="btn soft" onclick="printReport()">Print / Save PDF</button><button class="btn soft" onclick="downloadReport('pdf')">Download PDF</button><button class="btn primary" onclick="downloadReport('excel')">Download Excel</button>`)+`<div class="panel no-print" style="margin-bottom:16px"><div class="toolbar"><select class="select" id="reportType"><option value="income-statement">Income Statement</option><option value="balance-sheet">Balance Sheet</option><option value="cash-flow">Cash Flow</option><option value="trial-balance">Trial Balance</option></select><input class="input" type="date" id="repFrom" value="${r.from}"><input class="input" type="date" id="repTo" value="${r.to}"><button class="btn soft" onclick="regenerateReport()">Generate</button><span class="status ${r.reconciled?'reconciled':'pending'}">${r.reconciled?'Reconciled':'Requires Review'}</span></div><div class="legend"><span>Trial Balance difference: <b>${money(r.trial_balance.difference)}</b></span><span>Balance Sheet difference: <b>${money(r.balance_sheet.balance_check)}</b></span><span>Cash Flow reconciliation: <b>${money(r.cash_flow.reconciliation)}</b></span></div></div><div class="report-shell"><div class="report-paper" id="reportPaper">${reportHtml(currentReportType,r,scope)}</div></div>`;$('reportType').value=currentReportType;$('reportType').onchange=()=>{currentReportType=$('reportType').value;$('reportPaper').innerHTML=reportHtml(currentReportType,currentReport,scope)}}
async function regenerateReport(){try{const from=$('repFrom').value,to=$('repTo').value;let q;if(state.currentProject==='consolidated')q=`projects=${state.projects.map(p=>p.id).join(',')}&consolidated=1&from=${from}&to=${to}`;else q=`projectId=${currentPid()}&from=${from}&to=${to}`;currentReport=await api('/api/reports?'+q);const scope=state.currentProject==='consolidated'?'Consolidated Cooperative':currentProjectObj().name;$('reportPaper').innerHTML=reportHtml(currentReportType,currentReport,scope);toast(currentReport.reconciled?'Statements reconciled.':'Report generated with reconciliation warnings.',currentReport.reconciled?'success':'error')}catch(e){toast(e.message,'error')}}
function reportHeader(scope,title,period){const b=state.branding||{},logo=b.report_logo_path||b.logo_path;return `<div class="report-brand">${logo?`<img src="${state.api}${esc(logo)}">`:''}<h2>${esc(b.coop_name||'Cooperative')}</h2>${b.address?`<p>${esc(b.address)}</p>`:''}${b.registration_no?`<p>CDA Registration: ${esc(b.registration_no)} ${b.tin?' • TIN: '+esc(b.tin):''}</p>`:''}<h3>${esc(scope)}</h3><h3>${esc(title)}</h3><p>${esc(period)}</p></div>`}
function reportHtml(type,r,scope){let rows='';if(type==='income-statement'){rows+=sectionRow('REVENUE');for(const x of r.income_statement.revenue)rows+=acctRow(x.code,x.name,x.amount);rows+=totalRow('TOTAL REVENUE',r.income_statement.total_revenue)+sectionRow('OPERATING EXPENSES');for(const x of r.income_statement.expenses)rows+=acctRow(x.code,x.name,x.amount);rows+=totalRow('TOTAL EXPENSES',r.income_statement.total_expenses)+totalRow('NET SURPLUS / (DEFICIT)',r.income_statement.net_surplus);return reportHeader(scope,'STATEMENT OF OPERATIONS / INCOME STATEMENT',`For the period ${dmy(r.from)} to ${dmy(r.to)}`)+`<table class="statement">${rows}</table>`+reportFoot(r)}if(type==='balance-sheet'){rows+=sectionRow('ASSETS');for(const x of r.balance_sheet.assets)rows+=acctRow(x.code,x.name,x.amount);rows+=totalRow('TOTAL ASSETS',r.balance_sheet.total_assets)+sectionRow('LIABILITIES');for(const x of r.balance_sheet.liabilities)rows+=acctRow(x.code,x.name,x.amount);rows+=totalRow('TOTAL LIABILITIES',r.balance_sheet.total_liabilities)+sectionRow('EQUITY');for(const x of r.balance_sheet.equity)rows+=x.code==='CURRENT'?`<tr><td>${esc(x.name)}</td><td>${money(x.amount)}</td></tr>`:acctRow(x.code,x.name,x.amount);rows+=totalRow('TOTAL EQUITY',r.balance_sheet.total_equity)+totalRow('BALANCE CHECK',r.balance_sheet.balance_check);return reportHeader(scope,'STATEMENT OF FINANCIAL POSITION / BALANCE SHEET',`As of ${dmy(r.to)}`)+`<table class="statement">${rows}</table>`+reportFoot(r)}if(type==='trial-balance'){rows=`<tr class="section"><td>ACCOUNT</td><td style="text-align:right">DEBIT</td><td style="text-align:right">CREDIT</td></tr>`+r.trial_balance.rows.map(x=>`<tr class="acct-click" onclick="ledgerDrill('${esc(x.code)}')"><td><span class="mono">${esc(x.code)}</span> • ${esc(x.name)}</td><td>${x.debit?money(x.debit):''}</td><td>${x.credit?money(x.credit):''}</td></tr>`).join('')+`<tr class="total"><td>TOTAL</td><td>${money(r.trial_balance.total_debit)}</td><td>${money(r.trial_balance.total_credit)}</td></tr><tr class="total"><td>DIFFERENCE</td><td colspan="2">${money(r.trial_balance.difference)}</td></tr>`;return reportHeader(scope,'TRIAL BALANCE',`For the period ${dmy(r.from)} to ${dmy(r.to)}`)+`<table class="statement">${rows}</table>`+reportFoot(r)}const cf=r.cash_flow;rows=`<tr><td>Beginning Cash</td><td>${money(cf.beginning_cash)}</td></tr>`;for(const [k,label] of [['operating','OPERATING ACTIVITIES'],['investing','INVESTING ACTIVITIES'],['financing','FINANCING ACTIVITIES']]){rows+=sectionRow(label);for(const x of cf[k].inflows)rows+=`<tr onclick="showTransaction(${x.id})" style="cursor:pointer"><td><span class="muted">${dmy(x.date)} • ${esc(x.ref)} • ${esc(x.project_code)}</span><br>${esc(x.description)}</td><td>${money(x.inflow)}</td></tr>`;for(const x of cf[k].outflows)rows+=`<tr onclick="showTransaction(${x.id})" style="cursor:pointer"><td><span class="muted">${dmy(x.date)} • ${esc(x.ref)} • ${esc(x.project_code)}</span><br>${esc(x.description)}</td><td>(${money(x.outflow)})</td></tr>`;rows+=totalRow(`Net ${label.replace(' ACTIVITIES','').toLowerCase()} cash flow`,cf[k].net)}rows+=totalRow('NET CHANGE IN CASH',cf.net_change)+`<tr><td>Ending Cash</td><td>${money(cf.ending_cash)}</td></tr><tr><td>Cash Ledger Balance</td><td>${money(cf.ledger_ending_cash)}</td></tr>`+totalRow('RECONCILIATION DIFFERENCE',cf.reconciliation);return reportHeader(scope,'STATEMENT OF CASH FLOWS',`For the period ${dmy(r.from)} to ${dmy(r.to)}`)+`<table class="statement">${rows}</table>`+reportFoot(r)}
function sectionRow(s){return `<tr class="section"><td colspan="2">${esc(s)}</td></tr>`}function acctRow(code,name,amount){return `<tr class="acct-click" onclick="ledgerDrill('${esc(code)}')" style="cursor:pointer"><td><span class="mono muted">${esc(code)}</span> &nbsp;${esc(name)}</td><td>${money(amount)}</td></tr>`}function totalRow(name,amount){return `<tr class="total"><td>${esc(name)}</td><td>${money(amount)}</td></tr>`}function reportFoot(r){return `<div class="report-footer"><span>${esc(state.branding?.report_footer||'Generated by CoopLedger')}</span><span>Status: <strong>${r.reconciled?'RECONCILED':'REQUIRES REVIEW'}</strong> • Generated ${new Date().toLocaleString()}</span></div>`}
async function ledgerDrill(code){try{const from=currentReport?.from||fy().from,to=currentReport?.to||fy().to;let q=`accountCode=${encodeURIComponent(code)}&from=${from}&to=${to}`;if(state.currentProject!=='consolidated')q+=`&projectId=${currentPid()}`;const r=await api('/api/ledger?'+q);modal(`${code} • ${r.account.name}`,`<div class="notice info">Detailed ledger transactions for ${dmy(from)} to ${dmy(to)}</div><div class="table-wrap"><table class="table"><thead><tr><th>Date</th><th>Ref</th><th>Project</th><th>Description</th><th>Debit</th><th>Credit</th></tr></thead><tbody>${r.rows.map(x=>`<tr onclick="showTransaction(${x.entry_id})" style="cursor:pointer"><td>${dmy(x.tx_date)}</td><td class="mono">${esc(x.ref)}</td><td>${esc(x.project_code)}</td><td>${esc(x.description)}</td><td>${x.debit?money(x.debit):''}</td><td>${x.credit?money(x.credit):''}</td></tr>`).join('')}</tbody></table></div><div class="journal-total"><span>Total Debit ${money(r.total_debit)}</span><span>Total Credit ${money(r.total_credit)}</span><span>Net ${money(r.net)}</span></div>`,`<button class="btn primary" onclick="closeModal()">Close</button>`,true)}catch(e){toast(e.message,'error')}}

async function downloadReport(fmt){try{const from=$('repFrom')?.value||currentReport.from,to=$('repTo')?.value||currentReport.to;let q=`type=${currentReportType}&from=${from}&to=${to}`;if(state.currentProject==='consolidated')q+=`&projects=${state.projects.map(p=>p.id).join(',')}&consolidated=1`;else q+=`&projectId=${currentPid()}`;const blob=await api(`/api/reports/${fmt==='pdf'?'pdf':'excel'}?${q}`);const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`CoopLedger-${currentReportType}-${to}.${fmt==='pdf'?'pdf':'xls'}`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast(`${fmt.toUpperCase()} report downloaded.`)}catch(e){toast(e.message,'error')}}

async function pageBackup(){const [cfg,h]=await Promise.all([api('/api/admin/google-drive'),api('/api/admin/backups')]);$('content').innerHTML=head('Backup & Google Drive','Consistent SQLite snapshots, local verification, scheduled/manual cloud backup',`<button class="btn primary" onclick="backupNow()">Backup Now</button>`)+`<div class="grid2"><div class="panel"><div class="panel-head"><div><h3>Google Drive Backup</h3><p>Credentials stay on the local backend and are never stored on GitHub.</p></div></div><div class="form-grid"><div class="field"><label>Drive Upload</label><select class="select" id="gdEnabled"><option value="0" ${!cfg.enabled?'selected':''}>Disabled</option><option value="1" ${cfg.enabled?'selected':''}>Enabled</option></select></div><div class="field"><label>Scheduled Backup</label><select class="select" id="gdScheduleEnabled"><option value="1" ${cfg.schedule_enabled!==false?'selected':''}>Enabled</option><option value="0" ${cfg.schedule_enabled===false?'selected':''}>Disabled</option></select></div><div class="field"><label>Daily Time</label><input class="input" id="gdTime" type="time" value="${esc(cfg.schedule_time||'02:00')}"></div><div class="field"><label>Google Drive Folder ID</label><input class="input" id="gdFolder" value="${esc(cfg.folder_id||'')}"></div><div class="field span2"><label>Service Account JSON ${cfg.credentials_configured?'(configured — leave blank to keep current)':''}</label><textarea class="textarea mono" id="gdJson" placeholder="Paste the cooperative Google service-account JSON only on this local administration screen"></textarea></div></div><div style="margin-top:12px"><button class="btn soft" onclick="saveDriveSettings()">Save Backup Settings</button></div></div><div class="panel"><div class="panel-head"><div><h3>Backup Status</h3><p>Local snapshots are hash-verified before Drive upload.</p></div></div>${h.backups[0]?`<div class="kpi"><div class="label">Latest Backup</div><div class="value" style="font-size:18px">${esc(h.backups[0].status)}</div><div class="sub">${new Date(h.backups[0].created_at).toLocaleString()} • ${h.backups[0].file_name?esc(h.backups[0].file_name):''}</div></div>`:'<div class="empty">No backups created yet.</div>'}</div></div><div class="panel" style="margin-top:16px"><div class="panel-head"><div><h3>Backup History</h3><p>Manual and scheduled backup records.</p></div></div><div class="table-wrap"><table class="table"><thead><tr><th>Date</th><th>Kind</th><th>Status</th><th>File</th><th>Size</th><th>SHA-256</th></tr></thead><tbody>${h.backups.map(x=>`<tr><td>${new Date(x.created_at).toLocaleString()}</td><td>${esc(x.kind)}</td><td><span class="status ${x.status.includes('VERIFIED')?'reconciled':'closed'}">${esc(x.status)}</span></td><td>${esc(x.file_name||'—')}</td><td>${x.file_size?numFmt(x.file_size/1024/1024)+' MB':'—'}</td><td class="mono">${esc((x.sha256||'').slice(0,20))}${x.sha256?'…':''}</td></tr>`).join('')}</tbody></table></div></div>`}
async function saveDriveSettings(){try{await api('/api/admin/google-drive',{method:'POST',body:JSON.stringify({enabled:$('gdEnabled').value==='1',schedule_enabled:$('gdScheduleEnabled').value==='1',schedule_time:$('gdTime').value,folder_id:$('gdFolder').value,service_account_json:$('gdJson').value||undefined})});toast('Backup settings saved securely.');loadPage()}catch(e){toast(e.message,'error')}}
async function backupNow(){try{toast('Creating consistent backup snapshot…');const r=await api('/api/admin/backup',{method:'POST',body:'{}'});toast(`${r.status}: ${r.fileName}`);loadPage()}catch(e){toast(e.message,'error')}}
async function pageSettings(){const b=state.branding||{};$('content').innerHTML=head('Branding & System Identity','White-label CoopLedger for the client cooperative')+`<div class="panel"><div class="form-grid"><div class="field"><label>Cooperative Name</label><input class="input" id="bName" value="${esc(b.coop_name||'')}"></div><div class="field"><label>Short Name</label><input class="input" id="bShort" value="${esc(b.short_name||'')}"></div><div class="field span2"><label>Address</label><input class="input" id="bAddress" value="${esc(b.address||'')}"></div><div class="field"><label>Contact</label><input class="input" id="bContact" value="${esc(b.contact||'')}"></div><div class="field"><label>Email</label><input class="input" id="bEmail" value="${esc(b.email||'')}"></div><div class="field"><label>TIN</label><input class="input" id="bTin" value="${esc(b.tin||'')}"></div><div class="field"><label>CDA Registration No.</label><input class="input" id="bReg" value="${esc(b.registration_no||'')}"></div><div class="field span2"><label>Tagline</label><input class="input" id="bTag" value="${esc(b.tagline||'')}"></div><div class="field"><label>Primary Color</label><input class="input" id="bPrimary" type="color" value="${esc(b.primary_color||'#0f172a')}"></div><div class="field"><label>Secondary Color</label><input class="input" id="bSecondary" type="color" value="${esc(b.secondary_color||'#334155')}"></div><div class="field"><label>Accent Color</label><input class="input" id="bAccent" type="color" value="${esc(b.accent_color||'#0ea5e9')}"></div><div class="field"><label>Application Logo</label><input class="input" id="bLogo" type="file" accept="image/png,image/jpeg,image/svg+xml,image/webp"></div><div class="field"><label>Report Logo</label><input class="input" id="bReportLogo" type="file" accept="image/png,image/jpeg,image/svg+xml,image/webp"></div><div class="field span2"><label>Report Footer</label><input class="input" id="bFooter" value="${esc(b.report_footer||'')}"></div></div><div style="margin-top:16px"><button class="btn primary" onclick="saveBranding()">Save White-label Branding</button></div></div>`}
function fileData(file){return new Promise((res,rej)=>{if(!file)return res(null);const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)})}
async function saveBranding(){try{const lf=$('bLogo').files[0],rf=$('bReportLogo').files[0],body={coop_name:$('bName').value,short_name:$('bShort').value,address:$('bAddress').value,contact:$('bContact').value,email:$('bEmail').value,tin:$('bTin').value,registration_no:$('bReg').value,tagline:$('bTag').value,primary_color:$('bPrimary').value,secondary_color:$('bSecondary').value,accent_color:$('bAccent').value,report_footer:$('bFooter').value};if(lf){body.logo_data=await fileData(lf);body.logo_name=lf.name}if(rf){body.report_logo_data=await fileData(rf);body.report_logo_name=rf.name}const b=await api('/api/admin/branding',{method:'POST',body:JSON.stringify(body)});setBrand(b);renderApp();toast('Branding updated across the system.')}catch(e){toast(e.message,'error')}}
function passwordModal(required=false){
  modal(required?'Required Password Change':'Change Password',`<div class="notice ${required?'info':'good'}">${required?'For security, the one-time bootstrap/temporary password must be replaced before regular use.':'Choose a strong new password.'}</div><div class="field"><label>Current Password</label><input class="input" type="password" id="pwCurrent"></div><div class="field"><label>New Password</label><input class="input" type="password" id="pwNew"><small class="muted">10+ characters with uppercase, lowercase, number, and symbol.</small></div>`,required?'':`<button class="btn soft" onclick="closeModal()">Cancel</button>`);
  if(required){const bd=document.querySelector('.modal-backdrop');bd.onclick=()=>{};const x=document.querySelector('.modal-head .icon-btn');if(x)x.remove();const f=document.createElement('div');f.className='modal-foot';f.innerHTML='<button class="btn primary" onclick="savePassword(true)">Set New Password</button>';document.querySelector('.modal').appendChild(f)}
  else document.querySelector('.modal-foot').insertAdjacentHTML('beforeend','<button class="btn primary" onclick="savePassword(false)">Change Password</button>');
}
async function savePassword(required){try{await api('/api/auth/change-password',{method:'POST',body:JSON.stringify({current_password:$('pwCurrent').value,new_password:$('pwNew').value})});state.user.must_change=false;closeModal();toast('Password changed successfully.')}catch(e){toast(e.message,'error');if(required)passwordModal(true)}}
async function showNotifications(){try{const r=await api('/api/notifications');modal('Notifications',r.notifications.length?r.notifications.slice(0,50).map(n=>`<div class="audit-item"><strong>${esc(n.title)}</strong><small>${new Date(n.created_at).toLocaleString()} • ${esc(n.type)}</small><div style="font-size:12px;margin-top:5px">${esc(n.message)}</div></div>`).join(''):'<div class="empty">No notifications yet.</div>',`<button class="btn primary" onclick="closeModal()">Close</button>`)}catch(e){toast(e.message,'error')}}
async function refreshBadges(){try{const [n,a]=await Promise.all([api('/api/notifications'),roleIs('SUPERADMIN')?api('/api/approvals?status=PENDING'):Promise.resolve({requests:[]})]);const cnt=n.notifications.filter(x=>!x.read_at).length;if($('notifBadge')){$('notifBadge').textContent=cnt;$('notifBadge').classList.toggle('hidden',!cnt)}if($('approvalNavBadge')&&a.requests.length)$('approvalNavBadge').innerHTML=`<span class="status pending">${a.requests.length}</span>`}catch{}}
function connectSocket(){try{if(state.socket)state.socket.disconnect();const old=document.getElementById('socketClient');if(old)old.remove();const s=document.createElement('script');s.id='socketClient';s.src=state.api+'/socket.io/socket.io.js';s.onload=()=>{state.socket=io(state.api,{transports:['websocket','polling']});state.socket.on('connect',()=>{if($('liveText'))$('liveText').textContent='Live sync';if($('liveDot'))$('liveDot').style.background='#4ade80'});state.socket.on('disconnect',()=>{if($('liveText'))$('liveText').textContent='Reconnecting…';if($('liveDot'))$('liveDot').style.background='#f59e0b'});['transaction:created','transaction:updated','financials:updated','approval:approved','approval:rejected','branding:updated','backup:completed','notification:new'].forEach(ev=>state.socket.on(ev,data=>{if(ev==='branding:updated'){setBrand(data);renderApp();return}refreshBadges();if(['dashboard','transactions','financials','approvals','backup'].includes(state.page))debouncedReload()}))};s.onerror=()=>{if($('liveText'))$('liveText').textContent='API online • live retry';setTimeout(connectSocket,5000)};document.head.appendChild(s)}catch{}}
let reloadTimer;function debouncedReload(){clearTimeout(reloadTimer);reloadTimer=setTimeout(()=>loadPage(),350)}
window.addEventListener('resize',()=>{if(state.page==='dashboard')debouncedReload()});
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
init();
</script>
</body></html>
