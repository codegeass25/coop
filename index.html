async function runSystemReset(){if(($('resetConfirm')?.value||'').trim().toUpperCase()!=='RESET DATA')return toast('Type RESET DATA exactly to confirm.','error');try{const r=await api('/api/admin/reset-system',{method:'POST',body:JSON.stringify({superadmin_password:$('resetPass').value,confirmation:$('resetConfirm').value})});closeModal();toast('System reset completed. Configuration and Super Admin password were preserved.');modal('System Reset Completed',`<div class="notice good"><strong>Transactional and operational data were cleared successfully.</strong></div><dl class="detail-list"><dt>Safety backup</dt><dd>${esc(r.safety_backup_name||'Created')}</dd><dt>Preserved</dt><dd>Settings, branding, users/passwords, SMS, project configuration, pricing, uploads, backup history</dd><dt>Reset scope</dt><dd>Transactional and operational records only</dd></dl><div class="guide">You can immediately continue using the same Super Admin password. The safety backup remains available in Backup History / local backups if rollback is ever needed.</div>`,`<button class="btn primary" onclick="closeModal();navigate('dashboard')">Go to Clean Dashboard</button>`,true);if(state.socket)state.socket.emit?.('client:reset-complete')}catch(e){toast(e.message,'error')}}
async function restoreInspect(source,backupId='',driveFileId='',fileName=''){try{toast('Inspecting and verifying backup…');const body={source};if(backupId)body.backup_id=Number(backupId);if(driveFileId)body.drive_file_id=decodeURIComponent(driveFileId);if(fileName)body.file_name=decodeURIComponent(fileName);const r=await api('/api/admin/restore/inspect',{method:'POST',body:JSON.stringify(body)});window.pendingRestore={...body,info:r};modal('Inspect Backup & Choose Rollback',`<div class="notice good"><strong>Backup passed integrity inspection.</strong><br>${esc(r.backup_name)} • v${esc(r.version)} • ${r.created_at?new Date(r.created_at).toLocaleString():'date unavailable'}<br><span class="mono">SHA-256 ${esc(r.sha256)}</span></div>${r.warning?`<div class="notice info">${esc(r.warning)}</div>`:''}<div class="panel" style="box-shadow:none;margin:12px 0"><h3 style="margin-top:0">Select what to restore</h3><label class="project-toggle" style="display:flex;margin:8px 0"><input type="checkbox" id="restoreDb" checked> <span><strong>Database & Accounting Data</strong><br><small class="muted">All projects, journals, loans, batches, consignment, rental bills, users, roles, settings stored in SQLite. Full cross-module database rollback; not per-table.</small></span></label><label class="project-toggle" style="display:flex;margin:8px 0"><input type="checkbox" id="restoreUploads" checked> <span><strong>Uploaded Files</strong><br><small class="muted">App/report logos and uploaded files contained in the backup.</small></span></label><div class="guide"><strong>Recommended:</strong> leave both checked for a true point-in-time rollback. Database-only is useful when uploaded files are unchanged. Uploads-only changes files without changing accounting data.</div></div><dl class="detail-list"><dt>Database</dt><dd>${r.database?.available?'Available • '+numFmt(Number(r.database.size||0)/1024/1024)+' MB':'Not available'}</dd><dt>Uploaded files</dt><dd>${r.uploads?.count||0} file(s) • ${numFmt(Number(r.uploads?.size||0)/1024/1024)} MB</dd><dt>Source</dt><dd>${esc(r.source)}</dd></dl><div class="field"><label>Super Admin Password — required</label><input class="input" id="restorePass" type="password" autocomplete="current-password"></div><div class="field"><label>Type RESTORE exactly</label><input class="input mono" id="restoreConfirm" autocomplete="off" placeholder="RESTORE"></div><div class="notice bad"><strong>Before applying:</strong> CoopLedger automatically creates a PRE_RESTORE_SAFETY backup. The backend then restarts; all active sessions are invalidated so everyone must log in again.</div>`,`<button class="btn soft" onclick="closeModal()">Cancel</button><button class="btn danger" onclick="startRestore()">Create Safety Backup & Roll Back</button>`,true)}catch(e){toast(e.message,'error')}}
async function startRestore(){const p=window.pendingRestore;if(!p)return toast('Select and inspect a backup first.','error');const restore_database=!!$('restoreDb')?.checked,restore_uploads=!!$('restoreUploads')?.checked;if(!restore_database&&!restore_uploads)return toast('Select Database, Uploaded Files, or both.','error');if(($('restoreConfirm')?.value||'').trim().toUpperCase()!=='RESTORE')return toast('Type RESTORE exactly to confirm.','error');try{const body={source:p.source,restore_database,restore_uploads,superadmin_password:$('restorePass').value,confirmation:$('restoreConfirm').value};if(p.backup_id)body.backup_id=p.backup_id;if(p.drive_file_id)body.drive_file_id=p.drive_file_id;if(p.file_name)body.file_name=p.file_name;const r=await api('/api/admin/restore',{method:'POST',body:JSON.stringify(body)});closeModal();modal('Safe Rollback Started',`<div class="notice info"><strong>${esc(r.message||'Safety backup created. Rollback is being applied.')}</strong></div><dl class="detail-list"><dt>Backup</dt><dd>${esc(r.backup_name||p.info?.backup_name||'')}</dd><dt>Restore</dt><dd>${restore_database?'Database':''}${restore_database&&restore_uploads?' + ':''}${restore_uploads?'Uploaded Files':''}</dd><dt>Safety Backup</dt><dd>${esc(r.safety_backup_name||'Created automatically')}</dd></dl><div class="guide">Ayaw i-close ang backend PC. The server will stop briefly, apply the staged rollback offline, verify/reopen the database, restart, then require a fresh login.</div><div class="empty" id="restoreWait"><strong>Waiting for CoopLedger to restart…</strong></div>`,'',true);setTimeout(()=>waitForRestoreRestart(Date.now()),3000)}catch(e){toast(e.message,'error')}}
async function waitForRestoreRestart(started){const box=$('restoreWait');try{const r=await fetch(state.api+'/api/health',{cache:'no-store'});if(r.ok){if(box)box.innerHTML='<strong>Rollback applied and backend is online.</strong><br>Reloading to secure login…';localStorage.removeItem('coop_token');setTimeout(()=>location.reload(),1200);return}}catch{}if(Date.now()-started>120000){if(box)box.innerHTML='<strong>Backend has not returned within 2 minutes.</strong><br>Check the backend console and BACKEND-LOCAL-CLOUDFLARE/backups/RESTORE-PENDING.json / restore-log. Your automatic safety backup remains available.';return}if(box)box.innerHTML='<strong>Applying rollback / restarting…</strong><br><span class="muted">This can take longer when uploaded files or Drive downloads are large.</span>';setTimeout(()=>waitForRestoreRestart(started),2000)}
async function pageSettings(){const b=state.branding||{},[sms,p02,sub]=await Promise.all([api('/api/admin/sms-gate'),api('/api/admin/p02-settings'),api('/api/admin/submission-settings')]),sp=sms.provider||{},sn=sms.notifications||{};window.smsGateCfg=sms;window.p02AdminSettings=p02;window.submissionSettings=sub;$('content').innerHTML=head('Branding & System Settings','White-label identity + secure SMSGate rental billing configuration')+`<div class="panel"><div class="panel-head"><div><h3>Cooperative Branding</h3><p>Applies to the app and generated reports.</p></div></div><div class="form-grid"><div class="field"><label>Cooperative Name</label><input class="input" id="bName" value="${esc(b.coop_name||'')}"></div><div class="field"><label>Short Name</label><input class="input" id="bShort" value="${esc(b.short_name||'')}"></div><div class="field span2"><label>Address</label><input class="input" id="bAddress" value="${esc(b.address||'')}"></div><div class="field"><label>Contact</label><input class="input" id="bContact" value="${esc(b.contact||'')}"></div><div class="field"><label>Email</label><input class="input" id="bEmail" value="${esc(b.email||'')}"></div><div class="field"><label>TIN</label><input class="input" id="bTin" value="${esc(b.tin||'')}"></div><div class="field"><label>CDA Registration No.</label><input class="input" id="bReg" value="${esc(b.registration_no||'')}"></div><div class="field span2"><label>Tagline</label><input class="input" id="bTag" value="${esc(b.tagline||'')}"></div><div class="field"><label>Primary Color</label><input class="input" id="bPrimary" type="color" value="${esc(b.primary_color||'#0f172a')}"></div><div class="field"><label>Secondary Color</label><input class="input" id="bSecondary" type="color" value="${esc(b.secondary_color||'#334155')}"></div><div class="field"><label>Accent Color</label><input class="input" id="bAccent" type="color" value="${esc(b.accent_color||'#0ea5e9')}"></div><div class="field"><label>Application Logo</label><input class="input" id="bLogo" type="file" accept="image/png,image/jpeg,image/svg+xml,image/webp"></div><div class="field"><label>Report Logo</label><input class="input" id="bReportLogo" type="file" accept="image/png,image/jpeg,image/svg+xml,image/webp"></div><div class="field span2"><label>Report Footer</label><input class="input" id="bFooter" value="${esc(b.report_footer||'')}"></div></div><div style="margin-top:16px"><button class="btn primary" onclick="saveBranding()">Save White-label Branding</button></div></div><div class="panel" style="margin-top:16px"><div class="panel-head"><div><h3>P02 — Rice Packaging & Consignment</h3><p>Set once; Project Managers inherit these values automatically.</p></div></div><div class="form-grid"><div class="field"><label>Standard Full Sack Weight (kg)</label><input class="input big-input" id="p02SackKg" type="number" min="1" max="100" step="0.01" value="${Number(p02.sack_kg||50)}"></div><div class="field"><label>Default Consignee Share / Discount (%)</label><input class="input big-input" id="p02CommPct" type="number" min="0" max="100" step="0.01" value="${Number(p02.consignee_commission_pct==null?15:p02.consignee_commission_pct)}"></div></div>${guide('Recommended default: 50 kg per full sack and 15% consignee share. Every new consignment snapshots the current percentage so changing settings later does not rewrite prior agreements. Accounting records the store share as Consignee Commission / Selling Expense while gross rice sales remain transparent.')}<div style="margin-top:16px"><button class="btn primary" onclick="saveP02Settings()">Save P02 Sales Settings</button></div></div><div class="panel official-submission-card" style="margin-top:16px"><div class="panel-head"><div><div class="official-kicker">OFFICIAL SUBMISSION REPORTS</div><h3>Net Surplus Allocation Settings</h3><p>These percentages configure the cooperative net-surplus allocation reference used where applicable. Comparative report bodies remain derived from the actual ledger accounts and posted transactions. The total must always equal 100%.</p></div><span class="status reconciled">Allocation control</span></div><div class="form-grid"><div class="field"><label>Reserved Fund (%)</label><input class="input" id="srReserve" type="number" step="0.01" min="0" max="100" value="${Number(sub.reserve_pct)}"></div><div class="field"><label>Education & Training Fund - APEX (%)</label><input class="input" id="srApex" type="number" step="0.01" min="0" max="100" value="${Number(sub.education_apex_pct)}"></div><div class="field"><label>Education & Training Fund - Local (%)</label><input class="input" id="srLocal" type="number" step="0.01" min="0" max="100" value="${Number(sub.education_local_pct)}"></div><div class="field"><label>Optional Fund (%)</label><input class="input" id="srOptional" type="number" step="0.01" min="0" max="100" value="${Number(sub.optional_pct)}"></div><div class="field"><label>Community Development Fund (%)</label><input class="input" id="srCommunity" type="number" step="0.01" min="0" max="100" value="${Number(sub.community_pct)}"></div><div class="field"><label>Patronage Refund (%)</label><input class="input" id="srPatronage" type="number" step="0.01" min="0" max="100" value="${Number(sub.patronage_refund_pct)}"></div><div class="field"><label>Interest on Share Capital (%)</label><input class="input" id="srIsc" type="number" step="0.01" min="0" max="100" value="${Number(sub.interest_share_capital_pct)}"></div><div class="field"><label>Required Total</label><input class="input auto-field" id="srTotal" disabled value="100.00%"></div></div>${guide('Default reference allocation: 10% Reserved Fund, 5% CETF-APEX, 5% CETF-Local, 7% Optional Fund, 3% Community Development Fund, 21% Patronage Refund, 49% Interest on Share Capital. Change only when formally authorized by the cooperative/accountant.')}<div style="margin-top:16px"><button class="btn primary" onclick="saveSubmissionSettings()">Save Submission Allocation Settings</button></div></div><div class="panel" style="margin-top:16px"><div class="panel-head"><div><h3>SMSGate — Commercial Rental Billing</h3><p>Credentials stay on the backend PC. Automatic billing SMS uses a queued sender to avoid burst/queue problems.</p></div><span class="status ${sp.configured?'reconciled':'pending'}">${sp.configured?'Configured':'Needs credentials'}</span></div><div class="form-grid"><div class="field"><label>SMSGATE_USERNAME</label><input class="input" id="sgUser" value="${esc(sp.username||'')}"></div><div class="field"><label>SMSGATE_PASSWORD</label><input class="input" id="sgPass" type="password" placeholder="${sp.password_configured?'Saved — leave blank to keep':'Enter password'}"></div><div class="field span2"><label>SMSGATE_BASE_URL</label><input class="input mono" id="sgBase" value="${esc(sp.base_url||'https://api.sms-gate.app/3rdparty/v1')}"></div><div class="field"><label>SMSGATE_SIM</label><input class="input" id="sgSim" value="${esc(sp.sim||'')}" placeholder="1"></div><div class="field"><label>SMSGATE_EXPEDITED</label><select class="select" id="sgExp"><option value="1" ${sp.expedited?'selected':''}>true — expedited</option><option value="0" ${!sp.expedited?'selected':''}>false — normal</option></select></div><div class="field"><label>Automatic Tenant SMS</label><select class="select" id="rnEnabled"><option value="1" ${sn.sms_enabled?'selected':''}>Enabled</option><option value="0" ${!sn.sms_enabled?'selected':''}>Disabled</option></select></div><div class="field"><label>Send automatically after billing</label><select class="select" id="rnAuto"><option value="1" ${sn.auto_send_on_bill?'selected':''}>Yes</option><option value="0" ${!sn.auto_send_on_bill?'selected':''}>No</option></select></div><div class="field"><label>Include Water Details in SMS</label><select class="select" id="rnWater"><option value="1" ${sn.include_water?'selected':''}>Show water consumption</option><option value="0" ${!sn.include_water?'selected':''}>Hide water from SMS async function saveSubmissionSettings(){try{const body={reserve_pct:Number($('srReserve').value||0),education_apex_pct:Number($('srApex').value||0),education_local_pct:Number($('srLocal').value||0),optional_pct:Number($('srOptional').value||0),community_pct:Number($('srCommunity').value||0),patronage_refund_pct:Number($('srPatronage').value||0),interest_share_capital_pct:Number($('srIsc').value||0)},total=Object.values(body).reduce((a,b)=>a+Number(b||0),0);if(Math.abs(total-100)>.005)return toast(`Allocation must total 100%. Current total: ${numFmt(total)}%.`,'error');const r=await api('/api/admin/submission-settings',{method:'POST',body:JSON.stringify(body)});window.submissionSettings=r;toast('Official submission allocation settings saved.','success')}catch(e){toast(e.message,'error')}}

  else document.querySelector('.modal-foot').insertAdjacentHTML('beforeend','<button class="btn primary" onclick="savePassword(false)">Change Password</button>');
}
async function savePassword(required){try{await api('/api/auth/change-password',{method:'POST',body:JSON.stringify({current_password:$('pwCurrent').value,new_password:$('pwNew').value})});state.user.must_change=false;closeModal();toast('Password changed successfully.')}catch(e){toast(e.message,'error');if(required)passwordModal(true)}}
async function showNotifications(){try{const r=await api('/api/notifications');modal('Notifications',r.notifications.length?r.notifications.slice(0,50).map(n=>`<div class="audit-item"><strong>${esc(n.title)}</strong><small>${new Date(n.created_at).toLocaleString()} • ${esc(n.type)}</small><div style="font-size:12px;margin-top:5px">${esc(n.message)}</div></div>`).join(''):'<div class="empty">No notifications yet.</div>',`<button class="btn primary" onclick="closeModal()">Close</button>`)}catch(e){toast(e.message,'error')}}
async function refreshBadges(){try{const [n,a]=await Promise.all([api('/api/notifications'),roleIs('SUPERADMIN')?api('/api/approvals?status=PENDING'):Promise.resolve({requests:[]})]);const cnt=n.notifications.filter(x=>!x.read_at).length;if($('notifBadge')){$('notifBadge').textContent=cnt;$('notifBadge').classList.toggle('hidden',!cnt)}if($('approvalNavBadge')&&a.requests.length)$('approvalNavBadge').innerHTML=`<span class="status pending">${a.requests.length}</span>`}catch{}}
function connectSocket(){try{if(state.socket)state.socket.disconnect();const old=document.getElementById('socketClient');if(old)old.remove();const s=document.createElement('script');s.id='socketClient';s.src=state.api+'/socket.io/socket.io.js';s.onload=()=>{state.socket=io(state.api,{transports:['websocket','polling']});state.socket.on('connect',()=>{if($('liveText'))$('liveText').textContent='Live sync';if($('liveDot'))$('liveDot').style.background='#4ade80'});state.socket.on('disconnect',()=>{if($('liveText'))$('liveText').textContent='Reconnecting…';if($('liveDot'))$('liveDot').style.background='#f59e0b'});['transaction:created','transaction:updated','financials:updated','approval:approved','approval:rejected','branding:updated','backup:completed','notification:new','consignment:updated','p02:settings-updated','rental:billing-updated','sms:queued','sms:updated','system:reset'].forEach(ev=>state.socket.on(ev,data=>{if(ev==='branding:updated'){setBrand(data);renderApp();return}refreshBadges();if(['dashboard','transactions','financials','approvals','backup'].includes(state.page))debouncedReload()}))};s.onerror=()=>{if($('liveText'))$('liveText').textContent='API online • live retry';setTimeout(connectSocket,5000)};document.head.appendChild(s)}catch{}}
let reloadTimer;function debouncedReload(){clearTimeout(reloadTimer);reloadTimer=setTimeout(()=>loadPage(),350)}
window.addEventListener('resize',()=>{if(state.page==='dashboard')debouncedReload()});
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
init();
</script>
</body></html>
