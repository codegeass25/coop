<script>
'use strict';
const DEFAULT_API='https://coop.mdmsportal.uk';
const localHost=['localhost','127.0.0.1'].includes(location.hostname);
const state={api:localStorage.getItem('coop_api')||(localHost?'http://127.0.0.1:5000':DEFAULT_API),token:localStorage.getItem('coop_token')||'',user:null,branding:null,projects:[],accounts:[],currentProject:'consolidated',year:Number(localStorage.getItem('coop_year')||new Date().getFullYear()),page:'dashboard',socket:null,analyticsSelection:JSON.parse(localStorage.getItem('coop_analytics_projects')||'[]')};
const $=(id)=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), money=v=>'₱'+Number(v||0).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2}), dmy=s=>s?new Date(s+'T00:00:00').toLocaleDateString('en-PH',{year:'numeric',month:'short',day:'2-digit'}):'', today=()=>new Date().toISOString().slice(0,10);
function toast(msg,type='success'){const e=document.createElement('div');e.className='toast '+type;e.textContent=msg;$('toasts').appendChild(e);setTimeout(()=>e.remove(),4200)}
async function api(route,opt={}){const r=await fetch(state.api+route,{...opt,headers:{...(opt.body?{'Content-Type':'application/json'}:{}),...(state.token?{Authorization:'Bearer '+state.token}:{}),...(opt.headers||{})}});const ct=r.headers.get('content-type')||'';if(!r.ok){let e;try{e=await r.json()}catch{e={error:'HTTP '+r.status}};if(r.status===401&&route!='/api/auth/login'){if(String(e.error||'').includes('expired'))logout(false)}throw new Error(e.error||'Request failed')}if(ct.includes('application/json'))return r.json();return r.blob()}
async function publicApi(route){const r=await fetch(state.api+route);if(!r.ok)throw new Error('Backend unavailable');return r.json()}
function setBrand(b){state.branding=b||state.branding||{};const s=document.documentElement.style;s.setProperty('--brand',b.primary_color||'#0f172a');s.setProperty('--brand2',b.secondary_color||'#334155');s.setProperty('--accent',b.accent_color||'#0ea5e9');document.title=(b.short_name||'CoopLedger')+' • Accounting';document.querySelector('meta[name=theme-color]').content=b.primary_color||'#0f172a';try{const m={name:b.coop_name||'CoopLedger',short_name:b.short_name||'CoopLedger',start_url:'./',display:'standalone',background_color:'#f5f7fb',theme_color:b.primary_color||'#0f172a',icons:[{src:'icons/icon-192.png',sizes:'192x192',type:'image/png'},{src:'icons/icon-512.png',sizes:'512x512',type:'image/png'}]};$('manifestLink').href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/manifest+json'}))}catch{}}
function logoHtml(cls='brand-logo'){const p=state.branding?.logo_path;return `<div class="${cls}">${p?`<img src="${state.api}${esc(p)}" alt="logo">`:'CL'}</div>`}
async function init(){try{setBrand(await publicApi('/api/public/branding'))}catch{setBrand({coop_name:'CoopLedger',short_name:'CoopLedger'})}if(state.token){try{state.user=await api('/api/me');await loadBasics();renderApp();connectSocket();if(state.user.must_change)passwordModal(true);return}catch{state.token='';localStorage.removeItem('coop_token')}}renderLogin()}
function renderLogin(){const b=state.branding||{};$('root').innerHTML=`<div class="login-wrap"><section class="login-art"><div class="brand-lockup">${logoHtml()}<div><strong>${esc(b.coop_name||'CoopLedger')}</strong><div style="opacity:.65;font-size:12px">Multi-Project Accounting & Financial Management</div></div></div><div class="login-copy"><div class="eyebrow">Cooperative Financial Control</div><h1>One ledger.<br>Every project.<br>Fully transparent.</h1><p>Project-aware accounting, reconciled financial statements, protected audit trails, historical posting, live approvals, and consolidated management analytics.</p><div class="trust-row"><span class="trust-pill">Double-entry accounting</span><span class="trust-pill">Role-based projects</span><span class="trust-pill">Live audit controls</span><span class="trust-pill">PWA ready</span></div></div><div style="font-size:11px;opacity:.5">CoopLedger v1.4 • Hardened client deployment</div></section><section class="login-panel"><form class="login-card" id="loginForm"><div class="eyebrow" style="color:var(--accent)">Secure access</div><h2>Welcome back</h2><p class="muted">Sign in with your cooperative account.</p><div class="field"><label>Username</label><input class="input" id="loginUser" autocomplete="username" required></div><div class="field"><label>Password</label><input class="input" id="loginPass" type="password" autocomplete="current-password" required></div><button class="btn primary full" type="submit">Sign in to CoopLedger</button><div id="loginError"></div><div style="margin-top:24px;font-size:11px;color:#94a3b8;line-height:1.6">Backend: <span class="mono">${esc(state.api)}</span><br>If this is first deployment, your initial Super Admin credential is generated locally by the backend.</div></form></section></div>`;$('loginForm').onsubmit=login}
async function login(e){e.preventDefault();$('loginError').innerHTML='';try{const x=await api('/api/auth/login',{method:'POST',body:JSON.stringify({username:$('loginUser').value,password:$('loginPass').value})});state.token=x.token;localStorage.setItem('coop_token',state.token);state.user=x.user;await loadBasics();renderApp();connectSocket();if(state.user.must_change)passwordModal(true)}catch(err){$('loginError').innerHTML=`<div class="login-error">${esc(err.message)}</div>`}}
function logout(call=true){if(call&&state.token)api('/api/auth/logout',{method:'POST'}).catch(()=>{});state.token='';state.user=null;localStorage.removeItem('coop_token');try{state.socket?.disconnect()}catch{}renderLogin()}
async function loadBasics(){const [p,a]=await Promise.all([api('/api/projects'),api('/api/accounts')]);state.projects=p.projects;state.accounts=a.accounts;if(!state.analyticsSelection.length)state.analyticsSelection=state.projects.map(x=>x.id);$('accountList')&&fillAccountList()}
function fillAccountList(){const d=$('accountList');if(d)d.innerHTML=state.accounts.map(a=>`<option value="${esc(a.code+' • '+a.name)}"></option>`).join('')}
function roleIs(...r){return r.includes(state.user?.role)}
function currentPid(){return state.currentProject==='consolidated'?null:Number(state.currentProject)}
function currentProjectObj(){return state.projects.find(p=>p.id===currentPid())}
function navItems(){const p=currentProjectObj(),items=[['OVERVIEW','dashboard','◫','Dashboard']];if(state.currentProject!=='consolidated'){items.push(['WORKSPACE','transactions','⇄','Transactions'],['WORKSPACE','operations','◎','Project Operations'],['FINANCE','financials','▤','Financial Statements'],['CONTROL','audit','⌁','Audit Trail']);}else items.push(['FINANCE','financials','▤','Consolidated Statements'],['CONTROL','audit','⌁','General Audit Trail']);if(roleIs('SUPERADMIN'))items.push(['CONTROL','approvals','✓','Approval Queue'],['ADMINISTRATION','users','♙','Users & Project Access'],['ADMINISTRATION','periods','◷','Accounting Periods'],['ADMINISTRATION','backup','↥','Backup & Restore'],['ADMINISTRATION','settings','⚙','Branding & Settings']);return items}
function renderApp(){const b=state.branding||{},opts=(roleIs('SUPERADMIN')?`<option value="consolidated">Consolidated Cooperative</option>`:'')+state.projects.map(p=>`<option value="${p.id}" ${String(state.currentProject)===String(p.id)?'selected':''}>${esc(p.code+' • '+p.name)}</option>`).join('');if(state.currentProject==='consolidated'&&!roleIs('SUPERADMIN'))state.currentProject=String(state.projects[0]?.id||'');let last='';const nav=navItems().map(([sec,id,ic,label])=>`${sec!==last?`<div class="nav-section">${last=sec}</div>`:''}<button class="nav-btn ${state.page===id?'active':''}" data-page="${id}"><span class="nav-icon">${ic}</span>${label}${id==='approvals'?'<span class="spacer"></span><span id="approvalNavBadge"></span>':''}</button>`).join('');$('root').innerHTML=`<div class="app"><div class="mobile-overlay" id="overlay"></div><aside class="sidebar" id="sidebar"><div class="side-brand">${logoHtml()}<div><strong>${esc(b.short_name||'CoopLedger')}</strong><small>${esc(state.user.role.replaceAll('_',' '))}</small></div></div><nav>${nav}</nav><div class="sidebar-footer"><div style="padding:8px 10px;font-size:11px;color:rgba(255,255,255,.65)"><span class="live-dot" id="liveDot"></span> <span id="liveText">Connecting…</span></div><button class="nav-btn" onclick="logout()"><span class="nav-icon">↪</span>Sign out</button></div></aside><main class="main"><header class="topbar"><button class="icon-btn menu-btn" id="menuBtn">☰</button><div class="top-context"><div class="top-label">Current view</div><select class="context-select" id="projectContext">${opts}</select></div><div class="top-context period"><div class="top-label">Fiscal year</div><select class="context-select" id="yearContext">${Array.from({length:12},(_,i)=>state.year+3-i).map(y=>`<option ${y===state.year?'selected':''}>${y}</option>`).join('')}</select></div><div class="spacer"></div><button class="icon-btn" id="notifBtn">♢<span id="notifBadge" class="badge hidden">0</span></button><div class="user-chip"><div class="avatar">${esc((state.user.name||'U')[0])}</div><div class="who"><strong style="display:block;font-size:11px">${esc(state.user.name)}</strong><small class="muted">${esc(state.user.role.replaceAll('_',' '))}</small></div></div></header><section class="content" id="content"></section></main></div>`;fillAccountList();document.querySelectorAll('.nav-btn[data-page]').forEach(b=>b.onclick=()=>navigate(b.dataset.page));$('projectContext').value=String(state.currentProject);$('projectContext').onchange=()=>{state.currentProject=$('projectContext').value;state.page='dashboard';renderApp();loadPage()};$('yearContext').onchange=()=>{state.year=Number($('yearContext').value);localStorage.setItem('coop_year',state.year);loadPage()};$('menuBtn').onclick=()=>{$('sidebar').classList.toggle('open');$('overlay').classList.toggle('show')};$('overlay').onclick=()=>{$('sidebar').classList.remove('open');$('overlay').classList.remove('show')};$('notifBtn').onclick=showNotifications;loadPage();refreshBadges()}
function navigate(page){state.page=page;document.querySelectorAll('.nav-btn[data-page]').forEach(x=>x.classList.toggle('active',x.dataset.page===page));$('sidebar')?.classList.remove('open');$('overlay')?.classList.remove('show');loadPage()}
async function loadPage(){const el=$('content');if(!el)return;el.innerHTML='<div class="panel"><div class="empty">Loading workspace…</div></div>';try{if(state.page==='dashboard')await pageDashboard();else if(state.page==='transactions')await pageTransactions();else if(state.page==='operations')await pageOperations();else if(state.page==='financials')await pageFinancials();else if(state.page==='approvals')await pageApprovals();else if(state.page==='audit')await pageAudit();else if(state.page==='users')await pageUsers();else if(state.page==='periods')await pagePeriods();else if(state.page==='backup')await pageBackup();else if(state.page==='settings')await pageSettings()}catch(e){el.innerHTML=`<div class="panel"><div class="notice bad">${esc(e.message)}</div></div>`}}
function head(title,sub,actions=''){return `<div class="page-head"><div><h1>${esc(title)}</h1><p>${esc(sub||'')}</p></div><div class="spacer"></div><div class="actions">${actions}</div></div>`}
function fy(){return {from:`${state.year}-01-01`,to:`${state.year}-12-31`}}
function scopeQuery(extra=''){const {from,to}=fy();if(state.currentProject==='consolidated'){const ids=(state.analyticsSelection.length?state.analyticsSelection:state.projects.map(p=>p.id)).join(',');return `projects=${ids}&consolidated=1&from=${from}&to=${to}${extra}`;}return `projectId=${state.currentProject}&from=${from}&to=${to}${extra}`}
function kpi(label,value,sub=''){return `<div class="kpi"><div class="label">${esc(label)}</div><div class="value money">${value}</div><div class="sub">${esc(sub)}</div></div>`}
async function pageDashboard(){const isCons=state.currentProject==='consolidated';let toggles='';if(isCons){if(!state.analyticsSelection.length)state.analyticsSelection=state.projects.map(p=>p.id);toggles=`<div class="panel" style="margin-bottom:16px"><div class="panel-head"><div><h3>Analytics Project Visibility</h3><p>Show or hide projects from executive comparisons without changing accounting data.</p></div></div><div class="project-toggle-row">${state.projects.map((p,i)=>`<label class="project-toggle"><input type="checkbox" ${state.analyticsSelection.includes(p.id)?'checked':''} onchange="toggleAnalyticsProject(${p.id},this.checked)"><span>${esc(p.code+' '+p.name)}</span></label>`).join('')}</div></div>`}const q=scopeQuery(),[an,rep]=await Promise.all([api('/api/analytics?'+q),api('/api/reports?'+q)]);const scopeName=isCons?'Consolidated Cooperative':currentProjectObj()?.name||'Project';const income=rep.income_statement,bs=rep.balance_sheet,cf=rep.cash_flow;$('content').innerHTML=head(scopeName,`Financial and operational analytics • FY ${state.year}`,`<button class="btn soft" onclick="navigate('financials')">Open Statements</button>${isCons&&roleIs('SUPERADMIN')?'<button class="btn soft" onclick="interprojectModal()">Inter-project Entry</button>':''}${state.currentProject!=='consolidated'?(roleIs('SUPERADMIN')?'<button class="btn primary" onclick="newJournalModal()">+ Accounting Entry</button>':'<button class="btn primary" onclick="navigate(&quot;operations&quot;)">+ Project Transaction</button>'):''}`)+`${state.year<new Date().getFullYear()?`<div class="period-banner">⚠ Historical Accounting View — You are reviewing FY ${state.year}. Encoding dates remain separately auditable.</div>`:''}${toggles}<div class="kpis">${kpi('Total Assets',money(bs.total_assets),rep.reconciled?'Reconciled':'Review required')}${kpi('Liabilities',money(bs.total_liabilities))}${kpi('Equity',money(bs.total_equity))}${kpi('Revenue YTD',money(income.total_revenue))}${kpi('Expenses YTD',money(income.total_expenses))}${kpi('Net Surplus',money(income.net_surplus),`Cash ${money(cf.ending_cash)}`)}</div><div class="grid2"><div class="panel"><div class="panel-head"><div><h3>${isCons?'Project Profitability':'Monthly Financial Performance'}</h3><p>${isCons?'Revenue, expense, and net surplus by selected project':'Revenue and expenses across the fiscal year'}</p></div></div><div class="chart-wrap"><canvas class="chart" id="chartMain"></canvas></div></div><div class="panel"><div class="panel-head"><div><h3>${isCons?'Monthly Revenue by Project':'Cash Movement'}</h3><p>${isCons?'Visible projects only':'Net cash movement by month'}</p></div></div><div class="chart-wrap"><canvas class="chart" id="chartSecondary"></canvas></div></div></div><div class="grid2" style="margin-top:16px"><div class="panel"><div class="panel-head"><div><h3>Financial Position</h3><p>Assets versus liabilities and equity</p></div></div><div class="chart-wrap"><canvas class="chart" id="chartPosition"></canvas></div></div><div class="panel"><div class="panel-head"><div><h3>Operational Intelligence</h3><p>${isCons?'Selected project operating indicators':'Project-specific operating analytics'}</p></div></div><div id="operationalPanel"></div></div></div>`;requestAnimationFrame(()=>renderDashboardCharts(an,rep,isCons));renderOperational(an,isCons)}
function toggleAnalyticsProject(id,on){if(on&&!state.analyticsSelection.includes(id))state.analyticsSelection.push(id);if(!on)state.analyticsSelection=state.analyticsSelection.filter(x=>x!==id);if(!state.analyticsSelection.length){toast('At least one project must remain visible.','error');state.analyticsSelection=[id]}localStorage.setItem('coop_analytics_projects',JSON.stringify(state.analyticsSelection));loadPage()}
function cssVar(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}
const palette=()=>[cssVar('--accent'),'#6366f1','#14b8a6','#f59e0b','#ef4444','#8b5cf6','#22c55e','#64748b'];
function prepCanvas(id){const c=$(id);if(!c)return null;const r=c.getBoundingClientRect(),d=Math.min(2,devicePixelRatio||1);c.width=Math.max(300,r.width*d);c.height=Math.max(180,r.height*d);const x=c.getContext('2d');x.setTransform(d,0,0,d,0,0);return {c,x,w:r.width,h:r.height}}
function animateChart(fn,dur=550){const st=performance.now();function f(t){const p=Math.min(1,(t-st)/dur);fn(1-Math.pow(1-p,3));if(p<1)requestAnimationFrame(f)}requestAnimationFrame(f)}
function grid(ctx,w,h,pad,max,labels){ctx.strokeStyle='#e8edf4';ctx.lineWidth=1;ctx.fillStyle='#94a3b8';ctx.font='10px system-ui';for(let i=0;i<=4;i++){const y=pad.t+(h-pad.t-pad.b)*i/4;ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(w-pad.r,y);ctx.stroke();const v=max*(1-i/4);ctx.fillText(shortNum(v),4,y+3)}if(labels?.length){const step=(w-pad.l-pad.r)/Math.max(1,labels.length-1);labels.forEach((l,i)=>{if(labels.length>8&&i%2) return;ctx.fillText(String(l).slice(5),pad.l+i*step-10,h-7)})}}
function shortNum(v){v=Math.abs(v);return v>=1e6?(v/1e6).toFixed(1)+'M':v>=1e3?(v/1e3).toFixed(0)+'k':v.toFixed(0)}
function lineChart(id,labels,sets){const p=prepCanvas(id);if(!p)return;const {x,w,h}=p,pad={l:46,r:18,t:20,b:30},mx=Math.max(1,...sets.flatMap(s=>s.data.map(v=>Math.abs(Number(v||0)))));animateChart(pr=>{x.clearRect(0,0,w,h);grid(x,w,h,pad,mx,labels);const step=(w-pad.l-pad.r)/Math.max(1,labels.length-1);sets.forEach((s,si)=>{x.strokeStyle=s.color||palette()[si];x.lineWidth=2.5;x.lineJoin='round';x.lineCap='round';x.beginPath();s.data.forEach((v,i)=>{const xx=pad.l+i*step,yy=h-pad.b-(Number(v||0)/mx)*(h-pad.t-pad.b)*pr;i?x.lineTo(xx,yy):x.moveTo(xx,yy)});x.stroke();x.globalAlpha=.08;x.lineTo(pad.l+(labels.length-1)*step,h-pad.b);x.lineTo(pad.l,h-pad.b);x.closePath();x.fillStyle=s.color||palette()[si];x.fill();x.globalAlpha=1});},600)}
function barChart(id,labels,sets){const p=prepCanvas(id);if(!p)return;const {x,w,h}=p,pad={l:46,r:16,t:20,b:42},all=sets.flatMap(s=>s.data.map(Number)),mx=Math.max(1,...all.map(Math.abs)),group=(w-pad.l-pad.r)/Math.max(1,labels.length),bw=Math.max(4,Math.min(24,(group*.72)/sets.length));animateChart(pr=>{x.clearRect(0,0,w,h);grid(x,w,h,pad,mx,[]);labels.forEach((l,i)=>{x.fillStyle='#64748b';x.font='10px system-ui';x.save();x.translate(pad.l+i*group+group/2,h-8);if(labels.length>6)x.rotate(-.35);x.textAlign='center';x.fillText(String(l).slice(0,15),0,0);x.restore();sets.forEach((s,j)=>{const v=Number(s.data[i]||0),bh=(Math.abs(v)/mx)*(h-pad.t-pad.b)*pr,xx=pad.l+i*group+group/2-(sets.length*bw)/2+j*bw,yy=h-pad.b-bh;x.fillStyle=s.color||palette()[j];roundRect(x,xx,yy,bw-2,bh,4);x.fill()})})},600)}
function roundRect(c,x,y,w,h,r){if(h<0){y+=h;h=-h}r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function donutChart(id,labels,values){const p=prepCanvas(id);if(!p)return;const {x,w,h}=p,total=Math.max(.0001,values.reduce((a,b)=>a+Math.abs(Number(b||0)),0)),cx=w*.42,cy=h*.5,r=Math.min(w,h)*.3,cols=palette();animateChart(pr=>{x.clearRect(0,0,w,h);let a=-Math.PI/2;values.forEach((v,i)=>{const d=Math.PI*2*(Math.abs(v)/total)*pr;x.strokeStyle=cols[i%cols.length];x.lineWidth=22;x.beginPath();x.arc(cx,cy,r,a,a+d);x.stroke();a+=d});x.fillStyle='#0f172a';x.font='800 19px system-ui';x.textAlign='center';x.fillText(shortNum(total),cx,cy+5);x.textAlign='left';x.font='11px system-ui';labels.forEach((l,i)=>{const yy=28+i*20;x.fillStyle=cols[i%cols.length];x.fillRect(w*.72,yy-8,9,9);x.fillStyle='#475569';x.fillText(String(l).slice(0,20),w*.72+15,yy)})},550)}
function renderDashboardCharts(an,rep,isCons){const cols=palette();if(isCons){barChart('chartMain',an.projects.map(p=>p.code),[{data:an.projects.map(p=>p.revenue),color:cols[0]},{data:an.projects.map(p=>p.expenses),color:cols[3]},{data:an.projects.map(p=>p.net),color:cols[2]}]);lineChart('chartSecondary',an.months,an.projects.map((p,i)=>({data:an.months.map(m=>an.series[p.id]?.revenue?.[m]||0),color:cols[i%cols.length]})))}else{const pid=Number(state.currentProject),s=an.series[pid]||{revenue:{},expenses:{},cash:{}};lineChart('chartMain',an.months,[{data:an.months.map(m=>s.revenue[m]||0),color:cols[0]},{data:an.months.map(m=>s.expenses[m]||0),color:cols[3]}]);barChart('chartSecondary',an.months,[{data:an.months.map(m=>s.cash[m]||0),color:cols[2]}])}donutChart('chartPosition',['Assets','Liabilities','Equity'],[rep.balance_sheet.total_assets,rep.balance_sheet.total_liabilities,rep.balance_sheet.total_equity])}
function renderOperational(an,isCons){const el=$('operationalPanel');if(!el)return;if(isCons){const rows=an.projects.map(p=>`<tr><td><strong>${esc(p.code)}</strong><br><span class="muted">${esc(p.name)}</span></td><td class="money">${money(p.revenue)}</td><td class="money">${money(p.expenses)}</td><td class="money"><strong>${money(p.net)}</strong></td><td><span class="status ${p.reconciled?'reconciled':'pending'}">${p.reconciled?'Reconciled':'Review'}</span></td></tr>`).join('');el.innerHTML=`<div class="table-wrap"><table class="table"><thead><tr><th>Project</th><th>Revenue</th><th>Expenses</th><th>Net</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table></div>`;return}const pid=Number(state.currentProject),o=an.operational[pid];if(!o){el.innerHTML='<div class="empty">No operational analytics yet.</div>';return}if(o.kind==='LOAN'){el.innerHTML=`<div class="grid3"><div class="kpi"><div class="label">Outstanding</div><div class="value">${money(o.outstanding)}</div></div><div class="kpi"><div class="label">Active Loans</div><div class="value">${o.active}</div></div><div class="kpi"><div class="label">Fully Paid</div><div class="value">${o.fully_paid}</div></div></div><div class="chart-wrap" style="height:180px;margin-top:12px"><canvas class="chart" id="opChart"></canvas></div>`;requestAnimationFrame(()=>barChart('opChart',['Active','Fully Paid'],[{data:[o.active,o.fully_paid]}]))}else if(o.kind==='PALAY'){el.innerHTML=`<div class="grid3"><div class="kpi"><div class="label">Walk-in Sales</div><div class="value">${money(o.walkin_sales||0)}</div></div><div class="kpi"><div class="label">Consignment Sales</div><div class="value">${money(o.consignment_sales||0)}</div></div><div class="kpi"><div class="label">With Stores</div><div class="value">${numFmt(o.consigned_qty||0)} kg</div><div class="sub">${o.open_consignments||0} open dispatches</div></div></div><div class="chart-wrap" style="height:190px;margin-top:12px"><canvas class="chart" id="opChart"></canvas></div>`;requestAnimationFrame(()=>barChart('opChart',o.inventory.map(x=>x.code),[{data:o.inventory.map(x=>x.qty)}]))}else if(o.kind==='FARM_SERVICE'){el.innerHTML=`<div class="chart-wrap" style="height:250px"><canvas class="chart" id="opChart"></canvas></div><div class="legend"><span><i style="background:${palette()[0]}"></i>Revenue</span><span><i style="background:${palette()[3]}"></i>Direct Cost</span></div>`;requestAnimationFrame(()=>barChart('opChart',o.services.map(x=>x.name),[{data:o.services.map(x=>x.revenue),color:palette()[0]},{data:o.services.map(x=>x.cost),color:palette()[3]}]))}else if(o.kind==='RENTAL'){el.innerHTML=`<div class="grid3"><div class="kpi"><div class="label">Occupancy</div><div class="value">${o.occupancy_pct.toFixed(1)}%</div></div><div class="kpi"><div class="label">Rent / Utilities</div><div class="value">${money(o.rent_billed||0)}</div><div class="sub">Water ${money(o.water_billed||0)} • Power ${money(o.electricity_billed||0)}</div></div><div class="kpi"><div class="label">Receivable</div><div class="value">${money(o.receivable)}</div><div class="sub">SMS sent ${o.sms?.sent||0} • pending ${o.sms?.pending||0}</div></div></div><div class="chart-wrap" style="height:180px;margin-top:12px"><canvas class="chart" id="opChart"></canvas></div>`;requestAnimationFrame(()=>barChart('opChart',['Rent','Water','Electricity','Collected'],[{data:[o.rent_billed||0,o.water_billed||0,o.electricity_billed||0,o.collected||0]}]))}else{el.innerHTML=`<div class="grid3"><div class="kpi"><div class="label">Income</div><div class="value">${money(o.income)}</div></div><div class="kpi"><div class="label">Expense</div><div class="value">${money(o.expense)}</div></div><div class="kpi"><div class="label">Net</div><div class="value">${money(o.net)}</div></div></div><div class="chart-wrap" style="height:180px;margin-top:12px"><canvas class="chart" id="opChart"></canvas></div>`;requestAnimationFrame(()=>barChart('opChart',['Income','Expense','Net'],[{data:[o.income,o.expense,o.net]}]))}}
function interprojectModal(){modal('Inter-project Accounting Entry',`<div class="notice info">Use this only when one cooperative project charges another project internally. Both project entries are created as a linked pair and eliminated from consolidated revenue/expense.</div><div class="form-grid"><div class="field"><label>Paying / Expense Project</label><select class="select" id="ipFrom">${state.projects.map(p=>`<option value="${p.id}">${esc(p.code+' • '+p.name)}</option>`).join('')}</select></div><div class="field"><label>Receiving / Revenue Project</label><select class="select" id="ipTo">${state.projects.map(p=>`<option value="${p.id}">${esc(p.code+' • '+p.name)}</option>`).join('')}</select></div><div class="field"><label>Date</label><input class="input" id="ipDate" type="date" value="${today()}"></div><div class="field"><label>Amount</label><input class="input" id="ipAmt" type="number" min="0" step="0.01"></div><div class="field span2"><label>Description</label><input class="input" id="ipDesc" placeholder="Internal service or transfer description"></div></div>`,`<button class="btn soft" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveInterproject()">Post Linked Entries</button>`)}
async function saveInterproject(){try{const fromProjectId=Number($('ipFrom').value),toProjectId=Number($('ipTo').value);if(fromProjectId===toProjectId)throw new Error('Choose two different projects.');await api('/api/interproject',{method:'POST',body:JSON.stringify({fromProjectId,toProjectId,date:$('ipDate').value,amount:Number($('ipAmt').value),description:$('ipDesc').value})});closeModal();toast('Linked inter-project entries posted and marked for consolidation elimination.');loadPage()}catch(e){toast(e.message,'error')}}

async function pageTransactions(){const p=currentProjectObj();if(!p)return navigate('dashboard');const {from,to}=fy(),r=await api(`/api/transactions?projectId=${p.id}&from=${from}&to=${to}&limit=1000`),settle=`<button class="btn soft" onclick="projectSettlementModal('AR')">Collect Receivable</button><button class="btn soft" onclick="projectSettlementModal('AP')">Pay Payable</button>`,actions=roleIs('SUPERADMIN')?`${settle}<button class="btn soft" onclick="cashModal('receipt')">+ Classified Cash Receipt</button><button class="btn soft" onclick="cashModal('disbursement')">+ Classified Disbursement</button><button class="btn primary" onclick="newJournalModal()">+ Journal Entry</button>`:`${settle}<button class="btn primary" onclick="navigate('operations')">+ Project Transaction</button>`;$('content').innerHTML=head('Transactions',`${p.name} • FY ${state.year}`,actions)+`<div class="guide"><strong>Project Manager-safe credit settlement:</strong> use <b>Collect Receivable</b> for ordinary project AR and <b>Pay Payable</b> for ordinary project AP. The system checks the actual ledger balance and blocks overcollection/overpayment. P02 consignment Store AR and P04 tenant collection keep their dedicated buttons.</div><div class="panel"><div class="toolbar"><input class="input" id="txSearch" placeholder="Search ref or description…"><input class="input" type="date" id="txFrom" value="${from}"><input class="input" type="date" id="txTo" value="${to}"><button class="btn soft sm" onclick="reloadTransactions()">Apply</button></div><div id="txTable">${txTable(r.transactions)}</div></div>`}
function txTable(rows){if(!rows.length)return '<div class="empty"><strong>No transactions in this period.</strong>Use New Entry or change the fiscal year.</div>';return `<div class="table-wrap"><table class="table"><thead><tr><th>Date</th><th>Reference</th><th>Source</th><th>Description</th><th>Amount</th><th>Encoded by</th><th>Status</th></tr></thead><tbody>${rows.map(x=>`<tr onclick="showTransaction(${x.id})" style="cursor:pointer"><td class="nowrap">${dmy(x.tx_date)}</td><td class="mono"><strong>${esc(x.ref)}</strong></td><td>${esc(x.source_type.replaceAll('_',' '))}</td><td>${esc(x.description)}</td><td class="money">${money(x.total)}</td><td>${esc(x.created_by_name)}</td><td><span class="status posted">Posted</span>${x.reversal_of?'<br><span class="muted">Reversal</span>':''}</td></tr>`).join('')}</tbody></table></div>`}
async function reloadTransactions(){const q=$('txSearch').value,from=$('txFrom').value,to=$('txTo').value,p=currentPid(),r=await api(`/api/transactions?projectId=${p}&from=${from}&to=${to}&q=${encodeURIComponent(q)}&limit=1000`);$('txTable').innerHTML=txTable(r.transactions)}
async function showTransaction(id){try{const e=await api('/api/transactions/'+id);$('drawerRoot').innerHTML=`<aside class="drawer"><div class="drawer-head"><button class="icon-btn" onclick="closeDrawer()">×</button><div><strong>${esc(e.ref)}</strong><div class="muted" style="font-size:11px">${esc(e.source_type.replaceAll('_',' '))}</div></div><div class="spacer"></div><span class="status posted">Posted</span></div><div class="drawer-body"><dl class="detail-list"><dt>Project</dt><dd>${esc(e.project_code+' • '+e.project_name)}</dd><dt>Accounting date</dt><dd>${dmy(e.tx_date)}</dd><dt>Encoded at</dt><dd>${new Date(e.encoded_at).toLocaleString()}</dd><dt>Description</dt><dd>${esc(e.description)}</dd><dt>Created by</dt><dd>${esc(e.created_by_name)}</dd></dl><h4>Journal Distribution</h4><div class="table-wrap"><table class="table"><thead><tr><th>Account</th><th>Debit</th><th>Credit</th></tr></thead><tbody>${e.lines.map(l=>`<tr><td>${esc(l.account_code+' • '+l.account_name)}</td><td class="money">${l.debit?money(l.debit):''}</td><td class="money">${l.credit?money(l.credit):''}</td></tr>`).join('')}</tbody></table></div>${!e.reversal_of?`<div style="margin-top:18px"><button class="btn danger" onclick="requestVoid(${e.id},'${esc(e.ref)}')">Request Void / Reversal</button>${e.source_type==='JOURNAL'?` <button class="btn soft" onclick="requestCorrection(${e.id})">Request Correction</button>`:''}</div>`:''}</div></aside>`}catch(e){toast(e.message,'error')}}
function closeDrawer(){$('drawerRoot').innerHTML=''}
function modal(title,body,footer='',lg=false){$('modalRoot').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal ${lg?'lg':''}"><div class="modal-head"><h3>${esc(title)}</h3><div class="spacer"></div><button class="icon-btn" onclick="closeModal()">×</button></div><div class="modal-body">${body}</div>${footer?`<div class="modal-foot">${footer}</div>`:''}</div></div>`}
function closeModal(){$('modalRoot').innerHTML=''}
function accountInput(id,val=''){return `<input class="input acct" id="${id}" list="accountList" value="${esc(val)}" placeholder="Search account code or name…">`}
function accountCode(v){return String(v||'').split('•')[0].trim()}
function accountObj(code){return state.accounts.find(a=>a.code===accountCode(code))||null}
function inferClientCF(lines){const xs=(lines||[]).map(l=>({...l,a:accountObj(l.account_code)}));const cash=xs.filter(x=>x.a&&(x.a.subtype==='CASH'||x.a.subtype==='BANK'||['1000','1010'].includes(x.a.code)));if(!cash.length)return 'NONE';const other=xs.filter(x=>!cash.includes(x));if(other.some(x=>x.a&&(x.a.subtype==='PPE'||x.a.subtype==='ACCUM_DEPR'||String(x.a.name||'').toLowerCase().includes('property')||String(x.a.name||'').toLowerCase().includes('equipment'))))return 'INVESTING';if(other.some(x=>x.a&&(x.a.type==='EQUITY'||x.a.subtype==='LOAN_PAYABLE'||String(x.a.name||'').toLowerCase().includes('loan payable'))))return 'FINANCING';return 'OPERATING'}
function autoCFInput(id,value='OPERATING'){return `<input class="input auto-field" id="${id}" value="${esc(value)}" disabled><div class="auto-note">Automatic based on the transaction/accounting effect. Dili na kinahanglan pilion.</div>`}
function p02UnitLabel(u){return ({KG:'kg',SACK:'sack',HALF_SACK:'1/2 sack',QUARTER_SACK:'1/4 sack','10KG_PACK':'10 kg pack','5KG_PACK':'5 kg pack'})[String(u||'KG').toUpperCase()]||'kg'}
function p02UnitFactor(u,sackKg=null){const sk=Number(sackKg||window.p02Settings?.sack_kg||50),x=String(u||'KG').toUpperCase();if(x==='SACK')return sk;if(x==='HALF_SACK')return sk/2;if(x==='QUARTER_SACK')return sk/4;if(x==='10KG_PACK')return 10;if(x==='5KG_PACK')return 5;return 1}
function p02UnitOptions(selected='KG'){const a=[['KG','kg'],['SACK','1 sack'],['HALF_SACK','1/2 sack'],['QUARTER_SACK','1/4 sack'],['10KG_PACK','10 kg pack'],['5KG_PACK','5 kg pack']];return a.map(([v,l])=>`<option value="${v}" ${String(selected).toUpperCase()===v?'selected':''}>${l}</option>`).join('')}
function p02SackEquivalent(qtyKg){const sk=Number(window.p02Settings?.sack_kg||50);return sk>0?`${numFmt(Number(qtyKg||0)/sk)} sack equivalent @ ${numFmt(sk)} kg/sack`:''}
function guide(text){return `<div class="guide"><strong>Pananglitan / Giya:</strong> ${text}</div>`}
function batchInv(b,code){return (b?.inventory||[]).find(x=>x.code===code)||{qty:0,cost:0,unit_cost:0,unit:'kg'}}
function journalRow(i,line={}){const acc=line.account_code?`${line.account_code} • ${state.accounts.find(a=>a.code===line.account_code)?.name||''}`:'';return `<div class="journal-row" data-row="${i}">${accountInput('ja'+i,acc)}<input class="input" id="jd${i}" type="number" step="0.01" min="0" value="${line.debit||''}" placeholder="Debit"><input class="input" id="jc${i}" type="number" step="0.01" min="0" value="${line.credit||''}" placeholder="Credit"><button class="icon-btn" onclick="this.closest('.journal-row').remove();calcJournal()">×</button></div>`}
function newJournalModal(prefill=null){if(!prefill&&!roleIs('SUPERADMIN')){toast('Project transactions should be encoded from Project Operations to reduce manual accounting errors.','error');return navigate('operations')}let seq=2;modal(prefill?'Proposed Corrected Journal':'New Journal Entry',`<div class="form-grid"><div class="field"><label>Project</label><input class="input auto-field" value="${esc(currentProjectObj().code+' • '+currentProjectObj().name)}" disabled></div><div class="field"><label>Accounting Date</label><input class="input" id="jDate" type="date" value="${prefill?.date||today()}"></div><div class="field span2"><label>Description / Particulars</label><input class="input" id="jDesc" value="${esc(prefill?.description||'')}" placeholder="Unsa ang nahitabo sa transaksyon?"></div><div class="field"><label>Cash Flow Classification — Automatic</label>${autoCFInput('jCF','NONE')}</div></div>${guide('Kung mopalit og equipment nga cash: Debit Property & Equipment, Credit Cash. Ang sistema mismo mo-classify niini isip INVESTING. Kung ordinaryong gasto/kita nga cash, OPERATING.') }<div style="margin-top:20px"><div class="panel-head"><div><h3>Account Distribution</h3><p>Pilia lang ang accounts ug amount; automatic ang Cash Flow type.</p></div><div class="spacer"></div><button class="btn soft sm" id="addJRow">+ Line</button></div><div class="journal-lines" id="jRows">${(prefill?.lines||[{},{ }]).map((l,i)=>journalRow(i+1,l)).join('')}</div><div class="journal-total"><span>Debit <b id="jDebit">₱0.00</b></span><span>Credit <b id="jCredit">₱0.00</b></span><span>Difference <b id="jDiff">₱0.00</b></span></div></div>`,`<button class="btn soft" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="postJournal()">Post Journal Entry</button>`,true);$('addJRow').onclick=()=>{$('jRows').insertAdjacentHTML('beforeend',journalRow(++seq));bindJournalCalc()};bindJournalCalc();if(state.year<new Date().getFullYear())toast('Historical accounting date is enabled and will remain separately auditable.','success')}
function bindJournalCalc(){document.querySelectorAll('#jRows input').forEach(x=>{x.oninput=calcJournal;x.onchange=calcJournal});calcJournal()}
function calcJournal(){let d=0,c=0,lines=[];document.querySelectorAll('.journal-row').forEach(r=>{const i=r.dataset.row,account_code=accountCode($('ja'+i)?.value),debit=Number($('jd'+i)?.value||0),credit=Number($('jc'+i)?.value||0);d+=debit;c+=credit;if(account_code&&(debit||credit))lines.push({account_code,debit,credit})});if($('jDebit')){$('jDebit').textContent=money(d);$('jCredit').textContent=money(c);$('jDiff').textContent=money(d-c);$('jDiff').className=Math.abs(d-c)<.005?'good':'bad'}if($('jCF'))$('jCF').value=inferClientCF(lines)}
async function postJournal(){try{const lines=[];document.querySelectorAll('.journal-row').forEach(r=>{const i=r.dataset.row,code=accountCode($('ja'+i)?.value),debit=Number($('jd'+i)?.value||0),credit=Number($('jc'+i)?.value||0);if(code&&(debit||credit))lines.push({account_code:code,debit,credit})});await api('/api/journal',{method:'POST',body:JSON.stringify({projectId:currentPid(),date:$('jDate').value,description:$('jDesc').value,lines})});closeModal();toast('Journal entry posted. Cash Flow classification was assigned automatically.');loadPage()}catch(e){toast(e.message,'error')}}
function cashModal(kind){if(!roleIs('SUPERADMIN')){toast('Use Project Operations. Generic cash posting is restricted to Super Admin.','error');return navigate('operations')}const receipt=kind==='receipt',def=receipt?'4080 • Other Operating Income':'6060 • Other Operating Expense';modal(receipt?'Cash Receipt':'Cash Disbursement',`<div class="form-grid"><div class="field"><label>Accounting Date</label><input class="input" id="cashDate" type="date" value="${today()}"></div><div class="field"><label>Amount</label><input class="input big-input" id="cashAmt" type="number" min="0" step="0.01" placeholder="0.00"></div><div class="field span2"><label>Description</label><input class="input" id="cashDesc" placeholder="Mubo nga detalye sa transaksyon"></div><div class="field span2"><label>${receipt?'Asa gikan ang kita / Credit Account':'Unsa nga gasto / Debit Account'}</label>${accountInput('cashAcct',def)}</div><div class="field"><label>Cash Flow Type — Automatic</label>${autoCFInput('cashCF','OPERATING')}</div></div>${guide(receipt?'Pananglitan: nadawat ₱5,000 nga agricultural/other income. Ibutang ang amount, mubo nga description, ug pili-a ang sakto nga income account.':'Pananglitan: gibayran ₱3,500 diesel. Ibutang ang amount ug pili-a “Fuel and Lubricants.” Automatic na ang Cash Flow classification.')}`,`<button class="btn soft" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveCash('${kind}')">Post</button>`);const a=$('cashAcct');const upd=()=>{if($('cashCF'))$('cashCF').value=inferClientCF([{account_code:'1000',debit:receipt?1:0,credit:receipt?0:1},{account_code:accountCode(a.value),debit:receipt?0:1,credit:receipt?1:0}])};a.oninput=upd;a.onchange=upd;upd()}
async function saveCash(kind){try{const receipt=kind==='receipt',body={projectId:currentPid(),date:$('cashDate').value,amount:Number($('cashAmt').value),description:$('cashDesc').value};body[receipt?'credit_account_code':'debit_account_code']=accountCode($('cashAcct').value);await api('/api/cash/'+kind,{method:'POST',body:JSON.stringify(body)});closeModal();toast('Cash transaction posted with automatic Cash Flow classification.');loadPage()}catch(e){toast(e.message,'error')}}
async function projectSettlementModal(kind){const isAR=kind==='AR',label=isAR?'Collect Project Receivable':'Pay Project Payable';modal(label,`<div class="notice info">${isAR?'Use this for ordinary project credit sales/services (Accounts Receivable 1100). For P02 consignment Store AR, use the Consignment Collect AR button.':'Use this for ordinary supplier/project Accounts Payable 2000.'}</div><div class="form-grid"><div class="field"><label>Accounting Date</label><input class="input" id="settleDate" type="date" value="${today()}" onchange="refreshSettlementBalance('${kind}')"></div><div class="field"><label>${isAR?'Receivable':'Payable'} Balance — Automatic</label><input class="input auto-field big-input" id="settleBal" value="Loading…" disabled></div><div class="field"><label>${isAR?'Amount Collected':'Amount Paid'}</label><input class="input big-input" id="settleAmt" type="number" min="0.01" step="0.01" placeholder="0.00"></div><div class="field"><label>Cash Flow — Automatic</label>${autoCFInput('settleCF','OPERATING')}</div><div class="field span2"><label>Description</label><input class="input" id="settleDesc" value="${isAR?'Project receivable collection':'Supplier / project payable payment'}"></div></div>${guide(isAR?'Pananglitan: naa pay ₱2,100 ordinary customer AR. I-click Collect Receivable, review automatic balance, then enter actual amount received. Dr Cash / Cr Accounts Receivable; no new revenue.':'Pananglitan: naa pay ₱2,100 supplier AP. I-click Pay Payable, review automatic balance, then enter actual amount paid. Dr Accounts Payable / Cr Cash; no new expense.')}`,`<button class="btn soft" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveProjectSettlement('${kind}')">${isAR?'Record Collection':'Record Payment'}</button>`);refreshSettlementBalance(kind)}
async function refreshSettlementBalance(kind){try{const date=$('settleDate')?.value||today(),r=await api(`/api/reports?projectId=${currentPid()}&from=1900-01-01&to=${date}`),isAR=kind==='AR',rows=isAR?r.balance_sheet.assets:r.balance_sheet.liabilities,code=isAR?'1100':'2000',bal=Math.max(0,Number(rows.find(x=>x.code===code)?.amount||0));if($('settleBal'))$('settleBal').value=money(bal);if($('settleAmt')&&!Number($('settleAmt').value))$('settleAmt').value=bal?bal.toFixed(2):'';window.projectSettlementBalance=bal}catch(e){if($('settleBal'))$('settleBal').value='Unable to load';toast(e.message,'error')}}

function reportHeader(scope,title,period){const b=state.branding||{},logo=b.report_logo_path||b.logo_path;return `<div class="report-brand">${logo?`<img src="${state.api}${esc(logo)}">`:''}<h2>${esc(b.coop_name||'Cooperative')}</h2>${b.address?`<p>${esc(b.address)}</p>`:''}${b.registration_no?`<p>CDA Registration: ${esc(b.registration_no)} ${b.tin?' • TIN: '+esc(b.tin):''}</p>`:''}<h3>${esc(scope)}</h3><h3>${esc(title)}</h3><p>${esc(period)}</p></div>`}
function reportHtml(type,r,scope){let rows='';if(type==='income-statement'){rows+=sectionRow('REVENUE');for(const x of r.income_statement.revenue)rows+=acctRow(x.code,x.name,x.amount);rows+=totalRow('TOTAL REVENUE',r.income_statement.total_revenue)+sectionRow('OPERATING EXPENSES');for(const x of r.income_statement.expenses)rows+=acctRow(x.code,x.name,x.amount);rows+=totalRow('TOTAL EXPENSES',r.income_statement.total_expenses)+totalRow('NET SURPLUS / (DEFICIT)',r.income_statement.net_surplus);return reportHeader(scope,'STATEMENT OF OPERATIONS / INCOME STATEMENT',`For the period ${dmy(r.from)} to ${dmy(r.to)}`)+`<table class="statement">${rows}</table>`+reportFoot(r)}if(type==='balance-sheet'){rows+=sectionRow('ASSETS');for(const x of r.balance_sheet.assets)rows+=acctRow(x.code,x.name,x.amount);rows+=totalRow('TOTAL ASSETS',r.balance_sheet.total_assets)+sectionRow('LIABILITIES');for(const x of r.balance_sheet.liabilities)rows+=acctRow(x.code,x.name,x.amount);rows+=totalRow('TOTAL LIABILITIES',r.balance_sheet.total_liabilities)+sectionRow('EQUITY');for(const x of r.balance_sheet.equity)rows+=x.code==='CURRENT'?`<tr><td>${esc(x.name)}</td><td>${money(x.amount)}</td></tr>`:acctRow(x.code,x.name,x.amount);rows+=totalRow('TOTAL EQUITY',r.balance_sheet.total_equity)+totalRow('BALANCE CHECK',r.balance_sheet.balance_check);return reportHeader(scope,'STATEMENT OF FINANCIAL POSITION / BALANCE SHEET',`As of ${dmy(r.to)}`)+`<table class="statement">${rows}</table>`+reportFoot(r)}if(type==='trial-balance'){rows=`<tr class="section"><td>ACCOUNT</td><td style="text-align:right">DEBIT</td><td style="text-align:right">CREDIT</td></tr>`+r.trial_balance.rows.map(x=>`<tr class="acct-click" onclick="ledgerDrill('${esc(x.code)}')"><td><span class="mono">${esc(x.code)}</span> • ${esc(x.name)}</td><td>${x.debit?money(x.debit):''}</td><td>${x.credit?money(x.credit):''}</td></tr>`).join('')+`<tr class="total"><td>TOTAL</td><td>${money(r.trial_balance.total_debit)}</td><td>${money(r.trial_balance.total_credit)}</td></tr><tr class="total"><td>DIFFERENCE</td><td colspan="2">${money(r.trial_balance.difference)}</td></tr>`;return reportHeader(scope,'TRIAL BALANCE',`For the period ${dmy(r.from)} to ${dmy(r.to)}`)+`<table class="statement">${rows}</table>`+reportFoot(r)}const cf=r.cash_flow;rows=`<tr><td>Beginning Cash</td><td>${money(cf.beginning_cash)}</td></tr>`;for(const [k,label] of [['operating','OPERATING ACTIVITIES'],['investing','INVESTING ACTIVITIES'],['financing','FINANCING ACTIVITIES']]){rows+=sectionRow(label);for(const x of cf[k].inflows)rows+=`<tr onclick="showTransaction(${x.id})" style="cursor:pointer"><td><span class="muted">${dmy(x.date)} • ${esc(x.ref)} • ${esc(x.project_code)}</span><br>${esc(x.description)}</td><td>${money(x.inflow)}</td></tr>`;for(const x of cf[k].outflows)rows+=`<tr onclick="showTransaction(${x.id})" style="cursor:pointer"><td><span class="muted">${dmy(x.date)} • ${esc(x.ref)} • ${esc(x.project_code)}</span><br>${esc(x.description)}</td><td>(${money(x.outflow)})</td></tr>`;rows+=totalRow(`Net ${label.replace(' ACTIVITIES','').toLowerCase()} cash flow`,cf[k].net)}rows+=totalRow('NET CHANGE IN CASH',cf.net_change)+`<tr><td>Ending Cash</td><td>${money(cf.ending_cash)}</td></tr><tr><td>Cash Ledger Balance</td><td>${money(cf.ledger_ending_cash)}</td></tr>`+totalRow('RECONCILIATION DIFFERENCE',cf.reconciliation);return reportHeader(scope,'STATEMENT OF CASH FLOWS',`For the period ${dmy(r.from)} to ${dmy(r.to)}`)+`<table class="statement">${rows}</table>`+reportFoot(r)}
function sectionRow(s){return `<tr class="section"><td colspan="2">${esc(s)}</td></tr>`}function acctRow(code,name,amount){return `<tr class="acct-click" onclick="ledgerDrill('${esc(code)}')" style="cursor:pointer"><td><span class="mono muted">${esc(code)}</span> &nbsp;${esc(name)}</td><td>${money(amount)}</td></tr>`}function totalRow(name,amount){return `<tr class="total"><td>${esc(name)}</td><td>${money(amount)}</td></tr>`}function reportFoot(r){return `<div class="report-footer"><span>${esc(state.branding?.report_footer||'Generated by CoopLedger')}</span><span>Status: <strong>${r.reconciled?'RECONCILED':'REQUIRES REVIEW'}</strong> • Generated ${new Date().toLocaleString()}</span></div>`}

async function pageBackup(){const [cfg,h,rb]=await Promise.all([api('/api/admin/google-drive'),api('/api/admin/backups'),api('/api/admin/restore/backups')]);window.googleDriveCfg=cfg;window.restoreBackups=rb;const status=cfg.connected?`<span class="status reconciled">CONNECTED</span> <strong>${esc(cfg.connected_email||'Personal Google Account')}</strong>`:`<span class="status pending">NOT CONNECTED</span>`;const localRows=(rb.local||[]).map(x=>`<tr><td>${new Date(x.created_at).toLocaleString()}</td><td>${esc(x.kind)}</td><td>${esc(x.file_name||'—')}</td><td>${x.file_size?numFmt(x.file_size/1024/1024)+' MB':'—'}</td><td><button class="btn soft sm" onclick="restoreInspect('LOCAL',${x.id},'', '${encodeURIComponent(x.file_name||'')}')">Inspect / Restore</button></td></tr>`).join('')||'<tr><td colspan="5"><div class="empty">No verified local backup yet.</div></td></tr>';const driveRows=(rb.drive||[]).map(x=>`<tr><td>${x.createdTime?new Date(x.createdTime).toLocaleString():'—'}</td><td>${esc(x.name||'—')}</td><td>${x.size?numFmt(Number(x.size)/1024/1024)+' MB':'—'}</td><td class="mono">${esc(String(x.id||'').slice(0,18))}${x.id?'…':''}</td><td><button class="btn soft sm" onclick="restoreInspect('DRIVE','', '${encodeURIComponent(x.id||'')}', '${encodeURIComponent(x.name||'')}')">Inspect / Restore</button></td></tr>`).join('')||`<tr><td colspan="5"><div class="empty">${cfg.connected?'No CoopLedger backup files found in the connected Drive folder.':'Connect Personal Google Drive first to browse Drive backups.'}</div></td></tr>`;const restoreRows=(rb.restores||[]).map(x=>`<tr><td>${x.requested_at?new Date(x.requested_at).toLocaleString():'—'}</td><td>${esc(x.source||'—')}</td><td>${esc(x.backup_name||'—')}</td><td>${esc(x.components_json||'—')}</td><td><span class="status ${x.status==='COMPLETED'?'reconciled':x.status==='FAILED'?'closed':'pending'}">${esc(x.status||'—')}</span></td><td>${esc(x.safety_backup_name||'—')}</td></tr>`).join('')||'<tr><td colspan="6"><div class="empty">No rollback history yet.</div></td></tr>';$('content').innerHTML=head('Backup, Google Drive & Rollback','Verified snapshots + Super Admin selective restore from Local or Personal Google Drive',`<button class="btn primary" onclick="backupNow()">Backup Now</button>`)+`<div class="notice bad"><strong>Restore / Rollback is a high-impact Super Admin action.</strong> The system validates the ZIP, manifest, SHA-256 and SQLite integrity, then automatically creates a fresh <b>PRE_RESTORE_SAFETY</b> backup before applying anything. After rollback, all sessions are invalidated and users must sign in again.</div><div class="grid2"><div class="panel"><div class="panel-head"><div><h3>Google Drive OAuth 2.0</h3><p>OAuth Client credentials stay only on this backend PC, never in GitHub or backup ZIPs.</p></div></div><div class="oauth-status">${status}</div><div class="guide"><strong>Setup once:</strong> Google Cloud → Enable Google Drive API → OAuth Client “Web application” → Authorized Redirect URI exactly: <span class="mono">${esc(cfg.redirect_uri||'https://coop.mdmsportal.uk/api/google-drive/oauth/callback')}</span>. Save Client ID/Secret here, then Connect Personal Google Drive.</div><div class="form-grid"><div class="field span2"><label>OAuth Client ID</label><input class="input mono" id="gdClientId" value="${esc(cfg.client_id||'')}" placeholder="xxxx.apps.googleusercontent.com"></div><div class="field span2"><label>OAuth Client Secret ${cfg.oauth_configured?'(configured — blank keeps current)':''}</label><input class="input" type="password" id="gdClientSecret" placeholder="${cfg.oauth_configured?'Leave blank to keep saved secret':'Enter client secret'}"></div><div class="field span2"><label>Authorized Redirect URI — fixed</label><input class="input auto-field mono" id="gdRedirect" value="${esc(cfg.redirect_uri||'https://coop.mdmsportal.uk/api/google-drive/oauth/callback')}" readonly></div><div class="field"><label>Scheduled Backup</label><select class="select" id="gdScheduleEnabled"><option value="1" ${cfg.schedule_enabled!==false?'selected':''}>Enabled</option><option value="0" ${cfg.schedule_enabled===false?'selected':''}>Disabled</option></select></div><div class="field"><label>Daily Time</label><input class="input" id="gdTime" type="time" value="${esc(cfg.schedule_time||'02:00')}"></div><div class="field span2"><label>Drive Folder</label><input class="input auto-field" id="gdFolder" value="${esc(cfg.folder_id||'Not created yet')}" readonly></div></div><div class="quick-actions" style="margin-top:14px"><button class="btn soft" onclick="saveDriveSettings()">Save OAuth Settings</button>${cfg.connected?`<button class="btn good" onclick="createDriveFolder()">Use / Create COOPLEDGER BACKUPS</button><button class="btn danger" onclick="disconnectGoogleDrive()">Disconnect</button>`:`<button class="btn primary" onclick="connectGoogleDrive()">Connect Personal Google Drive</button>`}</div></div><div class="panel"><div class="panel-head"><div><h3>Backup Status</h3><p>Database + uploaded logos/files are packaged and hash-verified.</p></div></div>${h.backups[0]?`<div class="kpi"><div class="label">Latest Backup</div><div class="value" style="font-size:18px">${esc(h.backups[0].status)}</div><div class="sub">${new Date(h.backups[0].created_at).toLocaleString()} • ${h.backups[0].file_name?esc(h.backups[0].file_name):''}</div></div>`:'<div class="empty">No backups created yet.</div>'}<div class="guide" style="margin-top:14px"><strong>Selective rollback:</strong> You may restore <b>Database & Accounting Data</b>, <b>Uploaded Files</b>, or <b>both</b>. Full restore is recommended when rolling the whole system back to an earlier point. OAuth/SMSGate credentials are intentionally not inside backups, so they stay on this backend PC.</div></div></div><div class="panel" style="margin-top:16px"><div class="panel-head"><div><h3>Restore / Rollback Center — Verified Local Backups</h3><p>Select a backup, inspect it first, then choose exactly what to restore.</p></div></div><div class="table-wrap"><table class="table"><thead><tr><th>Date</th><th>Kind</th><th>File</th><th>Size</th><th>Action</th></tr></thead><tbody>${localRows}</tbody></table></div></div><div class="panel" style="margin-top:16px"><div class="panel-head"><div><h3>Restore from Personal Google Drive</h3><p>Backups visible to this OAuth app in the configured COOPLEDGER BACKUPS folder.</p></div></div>${rb.drive_error?`<div class="notice bad">Drive listing error: ${esc(rb.drive_error)}</div>`:''}<div class="table-wrap"><table class="table"><thead><tr><th>Drive Date</th><th>File</th><th>Size</th><th>Drive ID</th><th>Action</th></tr></thead><tbody>${driveRows}</tbody></table></div></div><div class="panel" style="margin-top:16px"><div class="panel-head"><div><h3>Rollback History</h3><p>Completed/failed restore attempts and their automatic safety backups.</p></div></div><div class="table-wrap"><table class="table"><thead><tr><th>Requested</th><th>Source</th><th>Backup</th><th>Components</th><th>Status</th><th>Safety Backup</th></tr></thead><tbody>${restoreRows}</tbody></table></div></div><div class="panel" style="margin-top:16px"><div class="panel-head"><div><h3>Backup History</h3><p>Manual, scheduled and pre-restore safety backups.</p></div></div><div class="table-wrap"><table class="table"><thead><tr><th>Date</th><th>Kind</th><th>Status</th><th>File</th><th>Size</th><th>SHA-256</th></tr></thead><tbody>${h.backups.map(x=>`<tr><td>${new Date(x.created_at).toLocaleString()}</td><td>${esc(x.kind)}</td><td><span class="status ${x.status.includes('VERIFIED')?'reconciled':'closed'}">${esc(x.status)}</span></td><td>${esc(x.file_name||'—')}</td><td>${x.file_size?numFmt(x.file_size/1024/1024)+' MB':'—'}</td><td class="mono">${esc((x.sha256||'').slice(0,20))}${x.sha256?'…':''}</td></tr>`).join('')}</tbody></table></div></div>`}

async function restoreInspect(source,backupId='',driveFileId='',fileName=''){try{toast('Inspecting and verifying backup…');const body={source};if(backupId)body.backup_id=Number(backupId);if(driveFileId)body.drive_file_id=decodeURIComponent(driveFileId);if(fileName)body.file_name=decodeURIComponent(fileName);const r=await api('/api/admin/restore/inspect',{method:'POST',body:JSON.stringify(body)});window.pendingRestore={...body,info:r};modal('Inspect Backup & Choose Rollback',`<div class="notice good"><strong>Backup passed integrity inspection.</strong><br>${esc(r.backup_name)} • v${esc(r.version)} • ${r.created_at?new Date(r.created_at).toLocaleString():'date unavailable'}<br><span class="mono">SHA-256 ${esc(r.sha256)}</span></div>${r.warning?`<div class="notice info">${esc(r.warning)}</div>`:''}<div class="panel" style="box-shadow:none;margin:12px 0"><h3 style="margin-top:0">Select what to restore</h3><label class="project-toggle" style="display:flex;margin:8px 0"><input type="checkbox" id="restoreDb" checked> <span><strong>Database & Accounting Data</strong><br><small class="muted">All projects, journals, loans, batches, consignment, rental bills, users, roles, settings stored in SQLite. Full cross-module database rollback; not per-table.</small></span></label><label class="project-toggle" style="display:flex;margin:8px 0"><input type="checkbox" id="restoreUploads" checked> <span><strong>Uploaded Files</strong><br><small class="muted">App/report logos and uploaded files contained in the backup.</small></span></label><div class="guide"><strong>Recommended:</strong> leave both checked for a true point-in-time rollback. Database-only is useful when uploaded files are unchanged. Uploads-only changes files without changing accounting data.</div></div><dl class="detail-list"><dt>Database</dt><dd>${r.database?.available?'Available • '+numFmt(Number(r.database.size||0)/1024/1024)+' MB':'Not available'}</dd><dt>Uploaded files</dt><dd>${r.uploads?.count||0} file(s) • ${numFmt(Number(r.uploads?.size||0)/1024/1024)} MB</dd><dt>Source</dt><dd>${esc(r.source)}</dd></dl><div class="field"><label>Super Admin Password — required</label><input class="input" id="restorePass" type="password" autocomplete="current-password"></div><div class="field"><label>Type RESTORE exactly</label><input class="input mono" id="restoreConfirm" autocomplete="off" placeholder="RESTORE"></div><div class="notice bad"><strong>Before applying:</strong> CoopLedger automatically creates a PRE_RESTORE_SAFETY backup. The backend then restarts; all active sessions are invalidated so everyone must log in again.</div>`,`<button class="btn soft" onclick="closeModal()">Cancel</button><button class="btn danger" onclick="startRestore()">Create Safety Backup & Roll Back</button>`,true)}catch(e){toast(e.message,'error')}}
async function startRestore(){const p=window.pendingRestore;if(!p)return toast('Select and inspect a backup first.','error');const restore_database=!!$('restoreDb')?.checked,restore_uploads=!!$('restoreUploads')?.checked;if(!restore_database&&!restore_uploads)return toast('Select Database, Uploaded Files, or both.','error');if(($('restoreConfirm')?.value||'').trim().toUpperCase()!=='RESTORE')return toast('Type RESTORE exactly to confirm.','error');try{const body={source:p.source,restore_database,restore_uploads,superadmin_password:$('restorePass').value,confirmation:$('restoreConfirm').value};if(p.backup_id)body.backup_id=p.backup_id;if(p.drive_file_id)body.drive_file_id=p.drive_file_id;if(p.file_name)body.file_name=p.file_name;const r=await api('/api/admin/restore',{method:'POST',body:JSON.stringify(body)});closeModal();modal('Safe Rollback Started',`<div class="notice info"><strong>${esc(r.message||'Safety backup created. Rollback is being applied.')}</strong></div><dl class="detail-list"><dt>Backup</dt><dd>${esc(r.backup_name||p.info?.backup_name||'')}</dd><dt>Restore</dt><dd>${restore_database?'Database':''}${restore_database&&restore_uploads?' + ':''}${restore_uploads?'Uploaded Files':''}</dd><dt>Safety Backup</dt><dd>${esc(r.safety_backup_name||'Created automatically')}</dd></dl><div class="guide">Ayaw i-close ang backend PC. The server will stop briefly, apply the staged rollback offline, verify/reopen the database, restart, then require a fresh login.</div><div class="empty" id="restoreWait"><strong>Waiting for CoopLedger to restart…</strong></div>`,'',true);setTimeout(()=>waitForRestoreRestart(Date.now()),3000)}catch(e){toast(e.message,'error')}}
async function waitForRestoreRestart(started){const box=$('restoreWait');try{const r=await fetch(state.api+'/api/health',{cache:'no-store'});if(r.ok){if(box)box.innerHTML='<strong>Rollback applied and backend is online.</strong><br>Reloading to secure login…';localStorage.removeItem('coop_token');setTimeout(()=>location.reload(),1200);return}}catch{}if(Date.now()-started>120000){if(box)box.innerHTML='<strong>Backend has not returned within 2 minutes.</strong><br>Check the backend console and BACKEND-LOCAL-CLOUDFLARE/backups/RESTORE-PENDING.json / restore-log. Your automatic safety backup remains available.';return}if(box)box.innerHTML='<strong>Applying rollback / restarting…</strong><br><span class="muted">This can take longer when uploaded files or Drive downloads are large.</span>';setTimeout(()=>waitForRestoreRestart(started),2000)}
async function pageSettings(){const b=state.branding||{},[sms,p02]=await Promise.all([api('/api/admin/sms-gate'),api('/api/admin/p02-settings')]),sp=sms.provider||{},sn=sms.notifications||{};window.smsGateCfg=sms;window.p02AdminSettings=p02;$('content').innerHTML=head('Branding & System Settings','White-label identity + secure SMSGate rental billing configuration')+`<div class="panel"><div class="panel-head"><div><h3>Cooperative Branding</h3><p>Applies to the app and generated reports.</p></div></div><div class="form-grid"><div class="field"><label>Cooperative Name</label><input class="input" id="bName" value="${esc(b.coop_name||'')}"></div><div class="field"><label>Short Name</label><input class="input" id="bShort" value="${esc(b.short_name||'')}"></div><div class="field span2"><label>Address</label><input class="input" id="bAddress" value="${esc(b.address||'')}"></div><div class="field"><label>Contact</label><input class="input" id="bContact" value="${esc(b.contact||'')}"></div><div class="field"><label>Email</label><input class="input" id="bEmail" value="${esc(b.email||'')}"></div><div class="field"><label>TIN</label><input class="input" id="bTin" value="${esc(b.tin||'')}"></div><div class="field"><label>CDA Registration No.</label><input class="input" id="bReg" value="${esc(b.registration_no||'')}"></div><div class="field span2"><label>Tagline</label><input class="input" id="bTag" value="${esc(b.tagline||'')}"></div><div class="field"><label>Primary Color</label><input class="input" id="bPrimary" type="color" value="${esc(b.primary_color||'#0f172a')}"></div><div class="field"><label>Secondary Color</label><input class="input" id="bSecondary" type="color" value="${esc(b.secondary_color||'#334155')}"></div><div class="field"><label>Accent Color</label><input class="input" id="bAccent" type="color" value="${esc(b.accent_color||'#0ea5e9')}"></div><div class="field"><label>Application Logo</label><input class="input" id="bLogo" type="file" accept="image/png,image/jpeg,image/svg+xml,image/webp"></div><div class="field"><label>Report Logo</label><input class="input" id="bReportLogo" type="file" accept="image/png,image/jpeg,image/svg+xml,image/webp"></div><div class="field span2"><label>Report Footer</label><input class="input" id="bFooter" value="${esc(b.report_footer||'')}"></div></div><div style="margin-top:16px"><button class="btn primary" onclick="saveBranding()">Save White-label Branding</button></div></div><div class="panel" style="margin-top:16px"><div class="panel-head"><div><h3>P02 — Rice Packaging & Consignment</h3><p>Set once; Project Managers inherit these values automatically.</p></div></div><div class="form-grid"><div class="field"><label>Standard Full Sack Weight (kg)</label><input class="input big-input" id="p02SackKg" type="number" min="1" max="100" step="0.01" value="${Number(p02.sack_kg||50)}"></div><div class="field"><label>Default Consignee Share / Discount (%)</label><input class="input big-input" id="p02CommPct" type="number" min="0" max="100" step="0.01" value="${Number(p02.consignee_commission_pct==null?15:p02.consignee_commission_pct)}"></div></div>${guide('Recommended default: 50 kg per full sack and 15% consignee share. Every new consignment snapshots the current percentage so changing settings later does not rewrite prior agreements. Accounting records the store share as Consignee Commission / Selling Expense while gross rice sales remain transparent.')}<div style="margin-top:16px"><button class="btn primary" onclick="saveP02Settings()">Save P02 Sales Settings</button></div></div><div class="panel" style="margin-top:16px"><div class="panel-head"><div><h3>SMSGate — Commercial Rental Billing</h3><p>Credentials stay on the backend PC. Automatic billing SMS uses a queued sender to avoid burst/queue problems.</p></div><span class="status ${sp.configured?'reconciled':'pending'}">${sp.configured?'Configured':'Needs credentials'}</span></div><div class="form-grid"><div class="field"><label>SMSGATE_USERNAME</label><input class="input" id="sgUser" value="${esc(sp.username||'')}"></div><div class="field"><label>SMSGATE_PASSWORD</label><input class="input" id="sgPass" type="password" placeholder="${sp.password_configured?'Saved — leave blank to keep':'Enter password'}"></div><div class="field span2"><label>SMSGATE_BASE_URL</label><input class="input mono" id="sgBase" value="${esc(sp.base_url||'https://api.sms-gate.app/3rdparty/v1')}"></div><div class="field"><label>SMSGATE_SIM</label><input class="input" id="sgSim" value="${esc(sp.sim||'')}" placeholder="1"></div><div class="field"><label>SMSGATE_EXPEDITED</label><select class="select" id="sgExp"><option value="1" ${sp.expedited?'selected':''}>true — expedited</option><option value="0" ${!sp.expedited?'selected':''}>false — normal</option></select></div><div class="field"><label>Automatic Tenant SMS</label><select class="select" id="rnEnabled"><option value="1" ${sn.sms_enabled?'selected':''}>Enabled</option><option value="0" ${!sn.sms_enabled?'selected':''}>Disabled</option></select></div><div class="field"><label>Send automatically after billing</label><select class="select" id="rnAuto"><option value="1" ${sn.auto_send_on_bill?'selected':''}>Yes</option><option value="0" ${!sn.auto_send_on_bill?'selected':''}>No</option></select></div><div class="field"><label>Include Water Details in SMS</label><select class="select" id="rnWater"><option value="1" ${sn.include_water?'selected':''}>Show water consumption</option><option value="0" ${!sn.include_water?'selected':''}>Hide water from SMS</option></select></div><div class="field"><label>Include Electricity Details in SMS</label><select class="select" id="rnElec"><option value="1" ${sn.include_electricity?'selected':''}>Show electricity consumption</option><option value="0" ${!sn.include_electricity?'selected':''}>Hide electricity from SMS</option></select></div><div class="field"><label>Due Days After Billing</label><input class="input" id="rnDue" type="number" min="0" max="60" value="${Number(sn.due_days||10)}"></div><div class="field"><label>Test Mobile Number</label><input class="input" id="sgTestPhone" placeholder="09XXXXXXXXX"></div></div>${guide('Monthly rental is always included in the SMS. Water/electricity visibility can be turned off here without changing the actual accounting bill. Example SMS shows previous→current meter, consumption, rate, charge, total and due date.')}<div class="quick-actions" style="margin-top:16px"><button class="btn primary" onclick="saveSmsGateSettings()">Save SMS Billing Settings</button><button class="btn soft" onclick="sendSmsTest()">Queue Test SMS</button><button class="btn soft" onclick="retrySmsQueue()">Retry Failed SMS</button></div></div>`}
async function saveP02Settings(){try{const r=await api('/api/admin/p02-settings',{method:'POST',body:JSON.stringify({sack_kg:Number($('p02SackKg').value||50),consignee_commission_pct:Number($('p02CommPct').value||0)})});window.p02AdminSettings=r;window.p02Settings=r;toast(`P02 settings saved: ${numFmt(r.sack_kg)} kg/sack • ${numFmt(r.consignee_commission_pct)}% consignee share.`)}catch(e){toast(e.message,'error')}}
async function saveSmsGateSettings(reload=true){try{const provider={username:$('sgUser').value,base_url:$('sgBase').value,sim:$('sgSim').value,expedited:$('sgExp').value==='1'};if($('sgPass').value)provider.password=$('sgPass').value;await api('/api/admin/sms-gate',{method:'POST',body:JSON.stringify(provider)});await api('/api/admin/rental-notifications',{method:'POST',body:JSON.stringify({sms_enabled:$('rnEnabled').value==='1',auto_send_on_bill:$('rnAuto').value==='1',include_water:$('rnWater').value==='1',include_electricity:$('rnElec').value==='1',due_days:Number($('rnDue').value||10)})});toast('SMSGate and rental notification settings saved.');if(reload)loadPage()}catch(e){toast(e.message,'error');throw e}}
async function sendSmsTest(){try{const phone=$('sgTestPhone').value;if(!phone)return toast('Enter a test mobile number first.','error');await saveSmsGateSettings(false);const r=await api('/api/admin/sms/test',{method:'POST',body:JSON.stringify({phone,message:`${state.branding?.short_name||'CoopLedger'} SMSGate test. Automatic rental billing notifications are ready.`})});toast(r.queued?'Test SMS queued.':'Unable to queue SMS.','success')}catch(e){toast(e.message,'error')}}
async function retrySmsQueue(){try{await api('/api/admin/sms/retry',{method:'POST',body:'{}'});toast('Failed/waiting SMS messages queued for retry.')}catch(e){toast(e.message,'error')}}
function fileData(file){return new Promise((res,rej)=>{if(!file)return res(null);const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)})}
async function saveBranding(){try{const lf=$('bLogo').files[0],rf=$('bReportLogo').files[0],body={coop_name:$('bName').value,short_name:$('bShort').value,address:$('bAddress').value,contact:$('bContact').value,email:$('bEmail').value,tin:$('bTin').value,registration_no:$('bReg').value,tagline:$('bTag').value,primary_color:$('bPrimary').value,secondary_color:$('bSecondary').value,accent_color:$('bAccent').value,report_footer:$('bFooter').value};if(lf){body.logo_data=await fileData(lf);body.logo_name=lf.name}if(rf){body.report_logo_data=await fileData(rf);body.report_logo_name=rf.name}const b=await api('/api/admin/branding',{method:'POST',body:JSON.stringify(body)});setBrand(b);renderApp();toast('Branding updated across the system.')}catch(e){toast(e.message,'error')}}
function passwordModal(required=false){
  modal(required?'Required Password Change':'Change Password',`<div class="notice ${required?'info':'good'}">${required?'For security, the one-time bootstrap/temporary password must be replaced before regular use.':'Choose a strong new password.'}</div><div class="field"><label>Current Password</label><input class="input" type="password" id="pwCurrent"></div><div class="field"><label>New Password</label><input class="input" type="password" id="pwNew"><small class="muted">10+ characters with uppercase, lowercase, number, and symbol.</small></div>`,required?'':`<button class="btn soft" onclick="closeModal()">Cancel</button>`);
  if(required){const bd=document.querySelector('.modal-backdrop');bd.onclick=()=>{};const x=document.querySelector('.modal-head .icon-btn');if(x)x.remove();const f=document.createElement('div');f.className='modal-foot';f.innerHTML='<button class="btn primary" onclick="savePassword(true)">Set New Password</button>';document.querySelector('.modal').appendChild(f)}
  else document.querySelector('.modal-foot').insertAdjacentHTML('beforeend','<button class="btn primary" onclick="savePassword(false)">Change Password</button>');
}
async function savePassword(required){try{await api('/api/auth/change-password',{method:'POST',body:JSON.stringify({current_password:$('pwCurrent').value,new_password:$('pwNew').value})});state.user.must_change=false;closeModal();toast('Password changed successfully.')}catch(e){toast(e.message,'error');if(required)passwordModal(true)}}
async function showNotifications(){try{const r=await api('/api/notifications');modal('Notifications',r.notifications.length?r.notifications.slice(0,50).map(n=>`<div class="audit-item"><strong>${esc(n.title)}</strong><small>${new Date(n.created_at).toLocaleString()} • ${esc(n.type)}</small><div style="font-size:12px;margin-top:5px">${esc(n.message)}</div></div>`).join(''):'<div class="empty">No notifications yet.</div>',`<button class="btn primary" onclick="closeModal()">Close</button>`)}catch(e){toast(e.message,'error')}}
async function refreshBadges(){try{const [n,a]=await Promise.all([api('/api/notifications'),roleIs('SUPERADMIN')?api('/api/approvals?status=PENDING'):Promise.resolve({requests:[]})]);const cnt=n.notifications.filter(x=>!x.read_at).length;if($('notifBadge')){$('notifBadge').textContent=cnt;$('notifBadge').classList.toggle('hidden',!cnt)}if($('approvalNavBadge')&&a.requests.length)$('approvalNavBadge').innerHTML=`<span class="status pending">${a.requests.length}</span>`}catch{}}
function connectSocket(){try{if(state.socket)state.socket.disconnect();const old=document.getElementById('socketClient');if(old)old.remove();const s=document.createElement('script');s.id='socketClient';s.src=state.api+'/socket.io/socket.io.js';s.onload=()=>{state.socket=io(state.api,{transports:['websocket','polling']});state.socket.on('connect',()=>{if($('liveText'))$('liveText').textContent='Live sync';if($('liveDot'))$('liveDot').style.background='#4ade80'});state.socket.on('disconnect',()=>{if($('liveText'))$('liveText').textContent='Reconnecting…';if($('liveDot'))$('liveDot').style.background='#f59e0b'});['transaction:created','transaction:updated','financials:updated','approval:approved','approval:rejected','branding:updated','backup:completed','notification:new','consignment:updated','p02:settings-updated','rental:billing-updated','sms:queued','sms:updated'].forEach(ev=>state.socket.on(ev,data=>{if(ev==='branding:updated'){setBrand(data);renderApp();return}refreshBadges();if(['dashboard','transactions','financials','approvals','backup'].includes(state.page))debouncedReload()}))};s.onerror=()=>{if($('liveText'))$('liveText').textContent='API online • live retry';setTimeout(connectSocket,5000)};document.head.appendChild(s)}catch{}}
let reloadTimer;function debouncedReload(){clearTimeout(reloadTimer);reloadTimer=setTimeout(()=>loadPage(),350)}
window.addEventListener('resize',()=>{if(state.page==='dashboard')debouncedReload()});
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
init();
</script>
</body></html>
